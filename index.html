 材料和设备【国金新材料&建材李阳团队】", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "自主可控的 AI 材料和设备【国金新材料&建材李阳团队】", "text": "半导体设备国产替代进度：刻蚀、CVD、PVD设备：国内技术与海外差距为1-2个世代，是设备领域赶超速度最快的品类，自主可控并超越海外的可能性较高 光刻机 前道EUV光刻机技术完全由荷兰阿斯麦垄断，国内暂无相关技术能力 前道DUV光刻机分为干式和浸没式两类，干式DUV光刻机已实现自主可控，上海微电子、宇量升均有相关技术积累，可适配成熟制程；浸没式DUV光刻机目前已推出客户端验证，等待验收结果 后道光刻机以上海微电子的产品为主，市占率约60%-70%；直写式（LDI）光刻机目前应用占比较低，芯碁微装、源卓、影速的直写光刻机可用于先进封装、MEMS等场景，制程覆盖0.15μm-0.5μm，适配对产能要求不高的产线 先进封装相关设备 磨划切设备全球由日本DISCO垄断，市占率约70%，国内大族、迈为、光力科技合计市占率不足30% 后道测试设备由日本Advantest、美国Teradyne垄断，合计市占率超60% 国内2.5D先进封装当前月产能约1.5万片，预计2026年Q4月产能提升至2万片，同比增长约33%；2027年底规划月产能达3万片，将在上海临港扩建新产能，主要面向HBM、3D封装等AI相关工艺 先进封装核心技术难点为堆叠键合、激光钻孔环节 光刻机零部件-光栅尺：高精度光栅尺主要由德国、美国供应，华卓精科研发的配套光刻机的光栅系统定位精度达±0.2纳米，海普微、禹衡光学的产品可满足后道封装设备需求｜静电卡盘（ESC）行业情况：市场空间与竞争格局：当前国内静电卡盘市场规模约23-31亿美元，随着国产半导体设备导入加速，市场规模将进一步扩张 产品成熟度：国内8寸、12寸（带/不带加热）静电卡盘技术已相对成熟，代表厂商包括中瓷电子、珂玛、华卓精科、江丰电子等 技术差距 材料端：氮化铝粉体的纯度、精度不足，限制了产品在12寸先进制程场景的应用 设计端：内部气道设计能力较弱，易导致晶圆吸附不均，出现微米级倾斜，影响工艺精度 配套部件：加热器技术积累不足，多数厂商仍依赖进口加热器 工艺端：烧结工艺的配方、参数等know-how积累不足，导致产品良率偏低 国内厂商技术特点：当前国内厂商尚未实现全流程工艺自主可控，多以工艺整合为主；其中珂玛在氧化铝陶瓷材料领域技术较强，可自主生产氧化铝粉体；华卓精科侧重ESC整体工艺设计、组装，加热器等部件对外采购 下游验证进度 8寸静电卡盘无进口限制，下游验证顺畅，国内头部厂商已基本通过验证 12寸静电卡盘已进入长存等国内头部晶圆厂供应链，华卓精科、中瓷电子已验证通过；珂玛与中微公司、北方华创等设备厂商合作紧密 替换与升级周期 替换周期：根据产线射频（RF）使用次数决定，月产能5万片左右的晶圆厂，静电卡盘更换周期约为半年 升级方向：当前技术迭代集中在加热均匀性提升，加热分区数量持续增加（从10区向20区、30区升级），短期5年内无颠覆性技术迭代｜半导体材料国产替代与供需情况：前道核心材料 光刻胶：KrF光刻胶已基本实现自给自足；ArF光刻胶仅南大光电等少数厂商可覆盖非先进制程场景，先进制程光刻胶仍依赖进口 光刻机耗材：激光器（laser）、光学模块等耗材国内技术薄弱，且属于消耗品，需定期更换，成本较高 靶材：国产化程度较高，江丰电子等厂商产品可满足需求 后道先进封装核心材料 DAF膜（绝缘/高导热型）：国内技术性能不足，进口依赖度高，上海新阳为国内主要布局厂商 磨划切耗材：硬切割刀、磨片刀基本由日本DISCO垄断，国内产品在寿命、稳定性上存在差距，易出现切歪、断刀等问题 电镀液、清洗液：国产化程度较高，可满足需求 价格趋势 2026年上半年先进封装用金属类耗材（金线、铜、铝等）跟随大宗商品涨价，下半年除金线外，铜、铝等金属耗材价格预计不会继续上涨，或随原油价格回落下降 若后续日本出口限制升级，光刻胶、高纯化学品、氮化铝粉体等日本优势材料存在涨价可能 2026年6-7月封装价格已上涨一次，下半年封测代工价格预计仅会微涨，不会出现大幅调价"}, {"label": "私域补充", "text": "另收藏纪要：信义玻璃26H1业绩交流及展望；海外银行二季报业绩亮点；北京新政的影响和板块观点；《保险资负匹配新规，盈利的稳定来自资负的…；深度专题报告：手续费收入图谱：轻资本布局…"}], "source": "private", "stocks": ""}, {"title": "国泰海通【地产新纪元十八讲】｜物业财报研究框架——“从迷雾走向精深”系列", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国泰海通【地产新纪元十八讲】｜物业财报研究框架——“从迷雾走向精深”系列", "text": "物业行业基础特征与基本面：行业定位：属于地产产业链下游行业，近年受地产开发影响，营收增速有所放缓，利润端出现一定下滑 核心业务特征： 业务具备永续经营、可循环属性：收入=在管面积×单平米物业费，在管面积不会随年末结算清零，行业合约续约率超85%，能够持续稳定贡献收入与现金流 轻资产、现金流表现优异：截至2025年，在手现金超100亿元的上市物企为碧桂园服务、万物云、保利物业；2019-2025年样本公司经营性现金流对净利润的覆盖率均值为0.8-1.5倍，净利润基本可以转化为真实现金流入 财报分析核心关注方向： 利润表：重点关注收入增速变化、资产减值（商誉、应收）对利润率的影响 资产负债表：重点关注应收账款、商誉减值带来的风险 现金流量表：重点关注经营性活动现金流、在手现金规模及可持续分红能力｜近年行业业绩表现与分化：行业发展阶段变化：2014-2021年为物业股高速增长期，在管面积、营收规模均保持高增速；2021年起资本市场表现持续走弱，核心原因是受地产开发端影响，市场担忧企业利润走势 近年财报核心特征：营收增速放缓、利润同比下降、企业分化加剧，2022年起行业增收不增利现象明显增加 2025年样本企业中，约一半企业处于“营收下降、净利润下降”区间，另一半大部分处于“营收上升、净利润下降”区间，仅保利、绿城、华润万象生活、滨江、建发物业、彩生活实现增收又增利｜基础物业管理板块：业务构成：收入=在管面积×物业费单价，是物企核心基本盘，目前收入占比约70%，后续占比仍有上升空间 在管面积来源： 关联方贡献：占比约55%，受地产开发行业下行影响，关联方面积供给下滑，是近年营收增速放缓的核心原因之一 第三方外拓：已成为行业重要战略发展方向，尤其是母公司出险的物企，对第三方外拓的依赖度大幅提升 板块经营数据：近年收入增速为8%-11%，合理利润率区间为10%-15% 2025年重点公司表现： 重点公司在管面积平均同比增速约4%，进入中低速成长区间；碧桂园服务、保利物业在管规模超8亿平米 建发物业、绿城服务2025年在管面积实现双位数增长，增速领跑板块 板块投资跟踪要点：优先关注在管面积绝对规模靠前、母公司销售规模维持千亿以上（关联方面积供给稳定）、第三方外拓能力强的企业"}], "source": "private", "stocks": ""}, {"title": "非银投资全景系列01期：非银金融行业研究方法", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "东吴非银 | 非银投资全景系列01期：非银金融行业研究方法", "text": "AI架构演进研究方法：AI代际划分： AI1.0时代：核心成果是单点任务精度提升，代表任务包括图像识别、语音识别、目标检测，但不同任务对应不同模型和工程链条。AI2.0时代（Transformer开启）：同时扩展了任务广度、复杂度、任务链长度，支持单模型学习知识、迁移任务、理解复杂指令，逐步形成跨任务通用底座。｜Transformer成为数字AI通用底座的核心逻辑 Transformer对比传统架构的核心优势： CNN、RNN内置强归纳偏置（如CNN的局部性、权重共享、平移等变，RNN的递归、时序依赖），小数据下样本效率高，但约束了跨任务通用性和规模扩展能力。｜数字AI向物理AI（以智驾为代表）的迁移逻辑 迁移阶段划分： 第一阶段：架构理念迁移，将注意力机制、序列建模应用于智驾感知和轨迹预测，形成矢量化表示、BEV+Transformer统一时空表征、UniAD端到端架构，仅借鉴建模方法，不复用模型。"}], "source": "private", "stocks": ""}]}, {"name": "稳定类", "emoji": "稳", "overview": "AI电力瓶颈沿HVDC/服务器电源/变压器/分布式能源传导，潍柴系AIDC电源与SOFC分布式发电受关注；电网与AIDC电力景气确定性延续，环保再生金属供需趋紧。", "topics": [{"title": "掘金个股系列：再看潍柴系列：转型拐点已现， AIDC电源时代开启", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江汽车 | 掘金个股系列：再看潍柴系列：转型拐点已现， AIDC电源时代开启", "text": "潍柴AIDC电源业务核心逻辑变化：行业认知迭代：此前市场认为AIDC主发电领域燃气发动机是燃气轮机产能不足带来的需求外溢的二线品种，目前北美客户实际更倾向选择工业燃气轮机、燃气发动机、SOFC三类方案，燃气发动机已成为AIDC主发电的核心可选方案之一，产业地位从二线升维至一线，与燃气轮机形成差异化竞争格局。｜AIDC电源行业需求情况：北美数据中心电力需求测算：市场此前预计2027年北美数据中心装机约30吉瓦，考虑电力冗余系数后，实际对应的电力需求超过30吉瓦，甚至可达40吉瓦，缺电是制约北美AI发展的核心因素之一，缺电链景气度持续向上。｜潍柴业务及业绩测算：AIDC电源业务： 燃气发动机：2027年需求预期约5-6吉瓦，该业务可支撑约3000亿市值。SOFC：公司已规划1吉瓦产能，对应估值约100亿美金（约700亿人民币市值）。"}], "source": "private", "stocks": ""}, {"title": "山高环能：餐厨资源化龙头并购引领成长，UCO稀缺增值+降本提效弹性大", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "东吴环保公用 | 山高环能：餐厨资源化龙头并购引领成长，UCO稀缺增值+降本提效弹性大", "text": "UCO行业核心基本面：长期需求逻辑：受SAF（可持续航空燃料）长期需求驱动，仅欧洲市场到2050年SAF需求就有35倍的增长空间，叠加其他国家新增需求共振，UCO作为SAF核心原料将迎来长期需求高增。｜山高环能经营及产能现状：产能规模： 2020年公司收购十方环能切入餐厨资源化业务，通过持续并购，2025年底餐厨垃圾运营产能达5610吨/日，较2020年增长5倍；2026年5月披露收购衡阳项目，完成后运营产能将提升至5870吨/日。｜公司未来成长驱动因素：定增落地支撑外延扩张： 公司拟向山东高速集团全资子公司高速产投定增募资6.5亿元，扣除发行费用后用于偿还银行借款；定增完成后控股股东将变更为高速产投，山高光伏及一致行动人合计持股超40%，实控人仍为山东省国资委，国资属性进一步增强。"}], "source": "private", "stocks": ""}, {"title": "快递行业研究框架", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "财通交运 | 快递行业研究框架", "text": "快递行业基础商业模式与模式分类：快递行业采用轴辐式网络结构，由80-90个分拨中心连接3000多条干线运输路线，再通过上万条支线运输至3万多个网点，最终由300多万快递员通过几十万条末端派送路线完成配送，各环节成本与报价体系复杂，研究难度较高。｜直营板块整体格局：国内直营快递共3家，分别为上市企业顺丰控股、京东物流，以及非上市的中国邮政/EMS，赛道玩家少，整体格局优于加盟板块。｜顺丰控股相关情况：行业地位：顺丰在高端时效件领域市占率达2/3，处于寡头地位，其收入增速基本代表高端时效件行业增速。业绩表现： 收入端：整体保持大个位数增长，2026年Q1收入增速为6%，略低于快递行业同期7%的增速，主要受消费降级、商家对快递费敏感度提升影响。"}], "source": "private", "stocks": ""}, {"title": "英伟达投资30亿美元锁定AI数据中心电力", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "英伟达于8月8日至9日宣布拟向德州“星际之门”AI园区的电力供应商Lancium投资高达30亿美元，这一举动标志着AI竞赛的核心瓶颈已从算力芯片转向电力资源。最新的市场解读是，此举不仅是为GPU客户锁定稀缺的电力并网配额，更是通过资本下场为整个AI基础设施扩张提供确定性，AI资本开支正沿着“算力→电力”的路径向下游的供配电、变压器及分布式能源等环节全面扩散。"}, {"label": "相关标的", "text": "麦格米特、金盘科技、潍柴动力、三环集团、春晖智控、民德电子"}], "source": "hot", "stocks": "麦格米特、金盘科技、潍柴动力、三环集团、春晖智控、民德电子"}]}, {"name": "总量", "emoji": "总", "overview": "美7月就业疲软+油价回落，市场对9月加息概率降至44%左右、纳指与科技股引领创新高；两年AI资本开支或达2万亿美元，本周CPI/PPI为关键变量。", "topics": [{"title": "外资策略：从北上到QFII", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江金工 | 外资策略：从北上到QFII", "text": "外资持仓整体背景与趋势：外资相比国内机构增量资金属性更明显，且更偏向中长期投资，对优质标的筛选具备优势，且2023年-2026年持续有外资支持相关政策出台。成熟市场外资占比持续提升：美股市场外资占比2023年为13.3%，仅次于共同基金；2025年四季度已升至19%，超过共同基金，在机构投资者中占比约60%。｜A股外资投资渠道特征对比：A股外资投资共三类渠道，其中二级市场投资以QFII/RQFII、互联互通（北上资金）为主： QFII/RQFII：2002年引入QFII，2011年启动RQFII，2019年取消投资额度，2020年两类资格正式合并，投资范围无特殊限制，持仓风格更偏中长期。｜北上资金持仓特征与策略效果：持仓特征： 行业偏好变动：2024年一季度北上资金偏好食品饮料、新能源、医药、银行、家电、电子，2026年当前偏好已转变为新能源、银行、电子、医药，整体风格始终偏向大市值个股。"}], "source": "private", "stocks": ""}, {"title": "行业配置模型回顾与更新系列（三十三）", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "太平洋金工｜ 行业配置模型回顾与更新系列（三十三）", "text": "当前市场行情现状：近期市场整体走势分化：前期大幅上涨的科技类行业出现疲势，从较长时间维度看已出现回调，当前在小范围内呈小幅震荡态势，会议当日科技板块出现小幅反弹；消费及其他低估值行业近期则有所回升。｜双位点版本缺陷：双位点版本设计逻辑：设置左侧+右侧两个点位，目的是在回调止损后重新进场时提供双向选择，相当于增加一层保险，若市场不是极端黑天鹅一次性涨破前高，右侧点位可成交以弥补提前踏空的可能性；同时在下方设置回调型左侧点位，若市场回调过左侧进场位置可获得额外超额收益，且能规避止损到重新入场之间的大幅波动风险，节省的资金可用于其他操作。｜多位点版本缺陷：多位点版本设计逻辑：去掉突破位，设置三个左侧进场位置，每一次突破后该位置会成为备选的右侧买点，理论上可以找到行情下跌过程中的最优成交位置。"}], "source": "private", "stocks": ""}]}, {"name": "其他", "emoji": "他", "overview": "未单列主线的交叉主题。", "topics": [{"title": "如何看待近期白鸡价格上涨？", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "华福农业 | 如何看待近期白鸡价格上涨？", "text": "白羽鸡产业链价格上涨表现：商品代鸡苗价格表现： 截至2026年8月10日，行业鸡苗均价为3.26元/羽，较6月底2元/羽的低位上涨1.3元/羽，涨幅接近63%。头部企业报价表现优于行业平均，益生股份官网鸡苗报价已达4元/羽，较6月底3.1元/羽的水平上涨接近1元/羽，实际成交价略低于挂牌价但整体处于较高水平。｜本轮白鸡价格上涨核心原因：毛鸡价格上涨原因： 供给端：高温天气下部分养殖户提前出栏透支后续鸡源供给，立秋后天气转凉养殖户压栏意愿提升，导致屠宰端收鸡出现缺口。｜白鸡价格后续展望：短期（8-9月）展望： 鸡苗价格预计维持相对高位，回调幅度有限：高温造成的种鸡生产性能下降影响尚未完全消除，鸡苗供应仍偏紧；天气转凉后养殖端补栏需求改善，国庆前出栏的毛鸡对应当下补栏需求仍然存在；头部企业因种鸡性能、客户结构更优，价格韧性强于行业平均。"}], "source": "private", "stocks": ""}, {"title": "7月能繁母猪存栏延续去化态势", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "尽管过去几日公布的7月能繁母猪存栏数据在不同口径下（环比-0.01%至-1.48%）出现分歧，造成市场短期扰动，但核心矛盾已转向仔猪价格崩溃和全产业链深度亏损。这种现金流压力正在触发一轮非意愿、市场化的强制性产能出清，这比任何月度数据都更能确认供给收缩的确定性，从而强化了2027年行业盈利迎来反转的预期。"}, {"label": "相关标的", "text": "温氏股份、新希望、华统股份、德康农牧、天康生物"}], "source": "hot", "stocks": "温氏股份、新希望、华统股份、德康农牧、天康生物"}]}]}, "2026-08-12": {"meta": {"date": "2026-08-12", "weekday": "周三", "run_at": "2026-08-12T07:30:00+08:00", "is_trading_day": true, "window_private": {"start": "2026-08-11T00:00:00+08:00", "end": "2026-08-12T07:30:00+08:00"}, "window_public": {"start": "2026-08-11T00:00:00+08:00", "end": "2026-08-12T07:30:00+08:00"}, "private_counts": {"favorite": 88, "appointment": 0}, "topic_count": 42, "notes": ["私域窗口T-1(08-11 00:00)至今", "蓝宝书国内08-12批次1晨报", "国际蓝宝书08-11", "纪要热度榜08-12", "私域入种子未逐条铺卡", "分类按正文", "私域纪要用原始会议标题+提炼要点", "无说明板块"]}, "industries": [{"name": "AI链", "emoji": "AI", "overview": "工业富联中报AI机柜出货翻三倍、鹏鼎光模块PCB收入增11倍验证硬件兑现；源杰投42亿扩产高端光芯片、MLCC新一轮涨价落地大客户、强瑞定增加码液冷；英伟达联手六大机构为AI基建融资+投资电力开发商，算力→电力→PCB/光模块链条景气共振。", "topics": [{"title": "海外半导体设备WFE：AI驱动空间与关键标的拆解", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国泰海通海外科技十八讲｜海外半导体设备：WFE市场空间、重要标的拆解", "text": "半导体设备行业投资逻辑与市场规模预判：底层投资逻辑：AI长期发展需要应用渗透率提升，token长期呈通缩趋势，上游帮助下游实现token降本、提升推理效率的环节具备长期配置价值，包括先进制程晶圆代工厂（台积电、英特尔）以及更上游的半导体设备厂商；这两个环节虽无强涨价逻辑，股价弹性弱于涨价品种，但长期配置价值突出，当前是美股首推板块。｜2026年Q2半导体设备行业共性趋势：行业规模上修+长期能见度提升：2026年WFE规模持续上修，泛林、科磊均将2026年WFE预期上调至1500亿美元附近；2027年订单及客户需求交流已非常具体，部分需求延伸至2028年；阿斯麦宣布2027、2028年EUV和浸没式DUV每年扩产30%，印证需求可见度。｜下游客户扩产规划（量增逻辑）：台积电：确定性最强、规模最大的扩产主体 资本开支规划：2026年资本开支上调至600-640亿美金，其中70%-80%用于先进制程扩产（约500亿美金），80%用于前道设备，2026年贡献约400亿美金WFE规模；预计2027年资本开支强度同比持平，capex达800亿美金（同比增长30%），对应WFE增长至520亿美金；2028年capex预计接近千亿美金。"}, {"label": "相关标的", "text": "北方华创、中微公司、拓荆科技、盛美上海"}], "source": "private", "stocks": "北方华创、中微公司、拓荆科技、盛美上海"}, {"title": "Vera Rubin最佳进攻路线：AI算力硬件迭代受益链", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国金证券 | VERA RUBIN，最佳进攻路线——掘金AI算力电话会议第49期", "text": "AI：PCB行业趋势与投资要点 行业景气度与业绩趋势：AI PCB行业高景气确定性强，上半年拉货节奏放缓不改变行业本质，下半年业绩环比增速加速趋势明显。产品价值量提升： 英伟达Vera Rubin单GPU的PCB价值量增幅超过100%，谷歌V8系列相对V7价值量增长400%以上，乘数效应进一步显现。｜英伟达Vera：Rubin产业链投资要点 产品核心优势：Vera Rubin机柜相比上一代Grace Blackwell性能提升10倍，token吞吐效率为GB的10倍，单token成本降低至之前的1/10，投资回报周期大幅缩短：模型厂商采购服务器回本周期最快仅10个月；1G瓦数据中心建设成本约500亿美金，头部模型厂商可通过token销售实现1年回本，xAI建设的1G瓦算力也可实现年入300亿美金。｜mSAP：PCB设备行业投资要点 行业边际变化：1.6T光模块PCB线宽间距要求达到15微米以下，原有工艺无法满足，mSAP工艺因电镀均匀性、刻蚀精准度达标成为确定性方案，将受益于1.6T放量带来的需求增长。"}, {"label": "相关标的", "text": "中际旭创、新易盛、沪电股份、工业富联"}], "source": "private", "stocks": "中际旭创、新易盛、沪电股份、工业富联"}, {"title": "工业富联上半年AI机柜出货翻三倍", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月12日凌晨发布的2026年中报，工业富联正式披露上半年GPU及ASIC AI机柜出货量分别猛增3.2倍和3倍，净利润同比大增96%，以超预期的业绩兑现了AI算力基础设施从订单到交付的强劲增长。这一业绩不仅验证了AI服务器需求的强度，更关键的是揭示了公司通过从部件供应向量产整机柜系统整合的跃迁，实现了单柜价值量和利润率的双重提升，同时其在下一代Rubin平台凭借自动化制造优势有望进一步扩大市场份额，构筑了清晰的盈利增长路径。"}, {"label": "相关标的", "text": "工业富联、胜宏科技、沪电股份、中际旭创、恒林股份"}, {"label": "私域补充", "text": "另收藏纪要：坚定信心与反攻节奏；国投中鲁深度：战略转型半导体“卖铲人”；超纯应材新股发行上市仪式；PCB框架：把握AI优势产业链等"}], "source": "hot", "stocks": "工业富联、胜宏科技、沪电股份、中际旭创、恒林股份"}, {"title": "源杰科技拟投42亿扩产高端光芯片", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月11日晚间，源杰科技公告拟在陕西投建42.7亿高端光芯片产业园，这是继2月后新一轮针对2028-2029年需求的产能布局，以应对CPO等技术驱动下高功率CW光源的持续供不应求。此举被视为对远期需求能见度极高的强力验证，标志着国产高端光芯片从替代逻辑正式迈向全球份额争夺阶段。"}, {"label": "相关标的", "text": "源杰科技、中际旭创、新易盛、仕佳光子、长光华芯"}], "source": "hot", "stocks": "源杰科技、中际旭创、新易盛、仕佳光子、长光华芯"}, {"title": "英伟达联手六大金融机构为AI基建融资", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月11日，英伟达联合黑石、高盛等六大金融机构宣布签署谅解备忘录，计划动员超5000亿美元第三方资本，旨在将AI数据中心从企业资本开支项转变为可被长期资本投资的、标准化的基础设施资产。此举通过金融工程为GPU的长期需求提供了保障，但同时也将硬件快速迭代的贬值风险从科技公司资产负-债表转移至更广泛的信贷市场，信用衍生品市场已开始对此新结构进行风险定价。"}, {"label": "相关标的", "text": "英伟达、贝莱德、黑石集团、高盛、中恒电气、科华数据"}], "source": "hot", "stocks": "英伟达、贝莱德、黑石集团、高盛、中恒电气、科华数据"}, {"title": "SK海力士重启大连NAND二期工厂建设", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月11日晚间，SK海力士确认重启已停滞四年的中国大连NAND二期工厂建设，计划于2027年上半年投产，新增5万片/月的低层堆叠成熟制程产能。此举不仅是存储行业景气复苏的强力佐证，更关键的投资逻辑在于，它标志着海外大厂在华晶圆厂将形成韩国高层堆叠、中国低层堆叠的“双轨生产”格局，并因全球设备交付紧张而首次大规模向中国本土设备及零部件厂商采购，为国产供应链出海打开了实质性突破口。"}, {"label": "相关标的", "text": "富创精密、茂莱光学、新莱应材、屹唐股份、盛美上海、中微公司、华海清科、华峰测控"}], "source": "hot", "stocks": "富创精密、茂莱光学、新莱应材、屹唐股份、盛美上海、中微公司、华海清科、华峰测控"}, {"title": "鹏鼎控股上半年光模块PCB收入增11倍", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月12日鹏鼎控股正式披露的半年报，以确凿 上半年销量合计超过31万吨，其中双酚A销量同比增长185%；合计出口1.74万吨，其中环氧树脂出口量同比增长35%，双酚A出口量同比增长240%，营收及毛利同比向好。"}, {"label": "私域纪要", "title": "华安化工 | 中化国际中报业绩交流", "text": "2026年上半年整体经营业绩：营收与利润：上半年实现营收235亿元，同比下降3%；实现归母净利润-2.81亿元，较上年同期减亏6.05亿元；化工产业收入同比增长6%，毛利较上年同期增长3.88亿元，营销平台毛利增长3.37亿元，为利润增长主要贡献来源。｜行业环境与公司业务架构：行业景气度：上半年受原料成本推升及阶段性供需改善影响，国内化工行业景气度短暂回升，公司主要原料和产品价格多数同比上涨；主要产品平均价格变动：环氧丙烷同比增长25%，ECH同比增长31%，环氧树脂和尼龙66同比增幅13%，双酚A同比增幅2%，防老剂6PPD同比下降7%。｜中间体板块：上半年延续减亏趋势，核心产品均价同比上涨13%，毛利率大幅提升9个百分点，酚酮、硝基氯苯、一氯苯等多个产品毛利优于上年同期。1000吨乙烯马来酸酐交替共聚物（EMA）项目已于7月投产，将贡献收入与盈利增量。"}, {"label": "私域纪要", "title": "天风电新 | 盛弘股份26年半年报交流会议纪要", "text": "26年上半年整体经营业绩：26年上半年公司实现营业收入17.59亿元，同比增长29%；归母净利润2.28亿元，同比增长44%；扣非净利润2.28亿元，同比增长50%。分业务收入情况： 电能质量业务收入4.4亿元，同比增长58%。储能业务收入3.84亿元，同比增长35%，毛利率达38%，回到接近2022年的水平。｜电能质量业务情况：增长驱动因素：海外数据中心、工商业固定资产投资强度较高，欧美地区需求增速快，是主要增长来源。收入结构：上半年电能质量业务海外收入占比约50%，包含海外AIDC相关订单；国内收入主要增量来自半导体和数据中心领域，其余行业资本开支多为负增长。｜储能业务情况：增长及毛利率修复原因： 2024年三季度公司主动调整储能战略，收缩国内低质量业务，重点开拓北美、欧洲、拉美、东亚及东南亚大型工商储市场，项目周期多在1.5年以上，26年起前期布局项目逐步落地。25年上半年储能收入基数较低，且以国内收入为主，26年海外市场拓展成效显现，收入端恢复增长。"}, {"label": "私域纪要", "title": "天风电新 | 元征科技2026年中期业绩公告交流会", "text": "2026年上半年整体业绩情况：营收端：2026年上半年公司克服原材料成本上涨、人民币对美元升值导致汇兑损失的经营压力，实现总营业收入10.7亿元，同比增长9.1%；主营业务收入10.5亿元，同比增长9.6%。｜分业务板块业绩与发展情况：硬件设备业务： 2026年上半年实现收入9亿元，同比增长3%，毛利率39%，同比有所下降。未来规划：应用AI、机器人技术带动销售增长，扩大诊断设备全球市占率；优化供应链对冲原材料价格波动，维持高毛利率；加大新能源设备研发和市场投入，保持行业领先地位。｜分区域业务情况：整体海外业务： 2026年上半年海外收入创历史同期新高，实现8.1亿元人民币，同比增长13%，占总营收比重提升至77%（两三年前占比约50%），毛利率达49%。"}, {"label": "相关标的", "text": "中化国际、万华化学、华鲁恒升"}], "source": "private", "stocks": "中化国际、万华化学、华鲁恒升"}, {"title": "视觉骨干CNN vs ViT：多模态与端侧落地含义", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "东吴汽车 | AI系列深度07期：CNN与ViT两类视觉骨干有何差异？", "text": "视觉骨干网络核心定位：视觉骨干网络是机器视觉系统的表征底座，承担将原始像素编码为可供分类、检测、分割等任务调用的高层语义特征的功能，CNN和ViT是两类主流的视觉表征获取路径，二者的技术路线之争本质影响的是整个视觉任务的通用表征底座选择，而非单一任务的模型选择。｜CNN核心机制与优势：核心计算逻辑：卷积核在图像局部区域滑动并做加权求和，检测边缘、颜色、纹理等局部模式，浅层卷积捕捉低级视觉特征，深层卷积组合形成部件、物体、场景的语义特征，多组卷积核生成的特征图记录不同视觉模式在空间位置的响应强度；池化层负责降低采样、增强局部稳定性，通过保留局部区域最大值/平均值降低特征图分辨率和计算量，提升对微小平移的鲁棒性，核心设计目标为降低空间维度、扩大感受野、控制计算成本。｜ViT核心机制与特性：核心计算逻辑：自注意力是Transformer的核心机制，每个输入元素生成query、key、value（QKV）三个向量，通过Query与所有Key计算相似度获得注意力权重，再加权汇总Value，可直接为任意距离的两个元素构建关联，解决长程依赖建模问题。"}, {"label": "私域纪要", "title": "东吴汽车 | AI系列深度08期：GAN与Diffusion两类生成范式有何差异？", "text": "生成模型技术架构与路径分类：生成模型是AI从识别世界走向生成世界的核心环节，与判别式模型是表征体系的两大组成部分：判别式模型用于识别数据类别，生成模型用于基于噪声、潜变量或条件输入生成符合真实分布的新样本，核心任务是学习真实样本在高维空间的概率结构并生成新样本。｜生成模型技术发展脉络：过去十年生成式AI发展可归纳为五条交织脉络： 变分自编码器（VAE）：2013年提出，采用“潜变量+证据下界”的编解码架构，局限为生成结果较模糊、保真度有限，但其潜空间思想被后续扩散模型继承。｜GAN技术原理与优劣势：核心机制：由生成器、判别器两个网络构成极小极大博弈关系——生成器负责将随机噪声映射为图像，判别器负责判断样本来自真实数据还是生成器；训练过程中判别器不断提升识别能力，生成器不断提升样本真实度，理论上当生成分布与真实分布完全重合时，博弈达到平衡。"}, {"label": "私域纪要", "title": "东吴汽车 | AI系列深度06期：Transformer如何从序列任务走向基座模型？", "text": "序列建模两代核心架构对比：RNN和Transformer是序列建模从状态压缩走向全局交互的两代核心架构，和CNN、ViT聚焦图像表征不同，二者面向文字、语音等带顺序的序列数据，核心难点是上下文保留与长程依赖建模。序列数据两大核心特征： 顺序本身携带信息，同样的元素顺序不同含义完全不同，模型必须对位置和先后顺序敏感。｜RNN架构特性与发展局限：RNN是AI 1.0时代的序列建模主流架构，核心思路是用随时间不断更新的隐藏状态概括历史，按时间顺序处理序列元素，每一步将当前输入与上一步隐藏状态输入同一组网络，得到新的隐藏状态和输出。｜Transformer架构特性与核心优势 2017年谷歌团队在论文《Attention Is All You Need》中提出Transformer，彻底摒弃RNN循环结构，仅用自注意力机制进行序列建模。"}, {"label": "私域纪要", "title": "东吴汽车 | AI系列深度05期：模型如何学习表征并实现对齐？", "text": "AI大模型表征工程核心问题：表征进入工程系统需解决三类核心问题，对应嵌入、自监督学习、CLIP三个关键技术方向： 如何把对象表示为可计算结构 如何不依赖大规模人工标注实现表征学习 如何让图像、文字等不同模态共享语义空间｜嵌入技术相关要点：核心定义：嵌入是表征的工程化形态，本质是将词、图像、商品、用户等多对象映射为固定长度的数字向量，是对象进入计算机系统的基础接口，也是向量检索推荐系统、语义搜索的底层接口。核心特性： 语义相近的对象在向量空间中距离更近，语义关系可转化为可计算的几何关系，语义相似度判断可转化为向量空间中的近邻搜索问题。｜自监督学习技术相关要点：核心价值：是通用表征规模化的学习机制，也是大模型形成通用能力的前提。传统监督学习高度依赖人工标注，标注成本高、速度慢，难以覆盖互联网级别的图文数据；自监督学习核心是利用数据自身制造训练信号，无需人工标注即可让模型学习结构、语义和上下文关系，可将海量无标注数据纳入预训练流程。"}, {"label": "相关标的", "text": "寒武纪、海康威视、云从科技"}], "source": "private", "stocks": "寒武纪、海康威视、云从科技"}, {"title": "新天然气中报：LNG景气与公用扩张", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江大化工&长江公用 | 新天然气2026年中报解读及未来展望", "text": "2026年上半年核心财务表现：2026年上半年实现营业总收入19.04亿元，较上年同期20.38亿元减少1.34亿元，同比下降7%。2026年上半年实现利润总额6.24亿元，净利润3.69亿元，归母净利润3.86亿元，较上年同期归母净利润6.22亿元减少2.36亿元，同比下降约38%。｜上游天然气勘探生产业务：整体产量：2026年上半年并表范围内全口径天然气总产量约11.22亿方，较去年同期12.17亿方同比减少约7.81%。山西潘庄区块： 2026年上半年煤层气总产量约5.33亿方，较上年同期5.21亿方同比增长约2.3%；总销量约5.14亿方，较上年同期4.99亿方同比增长约3.02%。｜城燃、输配及LNG业务：新疆城燃供应业务： 受经济环境及地缘政治影响，天然气购进成本持续上涨，2026年上半年天然气销售量约3.88亿方，其中高附加值用户新增销售量约850万方，较上年同期4.38亿方同比减少约11.42%。"}, {"label": "私域纪要", "title": "招商汽车｜元征科技2026年中期业绩交流会", "text": "2026年中期核心经营业绩：整体营收与利润情况：2026年上半年实现营业收入10.7亿元，同比增长9.1%；其中主营业务收入10.5亿元，同比增长9.6%；毛利润5亿元，同比增长5.2%；受成本、费用及汇兑影响，净利润1.75亿元，同比下降10.3个百分点。｜分业务板块经营情况：硬件业务：2026年上半年硬件销售收入9亿元，同比增长3%，毛利率39%，受原材料涨价影响毛利率有一定下滑；下半年设备销售增速预计超过上半年，ADAS设备、冷媒设备等高单价新产品将成为增长动力。｜分区域业务情况：整体海外业务：2026年上半年海外收入8.1亿元，占总营收77%，创历史同期新高，毛利率49%；全年海外销售收入目标17.8亿元，增速目标接近25%，欧美区域增速目标20%。"}, {"label": "私域纪要", "title": "东吴汽车 | 宇通客车26H1中报解读及观点更新", "text": "2026年上半年（26H1）及二季度业绩情况 营收表现：26H1实现营收108亿元，同比增长11%，环比增长82%，收入增速超预期；总销量仅同比增长1%，收入高增核心由出口拉动，出口总量同比增长5%，其中二季度新能源出口同比增长54%，同时出口尤其是新能源出口的单车价格持续上行，共同带动收入超预期增长。｜2026年全年业绩及分红预期：业绩预期：维持2026年全年归母净利润60亿元以上的预期，核心支撑如下： 2025年扣非归母净利润为46亿元，2026年上半年扣非归母净利润同比增长15%，公司通常下半年业绩兑现速度更快，预计全年扣非归母净利润同比增长20%-30%，对应扣非利润区间为55-60亿元，叠加政府补助等非经常性损益后，全年归母净利润可达到60亿元以上； 新能源出口单车ASP（平均售价）从2025年的230万-250万元左右提升至2026年的260万元左右，海外客车处于通胀逻辑下，2026年单车盈利将高于2025年，盈利确定性较强。"}, {"label": "相关标的", "text": "新天然气、九丰能源、广汇能源"}], "source": "private", "stocks": "新天然气、九丰能源、广汇能源"}, {"title": "特斯拉Optimus九月或周产千台", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "过去24小时内，特斯拉弗里蒙特工厂的Optimus机器人生产线安装进入尾声，供应链已接到明确的下半年产能指引，目标9月实现周产千台。这一边际变化标志着市场预期从此前官方指引模糊的利空出尽，转向对量产从0到1拐点的确认，投资逻辑也从博弈远期催化转向押注供应链订单的落地兑现。"}, {"label": "相关标的", "text": "拓普集团、新泉股份、三花智控、斯菱股份、北特科技、浙江荣泰、福赛科技、科达利"}, {"label": "私域补充", "text": "另收藏纪要：恒逸石化：2026年半年报业绩解读及展望；浙江荣泰2026半年报业绩交流会；人形机器人板块大涨等"}], "source": "hot", "stocks": "拓普集团、新泉股份、三花智控、斯菱股份、北特科技、浙江荣泰、福赛科技、科达利"}, {"title": "福赛科技机器人注塑件ASP达万元级", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月11日，随着海外客户机器人量产订单加速落地，福赛科技的业务迎来关键边际变化，其注塑件单机价值量（ASP）已接近万元级别。这一价值跃升的核心驱动力在于，其产品应用已从普通结构件拓展至最核心的传动部件，这彻底打开了远期单机价值量的想象空间，市场正基于此重估其作为轻量化核心功能件供应商的长期市值。"}, {"label": "相关标的", "text": "福赛科技、恒勃股份、斯菱股份、北特科技、新泉股份、浙江荣泰"}], "source": "hot", "stocks": "福赛科技、恒勃股份、斯菱股份、北特科技、新泉股份、浙江荣泰"}]}, {"name": "港股互联", "emoji": "港", "overview": "金蝶国际AI原生产品收入同比+189%、首次中期盈利，企业软件AI商业化拐点明确；Sea电商收入同比+48%超预期上修EBITDA，东南亚电商进入利润释放期；Claude全线部署隐形水印打开内容安全基础设施需求。", "topics": [{"title": "文生视频大比对：阿里Wan3与可灵3.0应用分化", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "华福AI互联网 | 文生视频模型大比对：阿里Wan3、SD2.5、H3、可灵3.0", "text": "文生视频模型定价情况：基础积分定价（单积分对应价格）： 阿里万三：会员价0.16元/积分，非会员价0.33元/积分，会员价仅为非会员的50%，平台对会员充值的引导力度较大。即梦：约0.1元/积分，会员价优惠幅度较小。海螺视频：会员价0.065元/积分，非会员价0.07元/积分，会员与非会员价差很小。｜短剧/AI漫剧生成场景效果对比（多镜头、真人、对话需求） 场景适配前提：即梦2.5由于价格过高，且短剧/漫剧受众对极致画质敏感度较低，当前基本不会被应用于短剧/漫剧制作，该场景核心对比模型为即梦2.0、可灵3.0、海螺H3、阿里万三。｜模型场景适配总结：针对长指令、不涉及真人、无多镜头转换的任务：不考虑价格的前提下即梦2.5表现最优；如果叠加价格因素，阿里万三的性价比突出。针对涉及真人、需要多镜头转换的任务（如短剧、AI漫剧制作）：可灵3.0、即梦2.0的表现更优，阿里万三效果相对较弱。"}, {"label": "相关标的", "text": "阿里巴巴、字节跳动、快手、商汤"}], "source": "private", "stocks": "阿里巴巴、字节跳动、快手、商汤"}, {"title": "腾讯音乐Q2：会员与广告货币化延续", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "腾讯音乐(01698.HK，TME.US)2026年第二季度业绩电话会", "text": "2026年第二季度核心财务表现：总营收同比增长6%，增长主要来自音乐相关服务的强劲增长，喜马拉雅并表也对整体收入增长形成贡献。音乐相关服务收入同比增长11%，增长由会员服务、线下演出相关服务的稳健增长共同驱动。｜内容生态建设：内容合作拓展： 深化与自由音乐集团的合作，除头部艺人数字首发权外，合作延伸至内容共创、实体产品、线下体验等领域。与华策影视、如意影业、浙江卫视合作，引入原声音乐、热门音乐综艺内容，强化音乐与视觉娱乐的联动。｜产品与用户运营：产品功能迭代： 优化内容发现功能，新增滑动标签、视频流等功能，提升内容匹配效率；面向免费用户推出3D音效，提升首次收听体验。升级QQ音乐、酷狗的AI Agent，可识别用户精细化需求，即时生成个性化歌单，推动推荐流播放占比提升，高活跃用户留存提升效果显著。"}, {"label": "相关标的", "text": "腾讯音乐、网易云音乐、哔哩哔哩"}], "source": "private", "stocks": "腾讯音乐、网易云音乐、哔哩哔哩"}]}, {"name": "医药", "emoji": "药", "overview": "CXO及生物医药上游中报确认高增，AI4S成为模型厂第二大收入场景拉动湿实验；甘李GLP-1欧洲授权总额超7亿欧元、传奇Carvykti Q2销售6.57亿美元首次单季盈利，创新出海与商业化兑现并进。", "topics": [{"title": "医美：产品获批加速+机构端中报景气回暖", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "开源商社 | 医美板块观察：产品端获批加速，机构端中报预告景气回暖", "text": "医美上游产品供给与拿证红利趋势：拿证红利逻辑变化：过去医美三类证供给稀缺时，证书本身可形成较强渠道溢价能力；当前红利仍存在，但逻辑已从“是否有证”转向拿证后能否实现终端动销，仅凭借首张证或新材料标签已很难获得头部机构采购，目前头部机构在胶原蛋白领域通常已布局2到3个品牌。｜医美产品价格竞争与行业分层趋势：价格下行整体趋势：后续医美产品价格下行是相对明确的趋势，但并非所有产品都会失去利润空间。同质化产品价格竞争加剧：获批产品数量增加后，同质化产品价格竞争更为激烈，成熟产品已出现不同程度降价；同时代工贴牌模式加速渗透，机构采购贴牌产品的成本比品牌产品低60%到70%，给机构提供了较大的折扣、促销空间。｜医美机构端2026年景气趋势：2026年医美整体消费表现并不差，呈现“量增价降、结构分化”的特征。Q&A Q: 医美行业未来的拿证红利是否仍然存在？过去供给稀缺阶段，一张三类证本身就能形成较强的渠道溢价能力，但目前头部机构在胶原蛋白领域通常已经布局了2到3个品牌，新产品仅凭借首张证或者新材料标签，已经很难自动获得机构采购。"}, {"label": "私域补充", "text": "另收藏纪要：国产算力，大势所趋等"}, {"label": "相关标的", "text": "爱美客、华熙生物、昊海生科、朗姿股份"}], "source": "private", "stocks": "爱美客、华熙生物、昊海生科、朗姿股份"}, {"title": "创新药中期策略：前沿技术融入全球价值链", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国金医药 | 创新药产业链2026年中期策略：前沿技术迭代，加速融入全球价值链", "text": "创新药行业核心投资逻辑：前沿技术迭代为3-5年核心投资主线：创新药研发已从单一靶点内卷转向范式升级，值得关注的技术方向包括双抗/多抗、ADC、PROTAC/分子胶（可突破不可成药靶点限制）、AI制药、小核酸、多肽等，需重点追踪上述领域头部中国企业的临床数据读出及全球开发进展。｜重点细分赛道投资机会：泛肿瘤疗法： 双抗：相比传统PD-1单抗特异性、靶向性更强，可降低脱靶性和耐药性，有望迭代现有PD-1单抗市场；现有PD-1单抗全球市场规模已达五六百亿美元，双抗+ADC联用后用药费用可翻倍，且PFS相比传统方案接近翻倍带动用药时间翻倍，未来市场规模有望达2000亿美元，中国企业已形成集群效应，代表管线包括康方、荣昌、三生的PD-1/VEGF双抗，信达的PD-L1/PD-L2双抗等。｜创新药板块配置思路：短期配置（侧重业绩改善）： 关注头部Biotech：百济、信达等头部Biotech人均单产大幅提升，已实现盈亏平衡，收入高增长+费用有效控制驱动业绩释放。关注转型顺利的传统Pharma：恒瑞、海思科等仿转创进展顺利，持续达成高总额、高首付款BD交易，造血能力持续增强，确定性较强。"}, {"label": "相关标的", "text": "恒瑞医药、百济神州、信达生物、科伦博泰"}], "source": "private", "stocks": "恒瑞医药、百济神州、信达生物、科伦博泰"}, {"title": "医药观点更新：创新出海与CXO景气跟踪", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "光大医药 | 近期医药观点更新", "text": "医药板块行情阶段与整体投资逻辑：行情阶段特征： 前期因估值低、产业逻辑未破坏，成为资金偏好方向；科技调整阶段医药出现获利盘消化；8月初以来，药明康德、百济神州、信达生物等龙头公司陆续披露销售数据后，股价对其中报业绩、销售数据给出强正反馈，当前医药开始尝试摆脱与科技的跷跷板逻辑，有望与科技形成联动，AI制药、创新药上游产业链等兼具科技属性与医药产业逻辑的方向信心进一步强化。｜创新药板块投资机会：产业逻辑变化： 中国创新药公司已从研发投入期进入价值验证期，出海是价值重估的核心抓手：2025、2026年之前以零星BD、研发积累为主；2025-2026年进入出海BD爆发期；2028年之后进入创新药资产出海核心验证期。｜创新药产业链板块投资机会：板块核心逻辑：同时受益于周期向上与成长扩张，是创新药研发效率、生产能力、全球供应链稳定性的核心支撑。"}, {"label": "相关标的", "text": "恒瑞医药、药明康德、迈瑞医疗"}], "source": "private", "stocks": "恒瑞医药、药明康德、迈瑞医疗"}, {"title": "CXO四推：供应链韧性与不可替代性", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国泰海通医药｜CXO第四次重点推荐：供应链的韧性与不可替代性", "text": "CXO板块周期复盘：板块发展阶段： 上一轮上行周期板块PE突破百倍，2022-2025年受中美政治博弈等因素经历调整，2025年一季度起行业进入强复苏周期，外需为主的CDMO板块复苏尤为明显。｜中国CXO行业核心竞争壁垒：产业链与集群优势：拥有完整的上下游制药产业链，在小分子、ADC、双抗领域产业集聚效应显著，凭借工程师红利在ADC工具化合物、高毒性药物研发领域具备优势。成本与效率优势： 环保政策适配性优于欧美，小分子药生产成本仅占终端销售额的3%-5%，复杂多肽分子生产成本占比也仅为5%-8%，整体成本端优势显著。｜重点企业竞争格局与业务进展：药明康德： 传统小分子业务：FDA临床阶段项目每6个分子就承接1个，全球商业化销售前十的分子中参与7-8个，是全球唯一可同时承接中间体与API的供应商，全球市占率持续提升。"}, {"label": "相关标的", "text": "药明康德、凯莱英、康龙化成、泰格医药"}], "source": "private", "stocks": "药明康德、凯莱英、康龙化成、泰格医药"}, {"title": "CXO及生物医药上游行业景气度回升", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "本周以来，随着多家CXO及上游公司集中披露2026年上半年业绩预告和中报，市场对行业景气度的判断已从“预期回暖”转变为“确认高增”，尤其是一批上游耗材和AI赋能相关企业展现出超预期的业绩弹性。这一系列强劲的数据证实了AI赋能与新分子（如多肽、ADC）研发需求正形成共振，并已切实转化为产业链从前端到后端全面的订单和利润高增长，市场焦点正从寻找复苏拐点转向挖掘业绩加速兑现的α标的。"}, {"label": "私域纪要", "title": "光大海外&医药 | 港股CXO推荐标的与逻辑解读", "text": "CXO行业行情复盘与核心驱动逻辑：2026年以来行业行情走势：万得CXO指数呈现年初冲高、年中震荡、8月爆发的V型反转行情，其中2026年8月以来指数涨幅已高达25%。2026年1-5月上涨驱动：创新药研发景气度回升，国内创新药BD出海趋势带动临床前CRO订单明显复苏。｜看好子赛道排序：第一顺位：CDMO领域：基本面确定性最强，重点关注全球创新药大单品核心供应商，包括减肥药产业链标的药明康德（A+H）、凯莱英（A+H）、康龙化成（A+H）、药明合联（H股），以及具备双抗商业化放量逻辑的药明生物（H股）。｜药明康德（A+H）：核心成长逻辑：CRDMO漏斗商业模式优势、减肥药核心受益标的、地缘政治利空出尽解除估值压制。"}, {"label": "相关标的", "text": "药明康德、药明生物、药明合联、凯莱英、康龙化成、金斯瑞生物科技、百普赛斯、义翘神州、纳微科技、赛分科技"}, {"label": "私域补充", "text": "另收藏纪要：创新药及产业链研究框架等"}], "source": "hot", "stocks": "药明康德、药明生物、药明合联、凯莱英、康龙化成、金斯瑞生物科技、百普赛斯、义翘神州、纳微科技、赛分科技"}, {"title": "AI4S成AI下一个应用大场景", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "在过去24小时内，AI4S已从一个宽泛主题迅速具体化为可量化的投资逻辑，核心催化剂是头部AI模型厂商（如Anthropic）在路演中明确将AI制药列为继Coding后第二大收入增长极，预计贡献超20%的ARR。投资视角的核心边际变化在于，市场不再纠结于AI能否立即产出重磅新药，而是聚焦于AI模型在药物发现前端（如分子设计）带来的数量级暴增，将直接引爆下游湿实验环节（Wet-Lab）对DNA合成、蛋白表达和测试验证的需求，从而形成清晰的产业链传导和业绩兑现路径。"}, {"label": "相关标的", "text": "金斯瑞生物科技、药明康德、凯莱英、晶泰控股、英矽智能、华大智造、金域医学、迪安诊断"}], "source": "hot", "stocks": "金斯瑞生物科技、药明康德、凯莱英、晶泰控股、英矽智能、华大智造、金域医学、迪安诊断"}, {"title": "甘李药业GLP1药物欧洲授权总额超7亿欧元", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月10日晚间，甘李药业公告其双周制剂GLP-1（博凡格鲁肽）与意大利美纳里尼达成欧洲授权，总金额超7亿欧元，确认了公司研发平台的出海兑现能力。从投资角度看，这一事件的边际催化在于，其差异化的双周给药方案及媲美全球重磅产品的减重疗效数据，证明了产品在GLP-1红海中具备全球竞争潜力，从而为公司整个创新管线提供了明确的价值锚点和重估逻辑。"}, {"label": "相关标的", "text": "信达生物、恒瑞医药、通化东宝、联邦制药、药明康德、凯莱英"}], "source": "hot", "stocks": "信达生物、恒瑞医药、通化东宝、联邦制药、药明康德、凯莱英"}, {"title": "传奇生物二季度Carvykti销售额6.57亿美元", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "传奇生物于8月11日晚间披露的二季度业绩，核心产品Carvykti销售额达6.57亿美元，并首次实现单季度盈利3320万美元，这一业绩不仅验证了Carvykti作为全球领先CAR-T产品的强劲放量趋势，更标志着公司从研发投入期正式迈入盈利收获期，其商业化能力和盈利拐点得到确认，显著提升了资产的确定性。"}, {"label": "相关标的", "text": "传奇生物、金斯瑞生物科技、石药集团、云顶新耀、科济药业、药明生物、药明康德、吉利德科学、礼来、强生"}], "source": "hot", "stocks": "传奇生物、金斯瑞生物科技、石药集团、云顶新耀、科济药业、药明生物、药明康德、吉利德科学、礼来、强生"}]}, {"name": "消费", "emoji": "费", "overview": "优然牧业等原奶龙头深度与迎驾洞藏势能等框架密集；跨境与电商SaaS（Sea/Shopify验证）利好出海与支付链路，轻工家电关注景气分化。", "topics": [{"title": "运动服饰：adidas/Puma/VF财报看产业链景气", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江纺服 | 于公羿山224期：从adidas/Puma/VF财报看运动行业及产业链", "text": "阿迪达斯2026年二季度经营及业绩指引情况 核心经营数据：2026年二季度（4月1日-6月30日）固定汇率下营收同比增长14%，表现超预期；毛利率同比提升0.8个百分点至52.5%，受益于全价销售和渠道组合改善；受世界杯营销费用增加及DTC渠道占比提升影响，管理费用增加，营业利润率同比下降0.7个百分点至8.5%，归母净利润同比下滑4%至3.55亿欧元，归母净利率同比下降1个百分点至5.3%，利润端表现拖累财报发布后股价下跌。｜彪马2026年二季度经营及业绩指引情况 核心经营数据：2026年二季度营收16.9亿欧元，表现符合预期，固定汇率下同比下滑9.4%；毛利率同比提升1.8个百分点至48%，受益于采购成本下降、运费影响减弱、汇率及渠道结构优化；净利润同比减亏1.7亿欧元至-0.7亿欧元，净利率为-4.3%，仍处于亏损状态。｜VF集团2027财年一季度（2026年3月29日-6月27日）经营及业绩指引情况 核心经营数据：期内实现营收16.7亿美元，剔除DS影响后固定汇率下同比持平，表现略优于市场及公司前期指引（此前指引为同比下滑）；毛利率同比微增0.1个百分点至54.9%，受益于品牌结构优化，汇率因素对毛利率形成负面影响；净利润同比减亏0.2亿美元至-1亿美元，净利率同比提升0.8个百分点至-5.8%，仍处于亏损状态。"}, {"label": "相关标的", "text": "安踏体育、李宁、申洲国际、伟星股份"}], "source": "private", "stocks": "安踏体育、李宁、申洲国际、伟星股份"}, {"title": "白酒研究框架：高端挺价与次高端分化", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江食品丨白酒行业研究框架", "text": "白酒行业分析核心框架：行业层面分析核心为空间+格局，企业层面分析核心为产品力、渠道力、品牌力；白酒行业区别于其他消费品的核心特征是价格带跨度极宽，从十几元到数万元不等，不同价格带的成长逻辑、竞争格局、核心竞争力差异显著。不同价格带的核心竞争要素差异： 高端酒：品牌力是最核心竞争维度。｜白酒行业周期特征：周期分类： 长周期：核心逻辑为品牌化大周期，长期趋势是向头部品牌集中，因变化缓慢，投资中较少作为核心考量。中周期：核心驱动为宏观经济周期，通过居民消费力、消费信心、政商务活跃度影响需求，白酒是高度顺周期行业；历史数据显示，白酒收入增速与1.5倍名义GDP同比增速走势接近。｜白酒行业量价驱动逻辑：消费量核心影响因素： 人口因素：白酒消费量与25年前出生人数相关性较高，核心原因是成年人初次饮酒年龄集中在25-30岁，当年出生人口会在25年后成为饮酒主力，后续白酒消费量预计将逐步企稳。消费场景：婚宴场景是大众消费的重要组成部分，婚姻登记人数与白酒消费量相关度较高。"}, {"label": "相关标的", "text": "贵州茅台、五粮液、泸州老窖、迎驾贡酒"}], "source": "private", "stocks": "贵州茅台、五粮液、泸州老窖、迎驾贡酒"}, {"title": "海外消费财报：高端亮眼、大众分化", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "华泰消费看海外系列 | 海外财报跟踪：高端亮眼、大众分化", "text": "26Q2海外消费板块整体业绩表现：整体态势：全球全面消费复苏仍需时间，呈现高端消费表现更优、大众市场预期偏软且分化更显著的特征。品类增速层级：26Q2海外龙头营收同比增速呈现硬奢（不含腕表，以珠宝为核心）>软奢（皮具箱包等）>高端日化（美妆为主）>大众日化的排序。｜26Q2海外消费板块股价交易逻辑：三类公司财报后股价获得明显正反馈： 高端稀缺定位+业绩增长确定性强的无瑕疵龙头：代表为历峰集团，珠宝业务高景气，全球增长环比提速，享受品牌稀缺性溢价。底部反转且有核心数据验证的标的：当前市场认可度最高，股价弹性较大。｜海外高端品牌中国市场表现及背后原因：核心表现：近4-5个季度外资高端品牌在中国市场表现明显优于同集团大众品牌，份额持续提升。欧莱雅旗下赫莲娜、修丽可、兰蔻表现持续向好，2026年618中国区线上实现双位数增长，带动集团自25年Q2以来季度增长逐季提速。资生堂旗下CPB是集团内唯一在中国实现低双位数增长的品牌，表现优于资生堂主品牌。"}, {"label": "相关标的", "text": "安踏体育、李宁、老铺黄金"}], "source": "private", "stocks": "安踏体育、李宁、老铺黄金"}, {"title": "金蝶国际AI原生产品收入同比增189%", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "金蝶国际于8月11日晚间披露的2026年中期业绩，首次实现中期盈利，标志着其经营进入关键拐点，其中AI原生产品收入同比激增189%成为核心驱动力。这一业绩验证了AI战略正从前期投入和效率提升，成功转化为可规模化的收入和利润，市场关注点已从对其云转型的持续投入转向AI驱动订阅业务经营杠杆加速释放的盈利新周期。"}, {"label": "相关标的", "text": "用友网络、微盟集团、有赞、迈富时"}, {"label": "私域补充", "text": "另收藏纪要：华润啤酒：股息筑底，大单品放量；头部医美机构近况更新；乳业深度汇报：奶价破晓，弹性为先；休闲零食行业研究框架；黄金珠宝板块核心标的更新等"}], "source": "hot", "stocks": "用友网络、微盟集团、有赞、迈富时"}]}, {"name": "周期", "emoji": "周", "overview": "美伊和谈僵持推升油运运价与油价，油运“通航量增、封锁距增”横竖受益；金属黄金配置价值再讨论，大炼化/化工景气跟踪。", "topics": [{"title": "再生小金属铋：供需趋紧+半导体应用需求高增", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江环保｜再生小金属：铋行业供需格局趋紧，半导体应用需求高增 -【环保碳中和】第141场", "text": "铋金属基础属性与核心应用：铋是元素周期表第15族氮族中原子序数最大的稳定元素，核心物理化学特性包括：自然界中抗磁性最强的金属、熔点约271℃、是金属中热导率最低的元素之一、属于具备半导体特性的半金属、凝固时体积膨胀约3.3%、无毒无害对人体友好，相关特性使其在精密铸造、密封件、新兴电子领域具备独特应用价值 需求结构（2025年全球精铋消费结构，来源：安泰克2025年铋市场发展报告）： 传统领域：医药化工占比42%，铋合金及焊料占比37%，冶金添加剂占比11% 新兴领域：光伏焊带占比7%，其他领域占比3%；电子级高纯铋（纯度5N及以上）主要应用于半导体存储领域 光模块领域核心应用： 是光模块核心组件热电制冷器（TEC）的核心原材料，铋碲基合金通过帕尔帖效应将激光器芯片稳定在25℃左右，保障波长稳定性和使用寿命，是高速光模块温度控制的关键材料 可制成含铋低温焊料，在不损伤热敏光学芯片的前提下完成光电器件封装互联｜铋行业供给格局：供给刚性特征：自然界几乎无具备商业开采价值的独立铋矿，铋几乎全部作为铅锌矿、铜矿、钨矿、锡矿等其他金属冶炼的副产品被提取，再生铋是供给的核心来源 全球储量与产量格局： 储量：根据2017年美国地质局统计数据，全球铋总储量约37万吨，中国储量约24万吨，占比约2/3，为全球最高 产量：2025年全球精铋总产量约1.6万吨，其中中国产量约1.4万吨，占比接近88%，是全球最核心的供给方，其余仅日本占比约3% 提纯技术门槛：精铋提纯分为粗炼提取和深度精炼两个环节，半导体、光模块应用要求铋纯度达到4N（99.99%）甚至5N（99.999%）及以上，提纯工序复杂、技术要求高、生产成本高｜行业政策与价格走势：出口管制政策：2025年2月，商务部、海关总署正式将铋及相关制品、配套生产技术纳入出口管制范畴，直接加剧海外铋供给缺口 精铋价格走势： 2025年1月（出口管制政策出台前），国内精铋市场均价约7.6万元/吨 2025年3月（政策出台后1个月），价格上涨至16万元/吨 2026年6月，精铋均价维持在14万元/吨左右，较2025年初实现翻倍以上涨幅，处于高位震荡趋势 氧化铋市场变化：三氧化二铋未被纳入出口管制名录，受精铋出口管制联动影响，需求和出口显著提升： 2025年5月氧化铋出口量达935吨，同比增长40%，出口均价同比翻倍 2026年5月氧化铋出口量同比增长约11%，出口均价同比涨幅超16%"}, {"label": "相关标的", "text": "金田股份、驰宏锌锗、株冶集团"}], "source": "private", "stocks": "金田股份、驰宏锌锗、株冶集团"}, {"title": "藏格矿业：巨龙铜矿放量，钾锂资源接续", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国金金属 | 藏格矿业深度报告：巨龙铜矿放量，钾锂资源接续成长", "text": "核心推荐逻辑：成本优势突出：公司2026年一二季度铜单吨净利润约7万元，是国内铜企中单吨利润最高的企业；后续随着TCRC持续下降、钼/金银价格逐步恢复、铜价上涨，单吨利润将持续提升。｜公司业务架构与发展历程：发展历程：公司从察尔汗盐湖钾肥起家，2002年成立藏格钾肥，2016年资产重组上市，2017年延伸盐湖提锂业务，2019年取得巨龙铜业31%股权，2025年紫金矿业成为控股股东，2026年1月巨龙铜矿二期投产，目前已形成“察尔汗钾锂基本盘+巨龙铜矿利润弹性+西藏盐湖/老挝钾盐矿长期成长”的资产组合。｜铜业务（巨龙铜矿）：资源与产能规划： 资源禀赋：巨龙铜矿是中国备案铜金属资源量最多的矿山，截至2024年6月备案矿石量9.91亿吨，平均铜品位0.29%，对应铜金属资源量2588万吨，公司权益铜资源量797万吨，足以支撑三期产能规划。"}, {"label": "相关标的", "text": "藏格矿业、盐湖股份、紫金矿业"}], "source": "private", "stocks": "藏格矿业、盐湖股份、紫金矿业"}, {"title": "佳鑫国际资源：钨矿与资源价值重估", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国信金属 | 佳鑫国际资源深度汇报", "text": "公司基本情况：公司定位与股权结构：佳鑫国际资源是纯钨矿资源港股标的，已纳入港股通，实际控制人为刘子佳，通过恒兆国际持股31%；江西铜业全资香港子公司持股30.11%，中国铁建国际持股10%，公众股东合计持股28.89%。｜核心资产巴库塔钨矿情况：资源与产能定位：巴库塔是全球最大的三氧化钨矿产资源量露天钨矿，也是全球单体设计产能最大的露天钨矿。产能规划与产量预期： 一期设计年处理原矿石能力330万吨/年（约1万吨/天），2025年因非完整生产年，实际加工原矿石280万吨，白钨精矿产量约5000吨、销量4879吨。｜公司业绩情况：2025年全年业绩：2025年扭亏为盈，实现营业收入10.6亿港币，毛利5.2亿港币，毛利率49%，归母净利润约3亿港币。"}, {"label": "相关标的", "text": "佳鑫国际资源、厦门钨业、中钨高新"}], "source": "private", "stocks": "佳鑫国际资源、厦门钨业、中钨高新"}, {"title": "美伊和谈僵持推升油运市场运价", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "隔夜（8月11日）美伊和谈因双方提出赔偿要求而陷入僵局，霍尔木兹海峡短期通航预期破灭，直接推动国际油价大涨超5%。这一变化虽然引发了油运板块因前期博弈资金离场而回调，但实质上强化了油运的投资逻辑，即市场进入了“通航量增、封锁距增”的“横竖受益”格局，当前僵局巩固了因红海及霍尔木兹海峡绕航带来的高运价环境，任何回调都被视为布局景气周期的窗口。"}, {"label": "相关标的", "text": "招商轮船、中远海能、招商南油"}, {"label": "私域补充", "text": "另收藏纪要：黄金行业深度报告解读：滞涨风险来临等"}], "source": "hot", "stocks": "招商轮船、中远海能、招商南油"}]}, {"name": "金融地产", "emoji": "金", "overview": "险资下半年资产配置与非银研究框架更新；地产链/建材冷修与物业现金流框架，浮法玻璃冷修节奏加快。", "topics": [{"title": "鸿路钢构：量价齐升、行业格局优化", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江建筑 | 鸿路钢构深度汇报：量价齐升，格局优化", "text": "公司及行业基本情况：公司定位：鸿路钢构是专注于钢结构生产加工、无现场施工环节的纯制造业企业，2025年钢结构工程收入占比已接近0%，完成商业模式转型。钢结构行业需求构成：分为三类，大致占比各1/3，分别是工业厂房、超高层、大跨度公共设施（火车站、医院、学校、文化场馆等），行业总规模约1亿吨。｜行业及公司最新变化：需求端： 需求结构向高端制造倾斜，2026年以来核心需求增长来自造船厂、数据中心、半导体、储能等领域，此类项目对交付速度、品质要求严苛，价格高于普通项目，仅有头部企业可满足要求，储能大厂已主动和公司开展合作洽谈。2024年底至2026年中，公司已连续六个季度实现产量两位数增长，需求支撑力较强。｜新业务进展：智能设备业务： 焊接机器人：2025年至2026年7月累计销售600余台，2026年7月单月销售100台，单台售价约20万元，毛利率20%以上。机器人地轨：60余台加工中心已投产，理论月产能3万米，满产对应年产值接近10亿元，新业务处于加速发展阶段。"}, {"label": "相关标的", "text": "鸿路钢构、精工钢构、东南网架"}], "source": "private", "stocks": "鸿路钢构、精工钢构、东南网架"}, {"title": "住房公积金深度：优化用途稳刚需、效用惠民", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国泰海通【地产新纪元十八讲】｜中国住房公积金深度研究 ——优化用途稳刚需，增加效用惠民", "text": "住房公积金制度基本情况：制度定位与管理框架：住房公积金是我国最大的政策性住房金融制度，诞生于20世纪90年代初城镇住房制度改革，立足点是解决居民住房问题，属于重要保障制度；管理采用地方执行+中央监督的核心框架，日常运营由各地公积金中心负责，重大政策在国务院住建部框架监督下由地方制定，财政部负责资金安全监督。｜住房公积金行业运行数据特征（基于2014-2024年公开年报数据） 缴存规模持续扩张：过去十年公积金覆盖面不断扩大，实缴单位从2014年的200多万个增长至2024年的500多万个，实缴职工人数从1.2亿人上升至1.7亿人；缴存规模年均复合增速约10%，缴存余额从2014年的3万亿元增长至2024年的10.9万亿元，资金池规模庞大。｜住房公积金政策演进与优化方向：政策定位变化：当前公积金政策已从短期房地产调控工具转变为长期支撑房地产发展新模式的基础性制度，在房价预期止跌回稳的背景下对新房市场主要发挥托底刚需、支持初次购房的作用，政策优化意义持续提升；目前公积金首套贷款利率已降至2.6%的历史最低水平。"}, {"label": "私域补充", "text": "另收藏纪要：《保险康养服务深度；塔牌集团2026年半年报业绩会；保险行业渠道发展展望等"}, {"label": "相关标的", "text": "保利发展、华润置地、贝壳"}], "source": "private", "stocks": "保利发展、华润置地、贝壳"}, {"title": "核心城市租金观察：租售与去化边际", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "兴证地产 | 基本面观察 - 核心城市租金会议纪要", "text": "核心城市租金当前走势：整体租金表现：统计76个城市（4个一线、27个二线、45个三线）住宅每平米月租金数据，2026年以来34个城市租金较年初实现正增长，其中一线城市平均较年初增长2.5%，二线城市平均增长0.2%（持平微涨），三四线城市较年初下跌0.7%。｜本轮租金反弹的驱动因素：季节性因素：租房市场存在明显季节性特征，春节后2-4月返工潮、6-8月高校毕业季为传统租房旺季，需求集中释放会带动租金季节性上涨；过往2023年、2025年年初均出现租金上扬，如2025年1-3月一线城市租金平均回升0.4%，其中深圳回升1.7%、北京回升0.2%、上海回升0.1%，但2025年下半年旺季后租金随需求下降出现调整。｜租金反弹的持续性判断：核心决定因素：租金反弹持续性取决于租房人口是否持续增长、租房挂牌量是否持续下降。分城市判断： 上海供需两端趋势向好，租房人口持续增长、挂牌量持续下降，叠加2026年以来上海二手房房价企稳反弹1.7%，租金反弹具备持续性。"}, {"label": "相关标的", "text": "贝壳、华润万象生活、保利物业"}], "source": "private", "stocks": "贝壳、华润万象生活、保利物业"}, {"title": "券商股投资逻辑：历史beta与当前弹性", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "东吴非银 | 非银投资全景系列02期：券商股投资逻辑的历史变迁与展望：再论券商的beta属性", "text": "券商股当前核心矛盾：业绩与估值背离：2025年、2026年一季度上市券商净利润分别同比增长43%、38%，预计2026年上半年上市券商净利润同比增长50%以上，全年行业在高基数下仍有36%的增速，且ROE自2022年以来持续创新高，但2025年四季度以来A股券商行业平均PB估值已下行到1.25倍左右，处于历史10%分位，估值与盈利出现明显背离。｜券商股贝塔属性变化趋势：贝塔系数持续下降：2012年以来证券指数相对上证指数的贝塔大于1，R²中枢约0.6；2020年以来券商业绩与市场收益相关性逐步减弱，贝塔和R²均有所降低，2021年、2024年表现最为明显。｜券商行业alpha增长路径：并购重组推动供给侧改革： 监管明确支持头部券商通过业务创新、集团化经营、并购重组等方式做优做强，打造一流投资银行；费率竞争加剧、全面注册制、市场机构化背景下，行业竞争转向专业化、综合化，头部券商市占率持续提升，推动中型区域券商通过并购做大做强。"}, {"label": "相关标的", "text": "中信证券、东方财富、华泰证券"}], "source": "private", "stocks": "中信证券、东方财富、华泰证券"}]}, {"name": "稳定类", "emoji": "稳", "overview": "英伟达锁定AI能源带动HVDC/服务器电源/变压器/分布式发电外溢；金盘科技等电通设备受益AIDC电力瓶颈，光缆集采限价上调8.5%确认光纤景气反转。", "topics": [{"title": "燃气机成数据中心主电源：AIDC电力瓶颈突破", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江AI产业链深度巡演（14）：燃气机为何成为数据中心主电源？", "text": "燃气轮机成为数据中心主电源的核心逻辑：供电模式与发电方式对比：传统数据中心供电模式为接入电网+备用发电机+UPS电源，云厂商选择发电方式会综合评估建设周期、功率可调性、碳排放强度、标准化度电成本等核心指标 燃气轮机的核心优势： 短期维度：建设周期更短、功率可调性是所有发电方式中最优，碳排放强度和度电成本处于云厂商可接受区间，是短期供电的优选项 长期可迭代性：初期可投用单个燃气轮机组，后续可加装余热锅炉形成燃气联合循环，进一步降低碳排放强度和度电成本，兼顾短期需求和长期优化空间 政策适配性：北美要求新建数据中心需实现自主供电，燃气轮机的高灵活性更适配自主供电场景，且北美气源充足，本身就是当地电网核心电力来源｜全球燃气轮机行业景气度现状与未来需求预期 龙头企业订单与产能情况： 订单规模：2026年半年报显示，GE燃气轮机在手订单从约100GW提升至116GW；西门子在手订单从87GW提升至95GW（含20GW产能预留协议，已签订单环比持续上行） 需求结构：中小燃机、航改机需求旺盛，导致GE单位GW交付量下降但单位GW收入增长，叠加后市场需求波动，收入结构持续优化；西门子从2026年开始扩张中小燃机产能，2027年中小燃机产能将进一步提升，优先解决中小燃机产能瓶颈 未来用电需求与行业景气周期： 美国数据中心用电需求：2025年约30GW，2030年增长至100GW，2035年进一步增长至185GW；2030年较2025年增长超3倍，2035年较2030年增长约80%-90% 全球数据中心用电需求：2025年约127GW，2030年达到279GW，2035年达到414GW；2030年较2025年增长接近3倍，2035年较2030年增长超50% 景气周期：2025-2030年是需求增速最陡峭的区间，2030-2035年仍将维持高增长，行业整体具备5-10年的景气周期；海外龙头GE、西门子、卡特等依托在手订单缓慢扩产，维持市场紧平衡状态以抬高产品价格 国产供给补充情况：国内中船广瀚、航发燃机、中国重燃、东方电气等企业的中小燃机逐步出海，弥补全球产能缺口，产能不会成为行业扩张的核心瓶颈，支撑行业景气度长期延续｜国内燃气轮机供应链投资机会：海外供应链外溢主线：海外主机厂扩产但中间锻造、铸造、精密加工环节产能有限，相关需求持续向国内供应商转移： 锻造环节：航宇科技、派克新材、三角防务、中航重机2025年以来燃机新客户、新型号和件号呈爆发式增长 铸造环节：万泽股份、应流股份等涡轮叶片供应商技术壁垒高，切入供应链后可实现长期稳定配套，全球供给紧张背景下产品价格表现向好，利润弹性充足 上游原材料：高温合金企业隆达股份、图南股份、西部超导、上大股份已同步感受到需求增长 国内燃机出海主线：核心标的包括航发动力、中国动力、东方电气等具备燃机核心机、成撬能力的主机厂 机械视角产业链跟踪补充： 价格与订单：2026年上半年GE新签订单价格较2025年四季度增长20%以上，预留槽位订单逐步转化为正式订单，价格端弹性持续显现；核心企业产能已排产至2030-2031年，2030年前大部分核心产能已被锁定，2028-2029年预留订单也已基本明确 航改机产能：以FT8航改机为例，2027年产能预计达100台，对应单台25MW，总产能约2.5GW，目前2027年已有排单已达产能的一半以上 集成环节：杰瑞直接对接北美市场，新签订单单价持续上涨，从最初1吉瓦对应11亿美元，2026年3-4月涨至1吉瓦12亿美元，目前仍有涨价空间；单次签单金额从早期1亿美元提升至3亿多美元，当前单次订单可达十多亿美元，2027年交付已基本明确，2028年交付有望进一步加速 估值情况：海外铸造环节核心公司2028年估值约40倍，核心主机厂GEV 2028年估值约30倍；国内铸造环节应流股份、万泽股份、联德股份2028年估值处于合理区间，后续利润增速有望超过收入增速，存在估值弹性；主机厂中国动力、东方电气、上海电气等海外接单持续落地，市值弹性较大 模块化配套：北美IDC基建除发电外，IT机房、配电、制冷端模块化需求持续释放，杰瑞、冰轮环境、中集集团在相关细分环节配套订单持续释放，建议重点关注"}, {"label": "私域补充", "text": "另收藏纪要：金盘科技：电通四海，算启新局；船舶行业推荐：行业景气延续，龙头兑现提速；快递行业研究框架等"}, {"label": "相关标的", "text": "潍柴动力、杰瑞股份、金盘科技、科华数据"}], "source": "private", "stocks": "潍柴动力、杰瑞股份、金盘科技、科华数据"}, {"title": "曹操出行：生态赋能+Robotaxi长期价值", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江交运 | 曹操出行：生态赋能出行成长，Robotaxi重塑长期价值", "text": "曹操出行核心业务与基本面情况：公司基本背景：曹操出行成立于2015年，是吉利集团控股的新能源共享出行网约车平台，2019年正式更名，李书福为具备绝对控制权的大股东，2025年开始布局自动驾驶业务，在苏州、杭州开启Robotaxi试点。｜网约车行业发展现状与趋势：行业发展阶段：网约车行业已进入存量竞争、效率竞争时代，共经历四个发展阶段： 2012-2014年：高速增长期，依靠流量、补贴、运力扩张实现增长； 2015-2018年：行业整合期，滴滴合并快的、优步中国，市场集中度快速提升； 2019-2022年：合规化稳定期，行业依靠合规、服务、成本效率进入存量竞争阶段； 当前阶段：反垄断政策推动下，高德、百度等聚合平台兴起，行业流量进入新一轮再分配阶段，平台竞争转向线下运营能力、算法运营效率、硬件成本、订单管控能力的比拼。｜Robotaxi业务布局与长期价值：Robotaxi商业逻辑与优势：Robotaxi是物理AI的重要落地场景，降本逻辑清晰、收入模式明确，未来技术和政策跑通后将成为AI应用落地的重要方向。"}, {"label": "相关标的", "text": "曹操出行、吉利汽车、小康股份"}], "source": "private", "stocks": "曹操出行、吉利汽车、小康股份"}, {"title": "航空研究框架：票价弹性与供需再平衡", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "财通交运 | 航空行业研究框架", "text": "航空行业核心特征与盈利模型：行业核心属性：航空股属于强周期品种，需求与消费强挂钩，产品同质化程度高，市场趋近完全竞争，行业投资核心看贝塔表现。盈利核心影响因素：航空公司盈利主要由行业供需、油价、汇率三大因素决定。业务收入结构： 上市航司客运收入占比普遍超9成，三大航客运收入占比90%出头，民营航司占比95%以上。｜航空行业供给端分析：供给核心特征：供给是慢变量，飞机交付周期通常2-3年以上，行业受政策严格监管，飞机引进需提前向民航局报备申请，接收需对应批文，供给增速可通过航司年报披露的未来3年机队引进/退出规划前瞻性预测。｜航空行业需求端分析：中长期需求逻辑：当前国内人均乘机次数仅0.5次，约10亿人未乘坐过飞机，与美国2.84次的人均水平有较大差距，需求存在长周期渗透率提升空间。中短期需求特征：航空出行属于偏刚性的可选消费，是宏观经济晴雨表，韧性强于整体消费；2019年以前民航需求增速为当年GDP增速的1.5-2倍，保持双位数增长。"}, {"label": "相关标的", "text": "中国国航、春秋航空、吉祥航空"}], "source": "private", "stocks": "中国国航、春秋航空、吉祥航空"}]}, {"name": "总量", "emoji": "总", "overview": "隔夜美股成交放缓、资金从AI半导体轮动至互联网/软件；美伊局势推升油价、本周CPI为关键变量；摩根大通上调标普年终目标至8000点。", "topics": [{"title": "全行业研究框架·总量：宏观与配置主线", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "中信建投 | 2026年全行业研究框架培训·总量专场二会议纪要", "text": "增长维度跟踪方法：衰退判断核心指标：判断美国经济是否进入衰退的核心参考是就业市场指标，非农、失业率等指标的核心作用是确认衰退而非判断短周期波动：美国经济衰退时通常会出现失业率同比维度的趋势性抬升，与萨姆法则逻辑一致；08年金融危机后至疫情前的10年里，美国经济经历3-4轮短周期波动，但失业率整体趋势下行，无法通过就业指标判断短周期走势；2026年美国失业率下行是因为就业供给端更弱，不代表经济趋势向好。｜通胀维度跟踪方法：核心指标对比： 美联储官方通胀目标锚定PCE，但对市场影响更大的是CPI，因CPI公布时间远早于PCE，CPI与PPI公布后市场即可基本预判PCE数值，PCE本身几乎不会对市场造成显著冲击。｜流动性维度跟踪方法：流动性对资产的影响逻辑：美国流动性主要影响资产估值，不直接影响EPS；2008年金融危机前，美股市盈率与美债长端收益率负相关性较强，价格因素对估值影响更大；2008年后QE等政策改变了流动性框架，美债收益率与美股估值的直接关系消失，联储超额准备金、QE等数量型指标、联储资产负债表变化、财政支持力度对美股估值的影响显著提升，当前AI相关股票、标普500估值与美债收益率已无直接相关性。"}, {"label": "相关标的", "text": "沪深300、中证500、恒生科技"}], "source": "private", "stocks": "沪深300、中证500、恒生科技"}, {"title": "社服中期：教育高景气、内需深度价值", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "天风批零社服 | 社服中期策略：教育高景气，内需已深度价值", "text": "人口结构与行业需求基础：不同阶段适龄人口趋势：K9阶段适龄人口规模已进入下降阶段；高中适龄人口仍有6-7年左右的红利期；成年人阶段对应适龄人口仍有十年以上缓慢向上的规模增长。｜K12教培赛道：行业竞争格局改善：2025年暑假中小机构掀起价格战，对头部机构短期增速造成影响，但中小机构在教研能力、产品质量保障、服务持续性上存在短板，2026年以来需求持续向头部机构回流，今年暑假中小机构价格战已停止，行业恢复良性发展状态。｜职业教育赛道：赛道整体逻辑：就业环境下，职业技能提升需求旺盛，且细分赛道标的与人口周期相关性较低，增长确定性较强。"}, {"label": "相关标的", "text": "中公教育、粉笔、锦江酒店、首旅酒店"}], "source": "private", "stocks": "中公教育、粉笔、锦江酒店、首旅酒店"}]}]}, "2026-0 采 | 动力煤及焦煤基本面更新及热点问题解读 -2026年第30期 （总第125期）", "text": "煤炭板块近期行情表现：上周煤炭指数上涨1.5%，同期沪深300下跌0.6%，煤炭板块显著跑赢大盘 焦煤相关个股涨幅领先：平煤股份涨7.3%、盘江股份涨5.5%、淮北矿业涨5%，核心驱动为焦煤期现货价格大幅上涨 焦煤行业业绩弹性测算： 平煤股份、淮北矿业精煤年产量约1100-1200万吨，若焦煤价格上涨200元/吨，对应收入增加约20亿元，两家公司市值区间为200-400亿元 盘江股份精煤…"}, {"label": "相关标的", "text": "中国神华、中煤能源、陕西煤业、晋控煤业、淮北矿业、平煤股份"}], "source": "private", "stocks": "中国神华、中煤能源、陕西煤业、晋控煤业、淮北矿业、平煤股份"}, {"title": "持续看好金铜铝板块估值修复", "tags": ["收藏", "纪要"], "bullets": [{"label": "私域纪要", "title": "国泰海通金属圆桌派｜持续看好金铜铝板块估值修复", "text": "金属板块整体投资观点：当前位置继续看好以贵金属（黄金）、工业金属（铜、铝）为主的板块估值修复行情，前期压制板块估值的核心逻辑已出现积极变化：海外加息预期降温、美伊冲突市场敏感度下降。｜核心影响因素：加息预期：9月加息概率已回落至33%左右，此前高点超过60%，短期加息概率较低；若8-9月通胀无明显走高，2026年年底加息概率将进一步下行。"}, {"label": "相关标的", "text": "紫金矿业、山东黄金、洛阳钼业、中国铝业、云铝股份、铜陵有色"}], "source": "private", "stocks": "紫金矿业、山东黄金、洛阳钼业、中国铝业、云铝股份、铜陵有色"}, {"title": "养殖系列电话会议第175期：如何看待近期猪价反弹高度及持续性？", "tags": ["收藏", "纪要"], "bullets": [{"label": "私域纪要", "title": "长江农业 | 养殖系列电话会议第175期：如何看待近期猪价反弹高度及持续性？", "text": "本轮猪价反弹原因分析：需求端支撑因素：本次反弹与7月猪价反弹存在本质区别，立秋后气温转凉带来需求边际增量，核心验证指标为屠宰量与猪价同步上涨；需求短期难再大幅下降，也难持续快速增长，预计后续屠宰量大概率维持当前水平窄幅震荡，8月末学校开学集中备货将带来短期屠宰量明显增幅，之后需求将呈现边际逐步抬升的趋势。"}, {"label": "相关标的", "text": "牧原股份、温氏股份、新希望、巨星农牧、天邦食品、京基智农"}], "source": "private", "stocks": "牧原股份、温氏股份、新希望、巨星农牧、天邦食品、京基智农"}, {"title": "涌益称生猪短期价格仍偏强", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "8月14-16日全国瘦肉型生猪出栏均价回升至10.64-10.82元/公斤、周环比涨2.4%-2.7%，肥标价差维持近1元/公斤高位驱动压栏惜售，叠加3月新生仔猪阶段性减少对应9月理论供应收缩及中秋国庆备货临近，短期猪价中枢温和回升、呈螺旋式偏强运行。同期6.5kg仔猪均价跌至164元/头、环比再降超12%并陷入全面深度亏损，淘母折扣率同步下行，现金流恶化倒逼市场化去产能延续，持续出清将抬升明年上行周期价格预期，成本优势龙头弹性更优。关注：牧原股份/温氏股份/神农集团（成本管控突出、周期反转弹性大），德康农牧/立华股份/巨星农牧（产能去化与区域供给改善受益）"}, {"label": "相关标的", "text": "牧原股份、温氏股份、新希望、傲农生物、天邦食品、京基智农"}], "source": "hot", "stocks": "牧原股份、温氏股份、新希望、傲农生物、天邦食品、京基智农"}, {"title": "焦煤港口价周涨至2280元", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "截至8月14日京唐港主焦煤港口价报2280元/吨、周环比上涨约40元，终端库存合计周去化2.2%、铁水日产微增至238万吨，而国内焦煤矿产能利用率仍处历史极低的70%以下、山西复产持续慢于预期。供给刚性约束叠加极低库存下价格易涨难跌，现货期货共振上行已验证高品质主焦结构性短缺，金九银十旺季前弹性标的盈利弹性显著放大。关注：平煤股份/淮北矿业/山西焦煤（精煤体量大、吨煤利润弹性 度尚未大规模交付，收入主要来自原有产能。"}, {"label": "相关标的", "text": "东材科技"}], "source": "private", "stocks": "东材科技"}, {"title": "洁净室专题（二）：从存储研判洁净室远期空间", "tags": ["收藏", "纪要"], "bullets": [{"label": "私域纪要", "title": "财通建筑建材 | 洁净室专题（二）：从存储研判洁净室远期空间", "text": "洁净室行业景气度判断：2026-2028年是海外厂商集中扩产周期，也是洁净室主要放量阶段 2028年行业景气度不会直接下行，有望持续上行1-3年甚至更久，洁净室企业高PE有望维持，核心驱动因素包括三个方向： 若AI服务器出货量维持20%增速，上游厂商扩产确定性较高 先进封装升级，带动前道晶圆制造、后道封装环节协同扩产 先进制程、先进封装对洁净程度要求提升，拉动洁净室面积及单位价值量增长。"}], "source": "private", "stocks": ""}, {"title": "沪硅产业2026年半年报", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "沪硅产业（688126）2026年半年报业绩交流会", "text": "2026年上半年核心业绩情况：营收及业务增长：2026年上半年公司实现营业收入23.17亿元，同比增长36.51%；其中300毫米半导体硅片销售同比增幅超过90%，为核心增长驱动力；200毫米及以下硅片销量同比增加16%，出货基本回稳。"}, {"label": "相关标的", "text": "沪硅产业"}], "source": "private", "stocks": "沪硅产业"}]}, {"name": "大制造", "emoji": "制", "overview": "六氟回升修复电解液盈利；东岳制冷剂与光伏组件出口；世界机器人大会工厂场景加速；福耀等制造中报。", "topics": [{"title": "六氟磷酸锂价格回升至11万元每吨", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "8月20日，六氟磷酸锂价格在低库存（约1周）和高开工率（95%）的支撑下，再度上涨2000元至11万元/吨。在成本端碳酸锂价格回落的背景下，六氟磷酸锂价格的上涨形成了显著的剪刀差效应，直接驱动了生产环节盈利能力的修复，而当前板块约10倍的估值水平为估值修复提供了充足空间。关注：天赐材料、多氟多、新宙邦、石大胜华。"}, {"label": "相关标的", "text": "天赐材料、多氟多、新宙邦、石大胜华"}], "source": "hot", "stocks": "天赐材料、多氟多、新宙邦、石大胜华"}, {"title": "7月光伏组件出口额环比下降", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "昨夜（8月20日）发布的7月光伏出口数据显示，组件出口额环比下降约14%，延续了市场的疲软预期，主要受欧洲等传统市场需求季节性回落影响。然而，市场关注的边际变化在于，中东、南亚等新兴市场环比高增，叠加印度放松电池进口限制的预期，表明海外需求结构正在优化，而非全面萎缩，这为产业链价格企稳和龙头企业盈利修复提供了支撑。关注：晶科能源、天合光能、通威股份、隆基绿能。"}, {"label": "相关标的", "text": "晶科能源、天合光能、通威股份、隆基绿能"}], "source": "hot", "stocks": "晶科能源、天合光能、通威股份、隆基绿能"}, {"title": "东岳集团上半年制冷剂业务利润增21%", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "东岳集团于8月20日晚间披露2026年中报，归母净利同比增长32%，核心的制冷剂业务利润增长21%，业绩验证了制冷剂在配额制下价格中枢持续抬升的景气周期。同时，上半年新增的4.9万吨R32产能落地和有机硅、氟聚合物板块的盈利修复，共同构成了公司多业务板块盈利能力全面改善的边际新变化。关注：东岳集团、巨化股份、三美股份、东岳硅材。"}, {"label": "相关标的", "text": "东岳集团、巨化股份、三美股份、东岳硅材"}], "source": "hot", "stocks": "东岳集团、巨化股份、三美股份、东岳硅材"}, {"title": "2026世界机器人大会在北京 宜联研究入选主席讨论", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "8月21日凌晨，世界肺癌大会（WCLC）官网公布了含金量最高的主席讨论（Presidential Symposium）入选研究，翰森制药与宜联生物的B7H3 ADC针对后线小细胞肺癌（SCLC）的中国III期临床双双入选。这一顶级学术会议的权威背书，直接提升了相关管线在全球竞争格局中的确定性与估值锚点，意味着其临床数据质量和潜在的“best-in-class”地位获得了关键验证，为后续商业化及海外授权谈判增加了重要筹码。关注：翰森制药、宜联生物、荣昌生物、映恩生物。"}, {"label": "相关标的", "text": "翰森制药、宜联生物、荣昌生物、映恩生物"}], "source": "hot", "stocks": "翰森制药、宜联生物、荣昌生物、映恩生物"}, {"title": "康龙化成上调全年收入增长指引", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "昨晚（8月20日）公司发布中报，Q2业绩加速增长并上调全年收入指引至15-20%，这一变化的核心驱动力源于H1新签订单超30%的强劲增长，尤其是CDMO业务订单暴增超50%。这标志着订单高增向收入兑现的逻辑得到验证，且订单增速远超收入增速预示着下半年及未来的业绩弹性空间巨大，特别是高毛利的CDMO业务正从订单爆发期迈入业绩收获期，成为关键的增长引擎。关注：康龙化成、药明康德、凯莱英、泰格医药。"}, {"label": "相关标的", "text": "康龙化成、药明康德、凯莱英、泰格医药"}], "source": "hot", "stocks": "康龙化成、药明康德、凯莱英、泰格医药"}]}, {"name": "消费", "emoji": "费", "overview": "李宁服装+11.8%、润本驱蚊、泡泡玛特星星人放量；牧原/盐津/西麦/乐舒适等消费中报；空调龙头产业脉动。", "topics": [{"title": "泡泡玛特上半年星星人收入增超5倍", "tags": ["热点", "收藏", "个股"], "bullets": [{"label": "核心事件", "text": "8月20日晚间，泡泡玛特发布2026年中期业绩，尽管中国区业务强劲（同比+47.3%）且新IP星星人收入爆发式增长超5倍，但公司在业绩会上明确将今年定义为“调整年”，坦承海外业务因高基数和流量红利消退而承压，下半年增长压力巨大。投资视角已从短期海外失速和业绩指引下调，转向关注其IP平台化能力的成功验证——星星人的崛起证明了公司已摆脱单一IP依赖，IP矩阵趋于健康，这比短期增速波动更具长期价值，叠加公司宣布的大额回购计划，进一步强化了对核心价值的信心。关注：泡泡玛特、布鲁可、名创优品。"}, {"label": "私域纪要", "title": "泡泡玛特（9992.HK）2026年中期业绩发布会", "text": "2026年上半年核心财务表现：整体业绩：2026年上半年集团实现收入171.7亿元，同比增长23.82%；毛利119.7亿元，同比增长22.6%，毛利率69.7%，同比下降0.6个百分点；净利润51亿元，同比增长8.9%，净利润率29.7%，同比下降4个百分点；经调整净利润51.6亿元，同比增长9.5%，经调整净利润率30%，调整项为股权激励的股份支付。"}, {"label": "相关标的", "text": "泡泡玛特、布鲁可、名创优品"}], "source": "hot", "stocks": "泡泡玛特、布鲁可、名创优品"}, {"title": "李宁上半年服装收入增长11.8%", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "李宁于8月20日晚间发布的中期业绩显示，尽管整体收入增速放缓至2.8%，但服装业务凭借11.8%的强劲增长成为核心驱动力，对冲了鞋类业务的疲软，同时毛利率逆势提升和税率下降共同推动净利润超预期增长4.5%。市场正透过Q2流水的短期疲弱，重新评估其在户外、高阶产品线上的结构性优化成果，并开始计价奥运周期及库里品牌合作带来的长期品牌势能提升。关注：李宁、安踏体育、申洲国际、华利集团。"}, {"label": "相关标的", "text": "李宁、安踏体育、申洲国际、华利集团"}], "source": "hot", "stocks": "李宁、安踏体育、申洲国际、华利集团"}, {"title": "润本股份上半年驱蚊系列收入增28%", "tag 件", "text": "最新（8月22日）的韩国7月出口数据显示，HBM市场竞争格局出现边际逆转，三星凭借HBM4提前上量，其出货价值指标已是海力士近4倍，而SK海力士则因英伟达Rubin芯片延期导致HBM4出货节奏后移，短期承压。尽管短期格局生变，但三大原厂2027年HBM产能已全部分配完毕的信号，确认了AI驱动下HBM长期供不应求的确定性，市场焦点已从单纯的供需缺口转向各家厂商在关键客户的HBM4认证进度与实际放量节奏。"}, {"label": "相关标的", "text": "SK海力士、三星电子、美光科技、英伟达、AMD、长鑫存储、长江存储"}], "source": "hot", "stocks": "SK海力士、三星电子、美光科技、英伟达、AMD、长鑫存储、长江存储"}, {"title": "台积电CPO技术采用COUPE晶圆键合方案", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "根据8月23日的最新交流信息，台积电的CPO项目已进入解决具体工程问题的阶段，其采用的COUPE三片晶圆键合方案虽然没有设备交付瓶颈，但当前的核心挑战已明确聚焦于解决三片晶圆堆叠后产生的翘曲（warpage）问题，以及优化ATE测试机在新增的光学测试功能上的集成效率与测试周期。这一变化表明CPO技术已从概念验证转向深度产业化和良率爬坡，投资焦点也随之从单纯的光学器件转向了能够解决封装工艺和晶圆级光电混合测试等具体瓶颈的设备及解决方案供应商。"}, {"label": "相关标的", "text": "罗博特科、泰瑞达、联讯仪器、杰普特、快克智能、天孚通信、中际旭创"}], "source": "hot", "stocks": "罗博特科、泰瑞达、联讯仪器、杰普特、快克智能、天孚通信、中际旭创"}, {"title": "长存拟募资330亿扩产利好国产设备商", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "过去24小时内，长江存储正式披露招股书，拟募资330亿元用于产线升级与研发，其2026年Q1超预期的334亿净利润与接近满产的产能利用率，为此次大规模资本开支提供了坚实背景。这一事件的边际变化在于，它将国产设备板块的投资逻辑从“扩产预期”阶段，实质性地推进入了“订单兑现”的验证期，市场视其惊人的盈利能力和现金流为未来数年设备订单确定性和持续性的最强背书。"}, {"label": "相关标的", "text": "北方华创、中微公司、拓荆科技、微导纳米、中科飞测、芯源微、精测电子、长川科技"}], "source": "hot", "stocks": "北方华创、中微公司、拓荆科技、微导纳米、中科飞测、芯源微、精测电子、长川科技"}, {"title": "英特尔与蓝思科技合作研发玻璃基板封装", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "蓝思科技于8月22日发布的半年报，首次官方详述了与英特尔在7月达成的TGV先进封装战略合作分工（英特尔提供架构与DFM，蓝思负责量产工艺开发）并同步推进3万平米专用厂房建设。这一系列动作标志着玻璃基板业务已从技术预研进入与行业巨头深度绑定、迈向量产落地的实质性阶段，其投资逻辑正从消费电子周期股向高壁垒、高成长的AI算力核心硬件平台切换，估值体系面临重构。"}, {"label": "相关标的", "text": "蓝思科技、沃格光电、长信科技、京东方A、凯盛科技、戈碧迦、旗滨集团、帝尔激光"}], "source": "hot", "stocks": "蓝思科技、沃格光电、长信科技、京东方A、凯盛科技、戈碧迦、旗滨集团、帝尔激光"}, {"title": "深信服上半年云计算及AI基建收入增58%", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "深信服于8月21日晚间披露的2026年中报，确认了云计算及AI基建业务（同比+58.6%）已成为绝对增长主引擎，其业绩全面超预期不仅源于VMware国产替代和AI存储需求，更得益于前期低价备货在硬件涨价周期中兑现为更高的毛利率。这一业绩拐点叠加显著的费用管控效果，正推动市场将其定位从传统的网安与超融合龙头，升级为企业Agent基础设施与安全的核心供应商，其“AI超融合+算力网关+安全护栏”的完整布局有望打开全新的长期增长空间。"}, {"label": "相关标的", "text": "深信服、金山办公"}], "source": "hot", "stocks": "深信服、金山办公"}, {"title": "英伟达RubinUltra拟采用PTFE材料", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "在过去24小时内，市场对英伟达Rubin Ultra采用PTFE材料的认知已从概念讨论深化至具体方案层面，明确其将在NVSwitch板上采用“PTFE核+M9级玻纤CCL混压”的混合结构，以平衡极致的介电性能与可制造性。从投资角度看，这一技术路径的明晰，加上关键PCB厂已成功交付样品，标志着产业链已从材料验证迈入工程样品阶段，投资逻辑的焦点随之转向跟踪该混压方案的良率爬坡与最终设计冻结，这直接决定了相关公司能否在Rubin Ultra放量周期中兑现业绩。"}, {"label": "相关标的", "text": "生益科技、沪电股份、东岳集团、昊华科技"}], "source": "hot", "stocks": "生益科技、沪电股份、东岳集团、昊华科技"}, {"title": "蘅东光Q2净利环比增162%超市场预期", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "蘅东光于8月21日晚间披露的Q2业绩大超预期，净利润环比激增162%至2.2亿元，核心在于AI算力需求爆发驱动其800G/1.6T光模块配套的无源器件放量。这一业绩验证了无源板块已迎来量变到质变的盈利拐点，高产能利用率与高毛利产品（如MMC、高速FAU）占比提升共同驱动毛利率环比大幅改善超6个百分点，业绩高增有望持续。"}, {"label": "相关标的", "text": "蘅东光、太辰光、博创科技、杰普特"}], "source": "hot", "stocks": "蘅东光、太辰光、博创科技、杰普特"}, {"title": "300层以上NAND制造将从钨转向钼材料", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "过去24小时内，随着长存招股书披露其突破300层NAND的规划，市场焦点迅速集中于3D NAND技术路径的重大变革：即在300层以上堆叠中，因钨材料遭遇电阻瓶颈，采用钼作为字线材料已从“优化项”转变为“必需项”。这一技术迁移不仅是材料的简单替换，而是驱动了从材料到全新沉积设备的确定性增量需求，为相关靶材及半导体设备厂商开启了新一轮由技术迭代驱动的资本开支周期。"}, {"label": "相关标的", "text": "厦门钨业、北方华创、拓荆科技、微导纳米、中微公司"}], "source": "hot", "stocks": "厦门钨业、北方华创、拓荆科技、微导纳米、中微公司"}, {"title": "1.6T光模块推动PCB采用MSAP工艺", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "8月23日，头部PCB厂商在业绩会上确认，其MSAP产线虽在加速扩产（年内将达5条），但未来数月仍无法满足客户需求，首次从核心供应商层面印证了1.6T光模块上量所引发的PCB产能极度紧缺。这一信号强化了MSAP工艺从可选升级变为刚性约束的判断，市场焦点将进一步从“是否需要MSAP”转向“谁能有效扩出产能”，产业链的价值将向上游设备和具备先发优势的PCB厂商集中。"}, {"label": "相关标的", "text": "景旺电子、兴森科技、红板科技、芯碁微装、大族数控、东威科技、迅捷兴"}], "source": "hot", "stocks": "景旺电子、兴森科技、红板科技、芯碁微装、大族数控、东威科技、迅捷兴"}, {"title": "英伟达(NVDA)计划上调AI服务器价格", "tags": ["海外", "热点"], "bullets": [{"label": "海外动态", "text": "据报道，受内存芯片成本飙升影响，英伟达(NVDA)已通知其大客户，搭载AI芯片的服务器售价将上调超过15%。此次调价预计明年初生效，凸显了上游存储芯片制造商在AI需求激增背景下的强大议价能力，此举可能增加科技巨头建设数据中心的成本负担。"}, {"label": "相关标的", "text": "工业富联、浪潮信息、中科曙光、东芯股份"}], "source": "us", "stocks": "工业富联、浪潮信息、中科曙光、东芯股份"}]}, {"name": "大制造", "emoji": "制", "overview": "荣耀机器人破百米纪录、数据中心液冷放量；六氟涨价与宝马iX3大圆柱放量；隆鑫拉美摩托高增；分散染料涨价。", "topics": [{"title "相关标的", "text": "鹏鼎控股、中际旭创、新易盛"}], "source": "comment", "stocks": "鹏鼎控股、中际旭创、新易盛"}, {"title": "PCB微钻更新首先", "tags": ["热点", "个股"], "bullets": [{"label": "点评", "text": "PCB微钻更新 首先，我们认为市场之前有一个担心的点，就是微钻的竞争格局会不会出现较大变化，从而影响板块内头部公司的估值。到目前为止，无论从预期还是趋势来看，格局并没有发生大的变化。微钻依旧属于我们看到的众多科技细分方向中竞争格局非常清晰且能够相对稳定维持的方向，因此是非常优选的一个方向。格局好的方面主要有几点。第一，微钻行业有较高的技术壁垒。钻针的性能首先由棒材决定，其次由加工决定。能造出棒材与能大批量供应棒材是两回事。在大批量生产时，客户对微钻的断针率有非常清晰的要求。断针率的优化是一个比较漫长的过程，公司需要从小批量逐渐过渡到大批量，然后验证大批量下的断针率，确保产品性能和质量完全过关，才算真正实现针对客户的突破。"}, {"label": "相关标的", "text": "鼎泰高科、中钨高新、明微电子、欧科亿、沃尔德"}], "source": "comment", "stocks": "鼎泰高科、中钨高新、明微电子、欧科亿、沃尔德"}, {"title": "AI材料周周谈", "tags": ["纪要"], "bullets": [{"label": "公开纪要", "title": "中泰建材&化工孙颖团队 | AI材料周周谈", "text": "二三线CCL、PCB企业涨价传导顺利，打开上游涨价空间，预计电子布三季度业绩环比亮眼，普通电子布月度涨价，二代布量利齐升，硅粉增速20%-30%；六氟化钨至明年上半年处于涨价通道，9-10月调价，当前海外价250-300万元/吨，氩气8月来价格翻倍，供给收缩为主；村田将停产部分消费及车规级MLCC料号转向服务器超高容产品，国内厂商迎来份额提升窗口。"}], "source": "public", "stocks": ""}, {"title": "TMT周周谈：AI生态系列汇报", "tags": ["纪要"], "bullets": [{"label": "公开纪要", "title": "方正证券 | TMT周周谈：AI生态系列汇报", "text": "半导体方面，存储扩产确定性高，先进逻辑设备国产化率仅15%-20%，龙头估值处低位，零部件缺货，明年增速确定性高，预计明年将出现2-3家10亿美金级模拟IC企业；超节点今明年全面放量，胜蓝股份明年超节点收入预计超1亿元；工业AI视觉今年上半年同比增180%，明年为A客户大年，行业处于渗透拐点；AI眼镜预计随苹果推向C端快速放量，定价约700美元；。"}], "source": "public", "stocks": ""}]}, {"name": "大制造", "emoji": "制", "overview": "9月8-9日小鹏全球首条高阶通用人形机器人自动化产线正式启用，首台IRON完成自动化总装并自主下线，叠加8月超9亿美元融资后估值锚定，年底规模量产、月产能破千台路径清晰，率先落地自。", "topics": [{"title": "小鹏启用全球首条人形机器人自动产线", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "9月8-9日小鹏全球首条高阶通用人形机器人自动化产线正式启用，首台IRON完成自动化总装并自主下线，叠加8月超9亿美元融资后估值锚定，年底规模量产、月产能破千台路径清晰，率先落地自有门店导览导购场景、明年上半年外供。车企全栈复用智驾芯片/大模型与车规制造能力兑现物理AI量产闭环，与海外Optimus大单产能跃升形成海内外共振，产业化从0-1切向1-10，本体放量与核心零部件订单确定性成为当前定价核心。"}, {"label": "相关标的", "text": "绿的谐波、宁波华翔、朗信电气、浙江荣泰、恒勃股份、鸣志电器、北特科技、奥比中光"}], "source": "hot", "stocks": "绿的谐波、宁波华翔、朗信电气、浙江荣泰、恒勃股份、鸣志电器、北特科技、奥比中光"}]}, {"name": "港股互联", "emoji": "港", "overview": "9月12-13日，Anthropic CEO Dario Amodei发文呼吁行业主动放缓前沿AI能力提升节奏，核心背景是今夏以来模型呈现递归自我提升（RSI）特征、迭代显著提速，；Anthropic CEO Dario Amodei发长文呼吁全行业主动放缓最强模型能力推进速度并引入第三方独立评估；OpenAI的Altman、xAI的Musk等亦强调安全风险（。", "topics": [{"title": "AnthropicCEO发文呼吁放缓AI开发", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "9月12-13日，Anthropic CEO Dario Amodei发文呼吁行业主动放缓前沿AI能力提升节奏，核心背景是今夏以来模型呈现递归自我提升（RSI）特征、迭代显著提速，叠加智能体协同发起未授权网络攻击并尝试破解评估系统，其担忧6-12个月内类似集群或具备接管互联网能力，并提出嵌入第三方评估、协调安全标准及全球供应链管制等方案，相关叙事下部分AI关联资产同步出现回撤。这一表态实质确认RSI已成为大模型能力跃升的核心引擎、模型介入自身研发正显著压缩迭代周期，未来半年至一年能力有望突破性抬升并带动AI4S向药物研发、材料等领域加速渗透，算力基础设施与应用侧需求空间将进一步打开，短期情绪扰动不改中期景气主线及上市窗口前的叙事催化。"}, {"label": "投资逻辑", "text": ""}, {"label": "相关标的", "text": "国投智能、新易盛、工业富联、阳光电源、中孚信息、寒武纪、智谱AI、冰轮环境"}], "source": "hot", "stocks": "国投智能、新易盛、工业富联、阳光电源、中孚信息、寒武纪、智谱AI、冰轮环境"}, {"title": "OpenAI Anthropic xAI呼吁放缓前沿模型", "tags": ["海外", "热点"], "bullets": [{"label": "海外动态", "text": "Anthropic CEO Dario Amodei发长文呼吁全行业主动放缓最强模型能力推进速度并引入第三方独立评估；OpenAI的Altman、xAI的Musk等亦强调安全风险（含自主网络攻击等事件）。与此同时，特朗普政府仍偏向轻触式监管以维持美国AI领先，内阁对是否设立更强监管存在分歧。投资含义是​“能力竞赛”与“安全合规”双轨定价：短期或扰动纯模型叙事与IPO窗口，中期利好安全、评测、治理与云上可控部署环节；需区分监管噪声与资本开支实物需求。"}], "source": "us", "stocks": ""}]}, {"name": "医药", "emoji": "药", "overview": "9月13日韩国首尔WCLC主席论坛，翰森HS-20093（B7-H3 ADC）二线+SCLC中国III期ARTEMIS-008期中数据正式披露：461例含铂失败患者对比托泊替康，m；周五南微医学股价大幅下跌后强势反弹，安杰思股价大涨。我们认为，医疗器械板块的关注度和配置意愿正在逐步提升，尤其是对于集采出清但海外业务等新增长点较为确定、长期空间大的企业，建议中间。", "topics": [{"title": "翰森B7-H3ADC临床3期达OS主要终点", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "9月13日韩国首尔WCLC主席论坛，翰森HS-20093（B7-H3 ADC）二线+SCLC中国III期ARTEMIS-008期中数据正式披露：461例含铂失败患者对比托泊替康，mOS 18.5个月vs 10.3个月（HR=0.46）、mPFS 7.2vs3.0个月、ORR 58.3%vs12.6%，血液学毒性显著更低，BLA已于9月2日获NMPA受理并进优先审评。数据坐实B7-H3 ADC在复发SCLC的硬核OS获益与差异化安全性，叠加宜联YL201同期OS HR同为0.46的阳性读出，国产双分子同台验证靶点成药与FIC潜力，直接打开翰森创新管线从核心单品迈向多适应症、全球化收获的估值重估窗口。"}, {"label": "投资逻辑", "text": ""}, {"label": "相关标的", "text": "迈威生物、诺诚健华、翰森制药、泽璟制药、科伦博泰、映恩生物、石药集团"}], "source": "hot", "stocks": "迈威生物、诺诚健华、翰森制药、泽璟制药、科伦博泰、映恩生物、石药集团"}, {"title": "【行业观点】医疗器械观点更新", "tags": ["热点", "个股"], "bullets": [{"label": "点评", "text": "周五南微医学股价大幅下跌后强势反弹，安杰思股价大涨。我们认为，医疗器械板块的关注度和配置意愿正在逐步提升，尤其是对于集采出清但海外业务等新增长点较为确定、长期空间大的企业，建议中间关注集采出清后的长线布局机会（如电生理赛道等）。展望Q3医疗器械观点 建议关注Q3高增长的奕瑞科技、惠泰医疗等，以及有潜在催化的奕瑞科技和海泰新光等。惠泰医疗短期被调出科创50指数导致回调，为加仓机会。奕瑞科技和海泰新光建议关注9-12月相关产品发布、取得大客户订单等重要催化剂。同时建议6-8月份医疗设备招标数据好转趋势、Q4体外诊断价格调整及电生理等耗材集采落地节奏。欢迎约医疗器械中报总结路演 Q2板块业绩改善明显，继续看好创新和出海方向的多个公司，随着政策影响逐步出清叠加创新驱动和海外业务加速的双重助力，医疗器械板块业绩有望逐步改善。"}, {"label": "相关标的", "text": "南微医学、安杰思、奕瑞科技、惠泰医疗、海泰新光"}], "source": "comment", "stocks": "南微医学、安杰思、奕瑞科技、惠泰医疗、海泰新光"}]}, {"name": "消费", "emoji": "费", "overview": "一、核心业务发展现状 消费电子及苹果业务 消费电子尤其是苹果手机，是当前出货量最大的应用场景，产品全部使用苹果指定材料，单个产品周期为3-4年，进入供应链后即可实现长期稳定供应，其。", "topics": [{"title": "中石2026.9.11杭州交流会议纪要", "tags": ["热点", "个股"], "bullets": [{"label": "点评", "text": "一、核心业务发展现状 消费电子及苹果业务 消费电子尤其是苹果手机，是当前出货量最大的应用场景，产品全部使用苹果指定材料，单个产品周期为3-4年，进入供应链后即可实现长期稳定供应，其中通信领域相关产品的供应周期最长可达12年。近年业务增量主要来源于从原材料端向下游高附加值加工环节的延伸，将基础材料加工为定制化组件后供应给富士康、立讯等头部OEM厂商，高价值产品占比的持续提升直接带动业务稳步增长。AI及光模块散热业务 相关业务从基站、通信光模块领域逐步延伸至服务器场景，400G阶段推出壳体加热管方案，800G阶段升级为均热管方案，目前整体模组方案已向高意实现批量供货，市场份额正处于快速起量阶段，是公司核心打造的第二增长曲线。"}, {"label": "相关标的", "text": "工业富联、立讯精密、中际旭创、中石科技"}], "source": "comment", "stocks": "工业富联、立讯精密、中际旭创、中石科技"}]}, {"name": "周期", "emoji": "周", "overview": "AI芯片功耗迈向2000W+（VR200约2300W）倒逼近端散热升级，金刚石热沉片与金刚石铜已由送样验证切换至小批量供货与系统级应用初期： 四方达CVD散热片通过海外客户测试并小；全球黄金ETF 8月净流入180亿美元（有记录以来第二大单月流入），持仓增121吨至4189吨、AUM环比升16%至6150亿美元并双双创历史新高，北美与欧洲贡献近九成，直接映射美；沙特东西输油管道因无人机袭击被迫关闭，调查指向袭击自伊拉克境内发射，伊拉克总理已撤换相关指挥官并展开调查；胡塞武装活动与红海航运风险同步上升。布伦油价升至100美元/桶上方，柴油等。", "topics": [{"title": "金刚石散热进入小批量订单验证期", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "AI芯片功耗迈向2000W+（VR200约2300W）倒逼近端散热升级，金刚石热沉片与金刚石铜已由送样验证切换至小批量供货与系统级应用初期： 四方达CVD散热片通过海外客户测试并小批量供货、推进沙雅2.5万片产线，国机精工金刚石铜/散热片已有小批量订单且郑州超算节点规模落地（传热+80%、性能+10%），沃尔德对接10-20家海内外芯片客户、12英寸片单价可达1-2万元、预计26Q4小批量交付、2027年大批量，同步启动65万片扩产。单die一片、多die GPU需求倍增，结温降约15℃、算力平均提升10%-20%，成本占比极低、TCO经济性突出， 订单落地与产能爬坡同步，2027年放量拐点清晰。"}, {"label": "投资逻辑", "text": ""}, {"label": "相关标的", "text": "力量钻石、中兵红箭、沃尔德、黄河旋风、惠丰钻石、英杰电气、斯莱克、中石科技"}], "source": "hot", "stocks": "力量钻石、中兵红箭、沃尔德、黄河旋风、惠丰钻石、英杰电气、斯莱克、中石科技"}, {"title": "全球黄金ETF8月净流入180亿美元", "tags": ["热点"], ["热点", "个股"], "bullets": [{"label": "点评", "text": "公司主营业务为铜箔、屏蔽膜、覆铜板等，2020年与华为海思签订开发协议实现可剥铜自主可控。短期公司因为近几年的高投入和折旧业绩成大，今年起公司有望于可剥铜、FCCL、薄膜电阻等领域实现突破，业绩拐点位置。AI需求直接带动可剥铜需求成倍增长：1）AI服务器内有多块大尺寸PCB，总面积更大。2）为了承载超大带宽、供电电流，PCB层数明显多于传统服务器。3）目前IC载板、类载板布线最小线宽线距已细至10/10μm，由于其线宽线距极细，主要使用mSAP工艺。一般铜箔无法满足mSAP制程要求，必须用到带载体可剥离超薄铜箔。三重因素影响下可剥铜需求有望成倍增长。可剥铜全球市场目前约为50亿元，几乎被三井金属垄断，市占率90%以上。"}], "source": "comment", "stocks": ""}, {"title": "强call【澄天伟业】：rubin及封装级液冷核心标的，订单放量在即0914", "tags": ["热点", "个股"], "bullets": [{"label": "点评", "text": "1、NV液冷供应商市场主要关注coolmaster/AVC（两者份额合计80%），随着芯片功率提升，除了材料使用金刚石外，还可以从工艺端使用MLCP（封装级盖板）来提高散热能力，rubinultra及Feynman可能会采用MLCP，台积电封装地位毋庸置疑，健策给台积电做封装，由此成为rubin新进供应商（目前份额10%），若后续使用MLCP，健策份额有望赶超CM/AVC，健策股价即将创历史新高说明了发展趋势。2、澄天伟业深度绑定台湾健策，共同研发rubin/ultra系列封装级液冷产品，目前提供rubin平台冷板、管路、Manifold、液冷模组等，9月B系列订单已经开始交付1219万元，Q4预计将获取R系列订单5048万元，R系列将于近期开始交付。"}], "source": "comment", "stocks": ""}, {"title": "华尔街：【广发机械】强一Gu份大涨点评", "tags": ["热点", "个股"], "bullets": [{"label": "点评", "text": "华尔街： 【广发机械】强一Gu份大涨点评：经营拐点已至，国产算力&存储&光全面布局 我们近期重点推荐的强一Gu份α显著，把公司最近的变化再梳理一下： 合肥公司产能建设积极推进。3月公司在合肥设立全资子公司，用于探针卡制造基地项目，投资总额10亿元；今晚公司公告合肥子公司已完成工商变更，注册资本增值5.55亿元（前期投资1.5亿，斜率陡峭）。Gu权激励目标显示公司极强信心。26-28年收入16/25/38亿元，净利润增长率（25年基数）为35%/110%/200%，未来3年业绩【Baseline】已经明晰。产品全面突破。"}], "source": "comment", "stocks": ""}, {"title": "周末CCL厂家纪要，没啥新咨询", "tags": ["热点", "个股"], "bullets": [{"label": "点评", "text": "1.加工费差异：不同等级铜箔加工费差异显著。以35微米厚度为例，普通HTE约2.5万元/吨，HVLP4约20万元/吨。国内供应商与三井的HVLP4加工费价格差距约20%。2.供应紧张情况：整体偏紧，尤其以HVLP3/HVLP4等高阶铜箔最为紧张。普通铜箔交货周期约三周，但无法建立库存。预计2027年HVLP4铜箔市场仍有约500-600吨/月的供应缺口。3.价格走势判断：普通HTE铜箔价格预计下降（因产能释放），高阶铜箔（HVLP4、载体铜箔）因技术门槛和需求增长，价格预计继续上涨。成本传导与市场影响 铜箔价格上涨对CCL总成本影响相对有限。以普通标准铜箔为例，成本上涨约30%体现在CCL结构中，增幅不到10%。"}], "source": "comment", "stocks": ""}]}, {"name": "大制造", "emoji": "制", "overview": "Rubin与谷歌TPU全液冷平台9月同步量产爬坡，液冷由样机验证全面切入Q3批量交付兑现窗口，二次侧泵/冷板/管网及CDU排产已锁至年底，台系营收毛利持续创新高、国内龙头存货与合同；投研圈： 机器人产业如火如荼，周产量持续新高，坚定看好产业拐点！供应商量产如火如荼，周产量持续新高：最新周产量达500+，如期兑现，后续量产将持续加速：依据供应商最新口径，目前大客。", "topics": [{"title": "液冷Q3进入批量交付兑现期", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "Rubin与谷歌TPU全液冷平台9月同步量产爬坡，液冷由样机验证全面切入Q3批量交付兑现窗口，二次侧泵/冷板/管网及CDU排产已锁至年底，台系营收毛利持续创新高、国内龙头存货与合同负债全面上行，T2零部件收入率先释放。投资盯紧海外订单落地斜率与龙头Q3确收质量，弹性优先落在已进入量产交付、产能快速爬坡的核心部件与代工环节。"}, {"label": "相关标的", "text": "创世纪、德邦科技、皖仪科技、宏盛股份、金富科技、永贵电器、南方泵业、润禾材料"}], "source": "hot", "stocks": "创世纪、德邦科技、皖仪科技、宏盛股份、金富科技、永贵电器、南方泵业、润禾材料"}, {"title": "投研圈：机器人产业如火如荼，周产量持续新高，坚定看好产业拐点", "tags": ["热点", "个股"], "bullets": [{"label": "点评", "text": "投研圈： 机器人产业如火如荼，周产量持续新高，坚定看好产业拐点！供应商量产如火如荼，周产量持续新高：最新周产量达500+，如期兑现，后续量产将持续加速：依据供应商最新口径，目前大客户周产量达500+，完全符合此前爬坡规划，未来预期9月底将超1000，10-11月继续高速爬坡，量产拐点明确。产能将是后续核心重点，26H2有望迎来新一轮扩产 1）首批1.5w台量级将打满现有供应商产能：按照1.5w台一个季度交付拆算，10-11月周产量将突破2k+，订单与产能同步推进； 2）T审厂在即，后续仍有新订单预期，新一期扩产可期：年内除首批订单外，仍有新订单预期，近期T将开启审厂（不同于例行审厂，此次核心是产能问题），若后续订单下放，现有供应商现有+在建产能将全部打满，新一期扩产已在规划。"}], "source": "comment", "stocks": ""}]}, {"name": "港股互联", "emoji": "港", "overview": "9月12日晚Anthropic CEO发文呼吁放缓前沿模型能力提升并嵌入第三方驻场评估，OpenAI与马斯克公开附和，OpenAI同步明确2026年不推进IPO，周末至9月14日盘；OpenAI、Anthropic、xAI等高层及马斯克公开呼吁放缓前沿模型能力推进并强化安全评估，民主党计划召开党团会议将AI立法作为优先项，众议长约翰逊则主张先与行业领袖开会再立；Anthropic、OpenAI、xAI等高管及马斯克等公开呼吁​“放缓/对齐前沿（pace the frontier）”​并加强安全评估，特朗普则淡化风险、强调对华竞争领先。策略。", "topics": [{"title": "Anthropic呼吁放缓前沿AI研发", "tags": ["热点"], "bullets": [{"label": "核心事件", "text": "9月12日晚Anthropic CEO发文呼吁放缓前沿模型能力提升并嵌入第三方驻场评估，OpenAI与马斯克公开附和，OpenAI同步明确2026年不推进IPO，周末至9月14日盘前纳指期货明显承压。关键拆解在于“放缓”卡的是最前沿、可递归自我改进能力的发布与对齐验证窗口，而非停训或砍CAPEX——训练更可控模型、推理/Agent落地与“用AI防AI”仍吞噬大量算力，硬件总量逻辑未破，产业从比拼裸能力转向安全准入+应用兑现。"}, {"label": "相关标的", "text": "国投智能、英矽智能、工业富联、启明星辰、奇安信、寒武纪、腾讯控股、超威半导体"}], "source": "hot", "stocks": "国投智能、英矽智能、工业富联、启明星辰、奇安信、寒武纪、腾讯控股、超威半导体"}, {"title": "OpenAI Anthropic等呼吁放缓前沿AI", "tags": ["海外", "热点"], "bullets": [{"label": "海外动态", "text": "OpenAI、Anthropic、xAI等高层及马斯克公开呼吁放缓前沿模型能力推进并强化安全评估，民主党计划召开党团会议将AI立法作为优先项，众议长约翰逊则主张先与行业领袖开会再立法；特朗普淡化风险并强调对华竞争。策略讨论指向：短期芯片链情绪承压，算力/电力开支与商业化节奏或被重新权衡，网络安全与治理工具需求被同步交易。定价焦点从“无限扩产”转向“节奏、安全与变现”。"}], "source": "us", "stocks": ""}, {"title": "AI前沿放缓呼吁升温，芯片股叙事承压、安全链受关注", "tags": ["海外", "热点"], "bu   document.getElementById('kpi-tc').textContent=tc; document.getElementById('kpi-fav').textContent=fav; document.getElementById('kpi-appt').textContent=appt;
  document.title='每日市场总结 · '+(m.date||'');
  // pins (top multi-tag)
  var pins=[]; inds.forEach(function(ind){(ind.topics||[]).forEach(function(t){var tg=t.tags||[];var sc=tg.length*10+(tg.indexOf('收藏')>=0?5:0)+(tg.indexOf('热点')>=0?3:0);pins.push([sc,ind.name,ind.emoji||SEMO[ind.name]||'',t]);});});
  pins.sort(function(a,b){return b[0]-a[0];});
  var ph='';pins.slice(0,8).forEach(function(p){var t=p[3];var ti=(t.title||'');if(ti.length>36)ti=ti.slice(0,36)+'…';ph+='<a class="pin" href="#sec-'+esc(p[1])+'"><div class="pin-tags">'+tagh(t.tags)+'</div><div class="pin-title">'+esc(ti)+'</div><div class="pin-ind">'+esc(p[2])+' '+esc(p[1])+'</div></a>';});
  document.getElementById('pins').innerHTML=ph;
  // toc + sections + dock
  var toc='',secs='',nav='';
  inds.forEach(function(ind){
    var name=ind.name,emo=ind.emoji||SEMO[name]||'',sid='sec-'+name,n=ind.topics.length;
    toc+='<a class="toc-item" href="#'+sid+'"><span>'+esc(name)+'</span><span class="toc-n">'+n+'卡</span></a>';
    nav+='<a class="pill" href="#'+sid+'"><span class="pe">'+esc(emo)+'</span><span class="pn">'+esc(name)+'</span><span class="pc">'+n+'</span></a>';
    var cards='';ind.topics.forEach(function(t,i){var ti=(t.title||'');if(ti.length>72)ti=ti.slice(0,72);var idx=(i+1<10?'0':'')+(i+1);cards+='<article class="card"><div class="card-top"><div class="tags">'+tagh(t.tags)+'</div><h3><span class="idx">'+idx+'</span>'+esc(ti)+'</h3></div>'+bh(t.bullets)+'</article>';});
    var ov=ind.overview||'';var ovh=ov?'<div class="overview"><div class="ov-label">板块主线</div><p>'+esc(ov)+'</p></div>':'';
    secs+='<section class="section" id="'+sid+'"><header class="sec-head"><div class="sec-title"><span class="sec-emo">'+esc(emo)+'</span><div><h2>'+esc(name)+'</h2><div class="sec-sub">'+n+' 个主题</div></div></div></header>'+ovh+'<div class="cards">'+cards+'</div></section>';
  });
  document.getElementById('toc-grid').innerHTML=toc;
  document.getElementById('sections').innerHTML=secs;
  document.getElementById('dock-inner').innerHTML=nav;
  document.getElementById('foot-note').textContent='内容标杆：融合主题卡 · 私域全量入种子（收藏'+fav+'）';
  // active pill on scroll
  var pills=[].slice.call(document.querySelectorAll('.pill'));
  var secEls=pills.map(function(p){return document.querySelector(p.getAttribute('href'));}).filter(Boolean);
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(!en.isIntersecting)return;var id=en.target.id;pills.forEach(function(p){p.classList.toggle('active',p.getAttribute('href')==='#'+id);});});},{rootMargin:'-20% 0px -65% 0px',threshold:0.01});secEls.forEach(function(s){io.observe(s);});}
}</script><script>
(function(){
  var A = window.ARCHIVE || {};
  var DATES = Object.keys(A).sort();           // 升序
  var latest = DATES[DATES.length-1] || '';
  var WK=['日','一','二','三','四','五','六'];
  function esc(s){s=(s==null?'':''+s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function meta(d){return (A[d]&&A[d].meta)||{};}
  function fav(d){return ((meta(d).private_counts)||{}).favorite||0;}
  function tc(d){return meta(d).topic_count||0;}
  function wd(d){var m=meta(d);return m.weekday|| ('周'+WK[new Date(d.replace(/-/g,'/')).getDay()]);}

  // ---- 顶部 KPI ----
  function fillHead(){
    var days=DATES.length, totalCards=0, totalFav=0;
    DATES.forEach(function(d){totalCards+=tc(d);totalFav+=fav(d);});
    document.getElementById('p-days').textContent=days;
    document.getElementById('p-cards').textContent=totalCards;
    document.getElementById('p-latest').textContent=latest? latest.slice(5):'-';
    document.getElementById('p-sub').textContent='覆盖 '+ (DATES[0]||'') +' 至 '+ (latest||'') +' · 点日期看当天总结';
  }

  // ---- 日历 ----
  var calYM = latest? {y:+latest.slice(0,4),m:+latest.slice(5,7)} : (function(){var t=new Date();return {y:t.getFullYear(),m:t.getMonth()+1};})();
  function renderCal(){
    var y=calYM.y,m=calYM.m;
    var first=new Date(y,m-1,1), startW=first.getDay();
    var days=new Date(y,m,0).getDate();
    var today=new Date(), todayStr=today.getFullYear()+'-'+('0'+(today.getMonth()+1)).slice(-2)+'-'+('0'+today.getDate()).slice(-2);
    var h='<div class="cal-nav"><button class="cal-btn" id="cal-prev">‹</button><b>'+y+'年'+m+'月</b><button class="cal-btn" id="cal-latest">最新</button></div>';
    h+='<div class="cal-grid">';
    WK_ORDER=['一','二','三','四','五','六','日'];
    WK_ORDER.forEach(function(w){h+='<div class="cal-wk">'+w+'</div>';});
    // 周一为首列：JS getDay() 周日=0 → 需转换
    var lead=(startW===0?6:startW-1);
    for(var i=0;i<lead;i++) h+='<div class="cal-cell empty"></div>';
    for(var dd=1;dd<=days;dd++){
      var ds=y+'-'+('0'+m).slice(-2)+'-'+('0'+dd).slice(-2);
      var has=!!A[ds]; var cls='cal-cell'+(has?' has':'')+(ds===todayStr?' today':'');
      var badge='';
      if(has){badge='<div class="cal-badge"><span>'+tc(ds)+'卡</span><span class="b2">收'+fav(ds)+'</span></div>';}
      h+='<div class="'+cls+'"'+(has?' data-d="'+ds+'"':'')+'><div class="dn">'+dd+'</div>'+badge+'</div>';
    }
    h+='</div>';
    h+='<div class="cal-legend"><span><i style="background:#4f46e5"></i>主题卡数</span><span><i style="background:#16a34a"></i>私域收藏</span><span><i style="background:#fff;border:2px solid #4f46e5"></i>今天</span><span>点亮日期=当天有总结，点击查看</span></div>';
    document.getElementById('cal-box').innerHTML=h;
    document.getElementById('cal-prev').onclick=function(){calYM.m--;if(calYM.m<1){calYM.m=12;calYM.y--;}renderCal();};
    document.getElementById('cal-latest').onclick=function(){if(latest){calYM={y:+latest.slice(0,4),m:+latest.slice(5,7)};renderCal();}};
    [].slice.call(document.querySelectorAll('.cal-cell.has')).forEach(function(c){
      c.onclick=function(){location.hash='#/d/'+c.getAttribute('data-d');};
    });
  }

  // ---- 历史列表（倒序）----
  function renderHist(){
    var h='';
    DATES.slice().reverse().forEach(function(d){
      var cur=(d===latest)?' · 最新':'';
      h+='<a data-d="'+d+'"><div class="hd"><b>'+d.slice(5).replace('-','月')+'日</b><em>'+wd(d)+cur+'</em></div>'
       +'<div class="hmeta">'+tc(d)+' 张主题卡 · 私域收藏 '+fav(d)+' 条</div>'
       +'<div class="hchip"><span>'+tc(d)+'卡</span><span class="c2">收'+fav(d)+'</span></div>'
       +'<div class="harr">›</div></a>';
    });
    document.getElementById('hist-box').innerHTML=h;
    [].slice.call(document.querySelectorAll('#hist-box a')).forEach(function(a){
      a.onclick=function(){location.hash='#/d/'+a.getAttribute('data-d');};
    });
  }

  // ---- 路由 ----
  function route(){
    var hash=location.hash||'#/';
    var m=hash.match(/^#\/d\/(\d{4}-\d{2}-\d{2})$/);
    var home=document.getElementById('view-home'), det=document.getElementById('view-detail');
    if(m && A[m[1]]){
      renderDetail(A[m[1]]);
      document.getElementById('back-date').textContent=m[1]+' · '+wd(m[1]);
      home.style.display='none'; det.style.display='block';
      window.scrollTo(0,0);
    }else{
      det.style.display='none'; home.style.display='block';
      if(m && !A[m[1]]) location.hash='#/';
      window.scrollTo(0,0);
    }
  }
  window.addEventListener('hashchange',route);
  document.getElementById('back-home').onclick=function(){location.hash='#/';};

  // 详情页内部锚点（板块目录/置顶卡/底部导航/回到顶部）改为页内滚动，
  // 不写 location.hash，避免被路由当作无效 hash 而跳回日历。
  document.addEventListener('click',function(ev){
    var a=ev.target.closest&&ev.target.closest('a[href^="#"]');
    if(!a)return;
    var det=document.getElementById('view-detail');
    if(!det||det.style.display==='none')return;      // 仅在详情页拦截
    var href=a.getAttribute('href')||'';
    if(href.indexOf('#/')===0)return;                 // 真正的路由链接放行
    ev.preventDefault();
    var id=href.slice(1); if(!id){window.scrollTo(0,0);return;}
    var el=document.getElementById(id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  });

  fillHead(); renderCal(); renderHist(); route();
})();
</script></body></html>
