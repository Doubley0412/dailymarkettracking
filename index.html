.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stat {

  border-radius:14px; padding:10px 8px; text-align:center; backdrop-filter: blur(8px);

.pins {

.pins::-webkit-scrollbar { display:none; }
.pin {

.tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }

.card h3 {
  margin:0; font-size:16.5px; line-height:1.4; letter-spacing:-.01em; font-weight:750;

.bullet {

.bullet.stock { background:#f0fdf4; }
.bullet.stock p { color:#166534; font-weight:600; }

.foot {
  margin: 28px 0 12px; text-align:center; color:var(--muted); font-size:12px;
}
.foot .backtop {
  display:inline-flex; align-items:center; gap:6px; margin-top:8px;
  background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 14px;
  color:var(--ink); font-weight:600;

/* bottom dock nav */
.dock {
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  padding: 8px 10px calc(8px + var(--safe-b));

  border-top:1px solid rgba(226,232,240,.9);

.pill.active .pc { background:rgba(255,255,255,.18); }

@media (min-width: 860px) {

 个股"], "bullets": [{"label": "核心观点", "text": "英伟达Vera Rubin平台将于2026年量产，更高功耗设计推动数据中心向液冷转型。产业信息明确Rubin将完全采用不锈钢波纹管替代传统橡胶软管，技术路线切换确立波纹管赛道从0到1的爆发逻辑，投资焦点从宽泛液冷概念转向已切入头部供应链的零部件厂商。"}, {"label": "产业链进展", "text": "CDU：同飞股份与台厂联合开发独供模式卡位英伟达供应链，英维克为大陆唯一获Tier1系统级认证厂商；液冷泵：大元泵业、飞龙股份进入头部系统集成商供应链；冷板龙头银轮股份向CDU模块化升级；不锈钢波纹管：金富科技、五洋自控通过外延并购切入（柯思宇25年投产5个月营收1.05亿、净利0.44亿，净利率近45%量级讨论）。"}, {"label": "深度纪要补充", "text": "单柜功率已从传统10–20kW跃升至50–100kW，风冷逼近物理极限；预计2026–2027年主流AI数据中心全面转向液冷。快接头、冷却液、水处理等细分亦将价值量跃升。"}]}, {"title": "MLCC：太阳诱电上调全年利润指引约+50%，量价齐升验证高景气", "tags": ["🔥 热点", "📈 个股"], "bullets": [{"label": "核心观点", "text": "日本MLCC巨头太阳诱电因AI服务器等需求上修全年营业利润指引约+50%，订单出货比（BB Ratio）升至1.72，标志行业从“量增”进入量价共振。AI服务器、汽车电子带动高端MLCC需求，国内厂商在国产替代浪潮下有望加速切入高端供应链。"}, {"label": "调研纪要", "text": "国瓷材料半年报交流：H1营收25亿（+16.64%）、归母净利3.63亿（+9.36%），经营现金流4.56亿（+36.78%）；MLCC粉体、电子浆料等受益需求与材料自主可控，产能持续扩张。"}, {"label": "相关标的", "text": "三环集团、风华高科、洁美科技、国瓷材料等"}]}, {"title": "AI半导体与存储设备：海外普涨分化 + 长鑫定价权 + 中微设备外溢评估", "tags": ["🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "海外动态", "text": "AI半导体多数股票涨幅超过5%，ARM上涨约18%、Marvell约13%领涨；AMD因二季度营收与三季度指引略不及极高预期盘后承压。三星发布zHBM及V10 BV-NAND，垂直堆叠高带宽内存与AI加速器；Sandisk因NAND行业动态大涨，HBF被视为推理场景低成本补充。"}, {"label": "核心逻辑", "text": "长鑫产能被国内客户长期高价合约锁定，拒苹果LPDDR5X降价诉求，定价权向原厂倾斜，存储景气由HBM向通用DRAM/企业级SSD扩散。另传三星、海力士中国厂评估中微半导体设备，国产刻蚀设备叙事从“本土替代”外溢至“全球在华供应链竞争”。"}]}, {"title": "电子布：8月价格环比上涨超17%；金刚石散热从0–1叙事进入订单验证", "tags": ["🔥 热点", "📈 个股"], "bullets": [{"label": "关键数据", "text": "8月电子级玻璃布价格延续涨势，1080、2116、7628等主流型号均价环比上涨17%–18%，涨幅超7月；主流7628型号价格突破10元/米，创年内新高。AI服务器对高端PCB需求叠加上游织机产能持续紧张，价格传导顺畅。"}, {"label": "产业链进展", "text": "金刚石散热：多家核心供应商披露海外客户测试通过、与国内头部算力企业方案定型在即，并给出年底或明年批量订单与亿元级收入预期，产业从宏大叙事进入订单兑现阶段。"}]}], "table": [{"name": "光模块/InP链", "tags": "🔖🔥📈🌍", "logic": "传闻博弈+供应链去风险+材料重估", "data": "热度1133；中国占北美CSP高端60%–70%", "catalyst": "FCC落地节奏/份额转移"}, {"name": "AI升级链（Rubin/载板/布/铜）", "tags": "🔖🔥📈", "logic": "硬件迭代确定性+瓶颈材料弹性", "data": "Rubin服务器成本+<50%、token成本-80%+", "catalyst": "Rubin放量/载板国产化"}, {"name": "液冷波纹管", "tags": "🔥📈", "logic": "Rubin路线锁定，零部件订单 ：改革深化，批价与直营/i茅台结构改善", "tags": ["📈 个股"], "bullets": [{"label": "核心逻辑", "text": "i茅台改革叠加金字塔产品结构，飞天零售价年内上调至1639元；直营收入占比提升至约四成以上量级，2026Q1 i茅台收入高增，Q2批价稳定在1600元以上。改革有望在批价企稳后支撑更可持续的放量与结构优化。"}]}, {"title": "菜百股份：7月金条销售转正，金饰规划中长期成长", "tags": ["📈 个股"], "bullets": [{"label": "关键数据", "text": "26Q2金价回落阶段金条承压，但7月金价趋稳后销售额已转正；金饰自26Q1以来平稳增长，古法金、硬足金更快。推进“菜百典藏”高毛利线，计划新增约5家门店，电商增加金饰SKU。"}]}, {"title": "百润股份：威士忌铺市推进，预调鸡尾酒稳增长", "tags": ["🔥 热点", "📈 个股", "📋 调研"], "bullets": [{"label": "核心逻辑", "text": "威士忌借助预调鸡尾酒成熟流通渠道分区域招商渗透，上半年抓住酒类市场结构性变革机遇做体验式营销；预调鸡尾酒提供稳定现金流。多家卖方及国海富兰克林等参与调研。"}]}, {"title": "外卖即时零售 + 乳制品 + 其他消费线索", "tags": ["🔥 热点", "📈 个股"], "bullets": [{"label": "核心观点", "text": "外卖与即时零售8月订单延续上升，头部平台补贴更理性，商超/医药/生鲜等即时零售成新增长引擎。长江食饮乳制品更新关注需求复苏与成本改善下的盈利弹性。燕京啤酒U8等核心单品放量、利润增速约20%叙事；鸣鸣很忙GMV与门店扩张；纺服Q2基金配置仅约0.12%低配，比音勒芬及高股息家纺获增配。"}]}], "table": [{"name": "茅台", "tags": "📈", "logic": "改革+批价稳定+直营结构", "data": "飞天零售价1639；批价1600+", "catalyst": "批价/直营占比"}, {"name": "菜百/黄金珠宝消费", "tags": "📈", "logic": "金条转正+金饰升级", "data": "7月金条转正", "catalyst": "金价与客流"}, {"name": "百润/即时零售/乳品", "tags": "🔥📈", "logic": "结构升级与基本面修复", "data": "威士忌铺市；订单回升", "catalyst": "调研/月度数据"}]}, {"id": "cyc", "name": "周期", "emoji": "📈", "overview": "周期主线回归宏观交易：西部策略私域收藏强调金价突破4200后的金银定价主线，ADP疲软强化流动性交易；铜端全球矿企产量承压叠加智利扩建暂停；油价因美伊外交预期大跌，油运景气底层逻辑仍在；AI金属行情向钨钼稀土锡钽锆扩散。", "topics": [{"title": "黄金：金价突破4200美元，ADP疲软 + 西部策略私域共振", "tags": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心观点", "text": "美国7月ADP就业远不及预期，紧缩定价降温，国际金价突破4200美元/盎司。西部策略私域收藏（盘前5分钟）主线即黄金：此前未破4200时维持战略配置，当前美日联合调控明确美元顶部，就业与联储信号强化美元下行，突破后战略配置观点兑现，短期多头可持有等待空头平仓行情。"}, {"label": "投资逻辑", "text": "若周五非农同步疲软，流动性宽松预期明确落地，金银与美债有望共振；非农为补充信号、不改上行趋势。机构已有提前布局金银迹象。判断2026Q3很可能由宏观力量主导金银定价。黄金股PE约12–14x，低于约20x历史中枢的讨论仍在。"}, {"label": "相关标的", "text": "山金国际等金矿及金银链弹性标的"}]}, {"title": "铜板块：全球头部矿企产量承压 + 智利扩建暂停，看好重估", "tags": ["🔥 热点", "📈 个股", "📋 调研"], "bullets": [{"label": "核心逻辑", "text": "2026上半年全球头部铜矿企业产量总体同比下降，供给增长持续低于预期。智利Codelco因地震风险暂停El Teniente扩建（不影响当期产量但削弱远期指引），强化铜矿资本开支不足与供给刚性叙事。需求端经济复苏+AI数据中心+新能源多轮驱动，供需缺口扩大支撑铜价与板块重估。"}]}, {"title": "原油大跌与油运景气：外交预期降温风险溢价，供给刚性仍支撑运价", "tags": ["🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心事件", "text": "卡塔尔与美国官员积极表态抬升美伊冲突外交解决预期，市场预期霍尔木兹石油运输或改善，布伦特原油一度大跌超5%、收于三周低点，风险溢价明显回吐。"}, {"label": "投资逻辑", "text": "油运景气底层逻辑仍在：新船交付有限、老旧船拆解加速，船队增速下滑；中东至亚洲长航线运距与复苏需求支撑，VLCC等主力船型弹性最大，景气持续性或超预期。"}]}, {"title": "AI金属大反攻：钨钼稀土锡钽锆", "tags": ["🔥 热点"], "bullets": [{"label": "核心观点", "text": "国金金属等纪要热度居前，行情从贵金属/工业金属向AI相关小金属扩散。钨、钼、稀土、锡、钽、锆等兼具供需格局优化与AI/高科技需求增长，关注具备资源禀赋与深加工壁垒的弹性标的。"}]}], "table": [{"name": "黄金", "tags": "🔖🔥📈🌍", "logic": "美元顶部+流动性交易", "data": "金价破4200；ADP疲软", "catalyst": "非农/实际利率"}, {"name": "铜", "tags": "🔥📈📋", "logic": "矿端扰动+长期资本开支不足", "data": "Codelco扩建暂停", "catalyst": "库存与价格"}, {"name": "油运/原油", "tags": "🔥📈🌍", "logic": "地缘溢价回吐 vs 运力刚性", "data": "油价-5%+；运价上行通道", "catalyst": "外交/运价"}, {"name": "AI小金属", "tags": "🔥", "logic": "科技需求+供给约束扩散", "data": "纪要热度居前", "catalyst": "涨价/出口政策"}]}, {"id": "fin", "name": "金融地产", "emoji": "🏢", "overview": "金融地产信息量最高的是兴证拿地销售兑现度专题（私域收藏三、四）：溢价率升至约18%、城市与产品结构清晰分化；建材端玻璃仍承压，框架研究热度回升。", "topics": [{"title": "地产：兴证拿地专题——主要房企结构特征与溢价抬升（收藏）", "tags": ["🔖 收藏", "📈 个股"], "bullets": [{"label": "关键数据", "text": "纯住宅用地占比由2022约61.5%升至2025约74%；单块面积缩至2025–26平均仅7–8万方；平均溢价率2022–24约7%–8%→2025约10.3%→2026年1–7月约18%（核心城市/豪宅地驱动）。权益比升至80%+。拿地时点高度趋同，尚未显现明显逆周期能力。"}, {"label": "核心逻辑", "text": "城市策略分化：滨江高度聚焦杭州；越秀约6–7城；建发/金茂约10城；保利广布局；华润/中海/招蛇约15城集中一二线。华润/中海外商住及纯商占比更高，滨江/绿城纯住宅占比更高。下期专题预告2021年拿地项目去化、售价与存量包袱测算，对评估真实盈利质量信息量高。"}]}, {"title": "地产：非核心城市机会与深耕门槛（兴证专题三·收藏）", "tags": ["🔖 收藏", "📈 个股"], "bullets": [{"label": "核心观点", "text": "北上深杭成核心五城去化与规模占优，但利润中枢不高（除上海外多低于7–8个百分点）；2025年五城合计住宅销售约1.3万亿，13家重点央国企+1民企平均市占约50%，仅靠五城难撑规模。非核心城市筛选以拿地去化≥50%–60%为先，机会集中在有深耕基础的房企，新进入者难度大。"}, {"label": "关键数据", "text": "符合标准的二线包括苏合宁甬汉长青津福等；非核心二线销售额较高峰普遍下滑约60%。13家重点房企核心五城市占率由约20%（2015–16）升至约47%（2025），非核心二线仅约30%。短期确定性优先核心城，中长期修复后非核心贡献弹性。"}]}, {"title": "建筑建材：玻璃仍承压；AI相关材料与服务近况", "tags": ["🔥 热点", "📈 个股"], "bullets": [{"label": "核心数据", "text": "信义玻璃26H1营收约95亿（-3.1%），浮法承压、汽车玻璃+3.9%；国内浮法库存高，下半年价格仍承压；沙特基地预计27年底投产。长江建材框架进入纪要热度榜。"}, {"label": "核心逻辑", "text": "AI对建材的映射主要体现在电子布/玻纤等高端材料与智能化施工/BIM等服务；具备向AI相关材料转型能力的传统建材公司更易获估值溢价。"}]}], "table": [{"name": "房企拿地", "tags": "🔖📈", "logic": "结构分化、溢价抬升", "data": "1–7月溢价约18%；纯住宅约74%", "catalyst": "去化专题/政策"}, {"name": "玻璃/消费建材", "tags": "🔥📈", "logic": "浮法承压 vs 框架关注度", "data": "信义H1营收-3.1%", "catalyst": "库存/价格"}]}, {"id": "stb", "name": "稳定类", "emoji": "🚌", "overview": "稳定类按内容纳入国内电网基本面（长江电新私域收藏，主线是十五五投资与特高压而非泛电新制造）、AI×电力公用事业机会，以及交运/干散货/快递/海外油轮干散船东等高分红或底部修复线索。", "topics": [{"title": "电网：十五五投资约5万亿，特高压招标高景气（私域收藏）", "tags": ["🔖 收藏", "🔥 热点", "📈 个股"], "bullets": [{"label": "核心观点", "text": "长江电新深度专题正文主线是国内电网投资与特高压招标，属性更接近公用事业/电网设备而非泛电新制造主题。十五五电网投资规划总规模约5万亿（国网约4万亿/南网约1万亿），年化约6%–7%，为投资底线且具备逆周期与超预期可能。2026年1–5月电网投资同比约+13%，确定性高。"}, {"label": "关键数据", "text": "2026年特高压计划招标6批次，上半年已完成3批，含1条±800kV直流、4–5条交流、5条背靠背，设备招标金额接近300亿，已超2024/2025全年水平；下半年预计至少还有2条直流，全年有望接近或超过2023年峰值。高压输变电上半年招标金额约达2025全年的54%–55%。配电招标+10%+，电表新一代招标价格修复，下半年报表拐点可期。"}, {"label": "相关标的", "text": "特高压/主网设备、配电与电表链条优质供应商"}]}, {"title": "AI×电力：中美殊途下的公用事业与数据中心用电", "tags": ["🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心观点", "text": "IEA：2025年全球数据中心用电近5000亿度（+17%），2030年有望翻倍；中美占全球约70%并升至约74%。美国缺电驱动气电/核电与AIDC协同，燃机订单排至2029–2030；中国则是绿电消纳与算力降本共振，公用事业与电力设备在“AI用电”主线下获得中长期资本开支能见度。"}]}, {"title": "交运与海外船东：海通发展/京东物流/嘉友 + OET/GNK", "tags": ["📈 个股", "🌍 海外"], "bullets": [{"label": "相关标的", "text": "海通发展：A股稀缺干散货，自有船近70艘目标百艘，运价每+1000美金年利润约+1.3–1.4亿。京东物流：外部收入约70%，26年指引收入+20%–25%、利润+25%–30%，净利展望90–100亿。嘉友国际：非洲陆港高毛利，26–28净利约15/15.6/17.2亿展望。"}, {"label": "海外动态", "text": "Okeanis Eco Tankers Q2净利约2.3亿美金，全船队综合TCE约18.12万美金/天。Genco调整后EPS 0.65美金，同比由亏转盈。快递行业研究框架显示竞争从价格战转向价值战，单票收入企稳。"}]}, {"title": "环卫装备电动化：销量与渗透率双升", "tags": ["📈 个股"], "bullets": [{"label": "关键数据", "text": "2026年上半年环卫装备销量同比约+12.3%，电动化渗透率提升至约29.4%。政策驱动各地新能源环卫车采购增长，龙头份额提升。"}]}], "table": [{"name": "电网/特高压", "tags": "🔖🔥📈", "logic": "十五五确定增长+招标高景气", "data": "五年约5万亿；上半年特高压招标~300亿", "catalyst": "直流批次/电表招标"}, {"name": "AI电力/公用", "tags": "🔥📈🌍", "logic": "数据中心用电翻倍叙事", "data": "IEA 2030翻倍", "catalyst": "气电核电/绿电"}, {"name": "交运物流/船东", "tags": "📈🌍", "logic": "运价弹性+盈利修复", "data": "TCE高位；物流指引上修", "catalyst": "运价/业绩"}]}, {"id": "macro", "name": "总量", "emoji": "🌍", "overview": "总量保留不落单一产业主线的宏观与市场议题：隔夜美股分化与SpaceX高Capex争议、美伊与财政约束框架、美日联合支撑日元、美国就业与JOLTS降温、韩股去杠杆底部讨论及国内资金面微观。", "topics": [{"title": "隔夜美股分化：道指创新高 vs 纳指承压；SpaceX高Capex与解禁压力", "tags": ["🔥 热点", "🌍 海外"], "bullets": [{"label": "海外动态", "text": "道指受风险偏好与中东缓和情绪推动表现强劲、创历史新高区间，纳指因部分科技巨头财报未满足极高AI预期承压；黄金录得阶段性强势。美伊霍尔木兹航运传出阶段性过渡安排讨论，多位美联储官员鹰派表态与就业走弱并存。"}, {"label": "核心事件", "text": "SpaceX相关财务披露显示营收与AI收入高增、EBITDA转正，但AI基建Capex超预期引发争议，并面临大规模限售解禁压力；星链用户与算力扩建目标仍被关注。美财长推动支撑日元，强化日银可能进一步政策协同预期。"}]}, {"title": "战争与财政约束、美日汇市干预与美国劳动力市场降温", "tags": ["🔥 热点", "🌍 海外"], "bullets": [{"label": "核心观点", "text": "美伊冲突进入财政约束讨论阶段，“弗格森极限”提醒高烈度冲突可持续性受财政空间限制，对地缘演化与资产定价有框架意义。美日罕见联合干预支撑日元，意在避免日本为稳汇率抛售美债冲击美债市场。"}, {"label": "关键数据", "text": "美国6月JOLTS职位空缺降至736万，招聘略回升、裁员率低位，劳动力市场趋于平衡，有助于缓解工资型通胀压力，降低进一步紧缩紧迫性。"}]}, {"title": "韩国股市去杠杆底部讨论 + 国内资金面中性", "tags": ["🔥 热点"], "bullets": [{"label": "核心观点", "text": "国泰海通策略“韩国股市去杠杆后的底部阶段”纪要热度居前（热度约1051），估值处历史低位，对全球科技周期有领先指示意义。国金固收：7月DR007中枢约1.42%，8月资金面中性，政府债净融资或升至约1.51万亿；30城地产销售与钢价等仍反映需求偏弱的微观现实。"}]}], "table": [{"name": "隔夜风险偏好/SpaceX", "tags": "🔥🌍", "logic": "缓和 vs AI高预期兑现", "data": "道强纳弱；高Capex争议", "catalyst": "财报/解禁/地缘"}, {"name": "美元/日元/就业", "tags": "🔥🌍", "logic": "干预+劳动力市场降温", "data": "JOLTS 736万", "catalyst": "非农/日银"}]}, {"id": "other", "name": "其他", "emoji": "📌", "overview": "未独立成章的交叉主题与个股调研补遗，供快速扫描。", "topics": [{"title": "交叉主题补遗：商业航天遥感 / 安克 / TCL电子 / 西普尼", "tags": ["📈 个股"], "bullets": [{"label": "调研纪要", "text": "Satellogic Q2收入创纪录约1590万美元，调整后EBITDA转正约280万美元。安克小充规模约120亿，未来三年增长中枢10%–15%讨论。TCL电子Mini LED渗透与份额提升，净利率仍有约1pct空间。西普尼贵金属腕表，中报净利高增，与华为合作智能金表等。"}]}, {"title": "硬件ODM/芯片调研：龙旗科技 / 翱捷科技等", "tags": ["📈 个股", "📋 调研"], "bullets": [{"label": "调研纪要", "text": "龙旗科技AIPC已完成英特尔/AMD/高通多平台量产交付，获头部客户量产订单；易方达、泉果、中欧、交银、重阳、高瓴等密集参会。翱捷科技H1营收约24.5亿（+29%），蜂窝基带约20.22亿（+23%）。"}]}], "table": []}]}, "2026-08-07": {"meta": {"date": "2026-08-07", "weekday": "周五", "run_at": "2026-08-07T07:15:00+08:00", "is_trading_day": true, "window_private": {"start": "2026-08-06T00:00:00+08:00", "end": "2026-08-07T07:15:00+08:00"}, "window_public": {"start": "2026-08-06T00:00:00+08:00", "end": "2026-08-07T07:15:00+08:00"}, "private_counts": {"favorite": 71, "appointment": 0}, "topic_count": 41, "notes": ["蓝宝书国内 2026-08-07 SEQ=1（晨报）", "国际蓝宝书 2026-08-06", "私域收藏按extra_1去重后71｜预约0", "分类按正文不按券商组别", "无说明板块", "相关标的为具体公司名"]}, "industries": [{"id": "ai", "name": "AI链", "emoji": "🤖", "overview": "AI硬件主线继续围绕光模块/磷化铟、Rubin-Feynman光学互联与PCB、BBU备电标配、超节点国产集群展开；液冷/电容上游与海外算力链严格计价并行。", "topics": [{"title": "光模块/磷化铟：供需缺口扩大 + 美国供应链去风险", "tags": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心事件", "text": "在过去24小时内，市场对磷化铟的认知已从单纯的供需失衡升级为叠加了地缘政治风险溢价的战略资源重估，核心边际变化在于，产业反馈3寸片价格已从1400元暴涨至4800元，且供需缺口预计到2027年将扩大至-55%以上。投资视角下，美国拟议的对华光模块禁令，反而凸显了中国在上游磷化铟材料端的反制能力，这使得拥有真实、可扩张产能的国内衬底公司，其价值正从周期性逻辑转变为具备国家战略意义的稀缺资产逻辑，享受确定性高增长和估值重塑的双重催化。 关注：云南锗业（产能确定性高的龙头，稳健配置）/光智科技（扩产节奏快、成本优势明显，兼具弹性和确定性）/海川智能（设备自研锁定成本优势，市值小弹性最大）/兴业科技（新进入者，产能规划体量大，预期差最大）/兴发集团/兴福电子（上游核心原材料高纯红磷的国产替代关键）/有研新材（布局磷化铟及化合物半导体材料的国产替代重要方向）"}, {"label": "调研纪要", "text": "会议要点 1. 铜连接技术定位与适用场景 铜连接技术介于PCB和光通信之间，是AI数据中心连接的重要技术路径。"}, {"label": "海外催化", "text": "有报道称美国政府正起草一项禁令，旨在禁止进口中国制造的光模块等数据中心组件，以保护其AI基础设施安全。由于中国供应商在全球光模块市场占据主导地位，分析警告此举可能严重冲击亚马逊、微软等超大规模云服务商，并对博通、Marvell等依赖中国组件的美国半导体公司产生负面连锁反应，推高美国AI基建成本。 美股关注：Amazon(AMZN), Microsoft(MSFT) (作为超大规模云服务商，基建成本可能上升)、Broadcom(AVGO), Marvell(MRVL) (其供应链可能受到干扰)。"}, {"label": "相关标的", "text": "中际旭创、新易盛、天孚通信、源杰科技、仕佳光子、光智科技、云南锗业、有研新材、兴发集团、东山精密"}], "stocks": ["中际旭创", "新易盛", "天孚通信", "源杰科技", "仕佳光子", "光智科技", "云南锗业", "有研新材", "兴发集团", "东山精密"], "heat": 92, "sources": ["cn:磷化铟", "us:光模块"]}, {"title": "Rubin/Feynman升级：光学互联加码 + PCB超级周期", "tags": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心事件", "text": "过去24小时内，市场焦点转向英伟达下一代Rubin Ultra架构的重大调整：为弥补HBM内存从288GB降至192GB，系统升级重心全面转向NVL576级别的光学规模化互联。这一变化标志着GPU的BOM成本结构正从“堆存储”转向“堆光互联”，市场正重估光通信在AI基础设施中的价值，特别是NPO方案下，单GPU光引擎用量在新版NVL576集群中近乎翻倍，打开了光器件及光纤环节全新的增长空间。 关注：中际旭创/新易盛/天孚通信（NPO/CPO光引擎及光器件核心供应商，直接受益于价值量重估），Lumentum/Coherent（海外光通信龙头，深度绑定北美客户需求与技术迭代），联讯仪器（NPO/CPO放量带动高端光通信测试设备需求翻倍），康宁/长飞光纤（英伟达锁定产能，AI数据中心驱动光纤光缆需求高增），安费诺（AI服务器高速连接器价值量提升）"}, {"label": "产业链进展", "text": "昨夜，关于AI服务器产业链的增长预期被再次刷新，其核心上游PCB及CCL环节的2028年市场规模预测被大幅上调至840亿和480亿美元，意味着未来两年复合增速将高达140%以上。这一边际变化的核心逻辑在于，市场增长的驱动力已不再是单一的服务器出货量，而是转向了由PCB层数、高阶HDI渗透、CCL材料升级等多重因素叠加带来的单机价值量暴增，这从根本上重塑了相关硬件环节的估值天花板。 关注：沪电股份/深南电路（直接受益于AI服务器PCB层数与价值量提升），生益科技（上游核心高频高速覆铜板材料供应商），风华高科/裕同科技（AI服务器产业链中MLCC、液冷等高增长环节的景气度扩散）"}, {"label": "核心观点", "text": "会议要点 1. 铜连接技术定位与适用场景 铜连接技术介于PCB和光通信之间，是AI数据中心连接的重要技术路径。"}, {"label": "调研纪要", "text": "会议要点 1. PCB产业链整体行情逻辑 8月行业多个指标超预期：普通电子布提价斜率进一步超预期，Low Dk 2代量价上修，普通PCB涨价加速，高端产品M7预期放量，当下反弹行情优先重视AI带来的量增逻辑，同时紧缺背景下的价增逻辑也在持续强化，可继续参与相关交易。"}, {"label": "相关标的", "text": "沪电股份、胜宏科技、鹏鼎控股、生益科技、南亚新材、建滔积层板、科翔股份、天孚通信、中际旭创、长飞光纤、亨通光电"}], "stocks": ["沪电股份", "胜宏科技", "鹏鼎控股", "生益科技", "南亚新材", "建滔积层板", "科翔股份", "天孚通信", "中际旭创", "长飞光纤", "亨通光电"], "heat": 90, "sources": ["cn:Feynman", "cn:PCB", "private:PCB"]}, {"title": "BBU：AI机柜功耗跃迁下的备电标配", "tags": ["🔖 收藏", "🔥 热点", "📈 个股"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股"], "bullets": [{"label": "核心事件", "text": "昨日（8月6日）的行业交流明确了AI服务器备电方案的演进路径，随着机柜功耗向600kW以上跃迁，BBU将从当前GB300时代的高端选配，正式成为下一代Rubin架构的标配，解决了市场对其渗透率的争议。这一变化意味着BBU需求将在2027年迎来确定性的放量拐点，投资逻辑已从判断“是否需要”转向挖掘“谁能供应”，核心是寻找能突破1-2年海外认证周期、具备全极耳电芯技术和海外交付能力的国内电池厂商，以切入这个高毛利且客户价格敏感度低的蓝海市场。 关注：蔚蓝锂芯（国内BBU电芯验证进度领先，有望率先突破）/亿纬锂能/鹏辉能源（具备全极耳圆柱电池产线，积极布局BBU市场）/麦格米特（推出BBU Shelf等电源系统级产品）/顺络电子（AI服务器电源用磁性元器件核心供应商）"}, {"label": "核心观点", "text": "会议要点 1. BBU行业需求逻辑与规模测算 需求驱动核心：AI算力爆发下机柜功耗指数级提升，供电系统瓶颈凸显，机柜级配电从选配转为刚需。"}, {"label": "关键数据", "text": "英伟达GPU单卡功耗2020年A100到2027年Rubin产品将突破1500瓦，6年翻4倍；"}, {"label": "相关标的", "text": "豪鹏科技、亿纬锂能、珠海冠宇、欣旺达、德赛电池"}], "stocks": ["豪鹏科技", "亿纬锂能", "珠海冠宇", "欣旺达", "德赛电池"], "heat": 82, "sources": ["cn:BBU", "private:BBU"]}, {"title": "互联网厂商超节点路线图：国产集群算力上量", "tags": ["🔖 收藏", "🔥 热点", "📈 个股"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股"], "bullets": [{"label": "核心观点", "text": "会议要点 1. 超节点行业发展背景与核心逻辑 行业发展阶段：国内超节点2025年出现，2025年处于样机研发阶段，2026年进入规模化落地阶段，当前主流产品包括英伟达400节点、华为384节点、阿里磐久128节点。"}, {"label": "关键数据", "text": "核心发展逻辑：国产单卡算力与海外先进产品存在代差，对标英伟达H700、B200存在明显劣势，因此通过超节点将更多算力资源聚合在单个机柜，以集群形式提升有效算力，突破芯片制程限制，通过扩大显存、带宽弥补单卡性能不足，本质上为高密度集成的超级计算机。"}, {"label": "产业链进展", "text": "技术领先情况：目前阿里、华为在超节点架构上领先行业约6个月，已完成一定规模上量，软硬件协同优化完成度较高，且已在客户场景实际运行；"}, {"label": "相关标的", "text": "工业富联、中兴通讯、紫光股份、浪潮信息、华勤技术、中科曙光"}], "stocks": ["工业富联", "中兴通讯", "紫光股份", "浪潮信息", "华勤技术", "中科曙光"], "heat": 80, "sources": ["private:超节点"]}, {"title": "裕同科技：包装主业安全垫 + 液冷科技期权", "tags": ["🔖 收藏", "🔥 热点", "📈 个股"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股"], "bullets": [{"label": "核心观点", "text": "会议要点 1. 公司核心投资逻辑与估值情况 公司以纸包装主业为基础，现金流和分红表现优异，提供较高安全垫，当前在「1+N+T」战略推动下向科技方向转型，业务即将进入兑现期，业绩有望超预期。"}, {"label": "关键数据", "text": "公司前期受科技情绪带动，股价从高点回落接近30%，当前市值处于350-361亿元区间，主业安全垫和科技业务期权价值凸显，是合适的布局时点。"}, {"label": "投资逻辑", "text": "业绩预测： 收入端：2027年进入提速阶段，从2026年的双位数增长提速至20%-30%的增长水平。"}, {"label": "相关标的", "text": "裕同科技、英维克、申菱环境、同飞股份"}], "stocks": ["裕同科技", "英维克", "申菱环境", "同飞股份"], "heat": 75, "sources": ["private:裕同"]}, {"title": "海星股份：AI电容上游，格局与壁垒占优", "tags": ["🔖 收藏", "🔥 热点", "📈 个股"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股"], "bullets": [{"label": "核心观点", "text": "会议要点 1. 核心投资逻辑 公司投资价值来自主营业务涨价+AI电极箔持续放量的双重逻辑叠加，同时具备客户全球覆盖的稀缺性，业绩放量确定性较高。"}, {"label": "投资逻辑", "text": "2. AI电极箔业务进展与盈利情况 下游需求驱动因素：随着AI机柜、服务器机柜功率提升，AI用铝电容供需矛盾凸显、壁垒提升，下一代Rubin相关产品相较于当前英伟达第300主导体系，机柜功率预计从提升大几十到后续提升四五倍，将同步带动AI用牛角电容需求增长。"}, {"label": "相关标的", "text": "海星股份、三环集团、风华高科、洁美科技"}], "stocks": ["海星股份", "三环集团", "风华高科", "洁美科技"], "heat": 72, "sources": ["private:海星"]}, {"title": "海外算力链：AMD指引严格计价 + 存储指引后分化", "tags": ["🔥 热点", "📈 个股", "🌍 海外"], "tag_labels": ["🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心事件", "text": "尽管AMD(AMD)公布了强劲的第二季度业绩并上调了指引，但其股价在盘后依然大跌。市场认为，在AI支出的热潮下，公司的营收指引未能充分证明其能将这轮投资更快地转化为增长，未能满足投资者极高的期望。此外，公司承认服务器CPU供应紧张，但预计2027年情况将改善。"}, {"label": "海外催化", "text": "尽管Sandisk(SNDK)和Western Digital(WDC)均发布了受益于AI数据中心需求的乐观季度营收指引，但两家公司股价均在盘后下跌。市场的高预期以及对利润率和行业估值的担忧，使得即使是强劲的指引也未能提振股价。"}, {"label": "相关标的", "text": "AMD、Sandisk、Western Digital、中微公司、北方华创"}], "stocks": ["AMD", "Sandisk", "Western Digital", "中微公司", "北方华创"], "heat": 70, "sources": ["us:AMD"]}, {"title": "先进封装与半导体材料：玻璃基板提速 + 电子气体出海", "tags": ["🔥 热点", "📈 个股"], "tag_labels": ["🔥 热点", "📈 个股"], "bullets": [{"label": "核心事件", "text": "8月6日广钢气体与韩国AirFirst签订的高价值制氮设备供货协议，标志着公司成功切入要求严苛的海外半导体设备市场，这是对其技术实力进入全球第一梯队的关键验证。此举将公司投资逻辑从单一的国内大宗气体运营，根本性地转变为“气体运营+设备出海”的双轮驱动增长模型，显著拓宽了其成长空间与估值天花板。 关注：广钢气体（核心受益于设备出海逻辑，开启“运营+设备”双轮驱动），福斯达（同为气体设备出海，形成板块效应），华特气体/金宏气体/中船特气/昊华科技（受益于电子特气国产替代加速及AI算力需求高景气）"}, {"label": "产业链进展", "text": "8月6日，玻璃基板产业化进程显著提速，标志性事件是台湾关键设备商将试产节点提前至27年下半年，同时国内市场关注点正从概念论证转向工程化落地。这一转变意味着投资逻辑正从普涨的题材炒作，向挖掘具备客户验证和中试线落地等实质性进展的个股分化，产业链的加速验证也使得设备端订单的能见度大幅提升。 关注：凯盛科技/旗滨集团/京东方A（上游原片环节，技术壁垒高且国产化空间明确），蓝思科技/长信科技（中游TGV加工环节，与下游巨头深度绑定，验证进度领先），帝尔激光/大族激光/芯碁微装（设备环节，受益于资本开支先行和国产替代优势）"}, {"label": "核心逻辑", "text": "8月6日晚间，随着美股ARM领涨，市场焦点转向ARM CPU在AI推理中的新价值，国内集智股份通过与Fedimoss合作，正式切入GPU+ARM CPU异构推理方案，为Agentic AI时代的长文本和复杂推理场景提供了新的降本增效路径。这一变化标志着AI算力投资正从单一的GPU崇拜，转向对CPU在推理端TCO优化中核心作用的再定价，高核心密度的ARM CPU通过分担部分推理任务，为整个AI基础设施开辟了新的增量空间和投资主线。 关注：集智股份（子公司之江易算与Fedimoss合作，推出GPU+ARM CPU混合架构推理底座EasyInfer，直接卡位异构推理新路径），海光信息（开放CPU互联总线协议HSL，旨在打造类比英伟达Grace+GPU的异构计算底座，有望成为国产CPU"}, {"label": "相关标的", "text": "广钢气体、沃格光电、赛腾股份、集智股份"}], "stocks": ["广钢气体", "沃格光电", "赛腾股份", "集智股份"], "heat": 65, "sources": ["cn:玻璃基板"]}], "table": [{"name": "光模块/磷化铟：供需缺口扩大 + 美国供应链去风险", "tags": "🔖 收藏🔥 热点📈 个股🌍 海外", "logic": "在过去24小时内，市场对磷化铟的认知已从单纯的供需失衡升级为叠加了地缘政治风险溢价的战略资源重估，核心边际变化在于，产业反馈3寸片价格已从1400元暴涨至4800元，且供需缺口预计", "data": "有报道称美国政府正起草一项禁令，旨在禁止进口中国制造的光模块等数据中心组件，以保护其AI基础设施安全。由于中国供应商在全球光模块市场占据主导", "stocks": "中际旭创、新易盛、天孚通信、源杰科技、仕佳光子、光智科技、云南锗业、有研新材、兴发集团、东山精密"}, {"name": "Rubin/Feynman升级：光学互联加码 + PCB", "tags": "🔖 收藏🔥 热点📈 个股🌍 海外", "logic": "过去24小时内，市场焦点 藏", "🔥 热点", "📈 个股", "🌍 海外"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心事件", "text": "西门子能源于过去24小时内发布的2026财年三季报显示，其燃气服务板块在美洲数据中心和中东/亚洲传统电力需求的双重驱动下，单季新签订单达创纪录的100亿欧元（+61%），但交付/新签功率比仅为40%（6GW/15GW），供需缺口显著拉大。这一数据验证了全球燃气轮机供需失衡正在加剧的判断，在手订单覆盖年限已超5年，OEM产能瓶颈和强劲的定价权，使得产业链利润向上游核心零部件环节外溢的逻辑得到进一步强化。 关注：应流股份/万泽股份（作为全球燃机巨头认证的核心热端部件供应商，直接受益于OEM产能瓶颈与供应链外溢），中国动力/杰瑞股份/上海电气（整机及成撬商受益于行业高景气及国产化出海机遇），联德股份（零部件供应商受益于需求传导）"}, {"label": "核心观点", "text": "会议要点 1. 美国现有电力结构 美国发电以天然气为主，占比约40%；"}, {"label": "关键数据", "text": "电力结构变化趋势：煤电、核电占比持续下降，退出的缺口由天然气发电补充，因此燃气轮机既需要满足AIDC的新增用电需求，也需要承担煤电、核电退役的存量更新需求。"}, {"label": "相关标的", "text": "杰瑞股份、上海电气、东方电气、应流股份、万泽股份、中国动力、潍柴动力"}], "stocks": ["杰瑞股份", "上海电气", "东方电气", "应流股份", "万泽股份", "中国动力", "潍柴动力"], "heat": 90, "sources": ["cn:燃机", "private:北美缺电"]}, {"title": "光伏反内卷：硅料龙头承诺售价不低于完全成本", "tags": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心事件", "text": "8月6日于上海，占国内超九成有效产能的八家多晶硅龙头企业正式签署《反内卷倡议书》，承诺售价不低于完全成本并互相监督，这是继7月底市监总局价格合规指导会后，行业从行政指导走向企业实质性联合行动的关键边际变化。此举被视为以行业共识和监管意志确立了产业链最上游的硬性价格底板（约4万元/吨的全成本线），彻底扭转了此前基于现金成本的无序竞争逻辑，市场预期光伏全产业链的利润修复周期将由此开启。 关注：通威股份/协鑫科技/大全能源（硅料龙头，直接受益于价格修复和利润回升），隆基绿能/晶科能源/天合光能（一体化龙头，成本优势和产业链价格传导中受益），福莱特/信义光能（辅材龙头，行业景气度回升带动自身环节供需改善和盈利修复），爱旭股份（新技术龙头，差异化优势在行业回暖中更为凸显）"}, {"label": "海外催化", "text": "特朗普政府计划对从中国等国进口的多晶硅及相关太阳能产品（晶圆、电池、组件）加征至少15%的关税，并设定最低进口价格。此举旨在保护和提振美国本土制造业，但引发了行业组织对下游成本冲击和供应链可行性的担忧，部分美国太阳能公司股价已作出负面反应。 美股关注：First Solar(FSLR) (作为美国本土主要制造商，可能受益于贸易保护)、Sunrun(RUN), SunPower(SPWR) (作为下游安装商，可能面临组件成本上升的压力)。"}, {"label": "调研纪要", "text": "会议要点 1. 美国现有电力结构 美国发电以天然气为主，占比约40%；"}, {"label": "相关标的", "text": "通威股份、大全能源、协鑫科技、晶科能源、隆基绿能、TCL中环、天合光能、特变电工"}], "stocks": ["通威股份", "大全能源", "协鑫科技", "晶科能源", "隆基绿能", "TCL中环", "天合光能", "特变电工"], "heat": 86, "sources": ["cn:多晶硅"]}, {"title": "商业航天与设备授权：星座建设 + FCC供应链穿透", "tags": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心事件", "text": "当地时间8月6日，美国FCC发布了旨在强化设备授权安全的进一步拟议规则，标志着监管重心从此前针对特定成品（如机器人、逆变器）的市场准入封锁，转向了对所有电子设备的全生命周期及供应链的深度穿透。核心边际变化在于，新规拟强制要求所有认证设备提交硬件与软件物料清单（HBOM/SBOM）并设立美国责任方，这意味着监管进入了“成分级”审查，将系统性抬高所有对美出口电子产品的合规成本与供应链管理复杂度。 关注：中际旭创/新易盛/天孚通信（光模块产业链面临供应链透明度审查，海外产能布局和非敏感元器件供应商的价值凸显），石头科技/九号公司/宇树科技（机器人与智能硬件新品入美门槛因强制认证和供应链追溯而大幅提高，利好已获批型号的在售龙头和具备赴美设厂能力的企业），Coherent/涛涛车业（拥有美国本土产能或安全供应链的海外公司将获得"}, {"label": "调研纪要", "text": "会议要点 1. 知仪星座基本概况与核心优势 星座定位：全球首个以风场测量为核心的气象卫星星座，命名取“知天地气象之变，仪乾坤时序之常”之意，目标是成为全球风场数据工厂，弥补全球精准风场数据测量缺失的行业空白。"}, {"label": "相关标的", "text": "震有科技、上海瀚讯、中国卫星、航天电子"}], "stocks": ["震有科技", "上海瀚讯", "中国卫星", "航天电子"], "heat": 68, "sources": ["private:震有", "cn:FCC"]}, {"title": "整车与新能源重卡：尊界/小鹏/赛力斯与重卡电动化", "tags": ["🔖 收藏", "🔥 热点", "📈 个股"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股"], "bullets": [{"label": "核心观点", "text": "会议要点 1. 整车行业整体判断 2026年以来整车板块贝塔相对较弱，目前已经处于偏底部阶段，小鹏、赛力斯均处于偏底部区间。"}, {"label": "关键数据", "text": "会议要点 1. 整车行业整体判断 2026年以来整车板块贝塔相对较弱，目前已经处于偏底部阶段，小鹏、赛力斯均处于偏底部区间。"}, {"label": "调研纪要", "text": "会议要点 1. 公司整体业务框架与成长逻辑 公司核心业务分为商用车、乘用车两大基本盘，同时在华为赋能下打造尊界品牌产品矩阵，开启第二成长曲线，当前主业经过老旧车型出清已进入根基夯实阶段。"}, {"label": "相关标的", "text": "江淮汽车、小鹏汽车、赛力斯、理想汽车、中国重汽、潍柴动力"}], "stocks": ["江淮汽车", "小鹏汽车", "赛力斯", "理想汽车", "中国重汽", "潍柴动力"], "heat": 84, "sources": ["private:整车"]}, {"title": "锂电与储能：下半年排产旺季 + 户储/大储结构机会", "tags": ["🔖 收藏", "🔥 热点", "📈 个股"], "tag_labels": ["🔖 收藏", "🔥 热点", "📈 个股"], "bullets": [{"label": "核心观点", "text": "会议要点 1. 锂电行业短期排产与旺季预期 2026年下半年排产情况： 8月电池排产环比增长超过7%，高于7月初预计的3%-5%区间；"}, {"label": "关键数据", "text": "会议要点 1. 锂电行业研究核心逻辑与底层框架 锂电行业属于偏成长型行业，研究锚点以需求为核心，供给为辅助。"}, {"label": "投资逻辑", "text": "会议要点 1. 公司当前经营与订单情况 各板块业务表现：锂电板块订单自2026年7月起持续向好、不断增长，空调板块、食品包装板块需求稳定；"}, {"label": "相关标的", "text": "宁德时代、亿纬锂能、阳光电源、德业股份、天合光能、安克创新"}], "stocks": ["宁德时代", "亿纬锂能", "阳光电源", "德业股份", "天合光能", "安克创新"], "heat": 76, "sources": ["private:锂电储能"]}, {"title": "Zoox拉斯维加斯付费Robotaxi启动：自动驾驶商业化", "tags": ["🔥 热点", "📈 个股", "🌍 海外"], "tag_labels": ["🔥 热点", "📈 个股", "🌍 海外"], "bullets": [{"label": "核心事件", "text": "亚马逊旗下的自动驾驶公司Zoox宣布，将从8月10日起在拉斯维加斯正式商业化运营其无方向盘、无踏板的自动驾驶出租车服务并向乘客收费 巨头财报后表现不佳而承压下跌。市场焦点集中在SpaceX和AMD等公司的财报", "data": "—", "stocks": "—"}]}]}, "2026-08-10": {"meta": {"date": "2026-08-10", "weekday": "周一", "run_at": "2026-08-10T06:40:00+08:00", "is_trading_day": true, "window_private": {"start": "2026-08-07T00:00:00+08:00", "end": "2026-08-10T06:40:00+08:00"}, "window_public": {"start": "2026-08-07T00:00:00+08:00", "end": "2026-08-10T06:40:00+08:00"}, "private_counts": {"favorite": 95, "appointment": 0}, "topic_count": 42, "notes": ["私域窗口周一回溯至上周五", "蓝宝书国内08-09批次1", "国际蓝宝书08-09", "纪要热度榜08-10", "私域入种子未逐条铺卡", "分类按正文", "无说明板块", "标题已改写为投资主题句", "相关标的补全"]}, "industries": [{"name": "AI链", "emoji": "AI", "overview": "Rubin平台Q3量产拉动PCB/CCL价值量三倍跃升，英伟达30亿投资Lancium凸显AI电力瓶颈；铌酸锂/DrMOS/玻璃基板/兴森昇腾载板等国产供给验证密集。", "topics": [{"title": "Rubin电源升级+德州并网延后：AI电力双主线再定价", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. AI相关投资方向 AI主线核心方向：当前AI最确定的投资主线为Rubin架构升级，相关电源升级（从800伏到板级电源升级）、配套储能是核心受益领域。 美国AI电力政策与并网进展： 政策端：纽约州已出台暂停新数据中心审批政策，威斯康星撤回输电线路补充方案要求额外半年合规审查，堪萨斯、新墨西哥、阿拉巴马等州民主党候选人将暂停数据中心审批作为竞选主张；德州作为数据中心建设重点区域，州长要求电力监管部门ERCOT对现有数据中心项目队列开展全面审计，涉及土地所有权进度、财务准备、用水、社区影响等内容。"}, {"label": "投资逻辑", "text": "并网进度：原计划2026年8月7日左右发布的德州“zero batch”批量评审计划（针对大于75兆瓦的大负荷项目，材料齐全且有用户侧定金的情况下，承诺2026年8月给出准入审核结果，2027年8-9月即可拿到输电规划方案，较原流程缩短至少2年）受州长干预影响进度延后。 电网改革：原要求60天内出台的大型负荷并网政策，六大区域输电组织全部申请延期至90天（2026年9月），当前利益相关方矛盾突出，行业对9月能否达成方案的预期逐步调低，政策不确定性将在2026年下半年影响AI电力板块。"}, {"label": "私域纪要", "text": "1. AI板块整体投资逻辑 行情演绎节奏：上上周AI板块见底，当前方向分为两条主线，一是重回训练主线，下半年重点看好英伟达Rubin产业链，明年上半年看好载板方向；二是缺电主线，重点布局SOFC方向，目前行情演绎符合此前判断。 AI行业投资底层判断逻辑：技术升级若能持续带来单token成本下降，行业投资机会就未结束。当前Rubin服务器较GB300成本上升幅度较大，但折算单token成本现阶段已下降50%，待Rubin性能调校至最佳后，单token成本较GB300最高可下降80%，目前技术升级未遇瓶颈，投资机会仍存。"}, {"label": "相关标的", "text": "英伟达、科华数据、欧陆通、金盘科技"}], "source": "private", "stocks": "英伟达、科华数据、欧陆通、金盘科技"}, {"title": "HBM产能不可逆消耗：半导体设备与存储景气延展", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 半导体设备行业核心逻辑 HBM驱动存储产能不可逆消耗，供需缺口将长期存在 过去两年HBM占全球存储产能比例从10%+提升至30%，其中海力士DRAM产能中HBM占30%，三星、美光占22%，该倾斜趋势不可逆。 HBM需求爆发式增长：2024年HBM晶圆需求为2.9万片/月，2025年为10.3万片/月，2026年为20万片/月，2027年为25万片/月，2028年为40万片/月；该测算仅包含英伟达需求，未计入谷歌、SpaceX、xAI等企业的GPU需求。"}, {"label": "投资逻辑", "text": "多重因素加剧产能消耗：单GPU匹配的HBM数量从6颗增长至8颗，HBM层数从6层提升至12层，18层也在加速研发；层数提升导致封装良率下降，海力士HBM封装良率为70%，三星、美光仅为60%，12层HBM整体封装良率较6层低10个百分点以上，进一步增加晶圆消耗。 供需格局：海外晶圆厂产能扩张缓慢，HBM供需缺口未来2-3年将持续扩大，同时DRAM产能被挤压后价格上涨，海力士DRAM毛利达95%以上、净利超90%，仅用70%的原有产能实现了盈利大幅增长。"}, {"label": "私域纪要", "text": "1. 国产GPU厂商进展 寒武纪 业绩表现：当前业绩略低于市场此前预期，主要受上游物料紧缺及收入确认节奏影响，资产负债表整体健康，相关收入后续会逐步确认。 制约因素：核心制约为HBM供应紧缺，当前580、590主力芯片的HBM主要依赖韩国供应链，同时下游服务器组装所需的SSD、PCIE相关部件、内存条等物料也存在短缺，影响服务器厂商确认节奏，进而传导影响寒武纪收入确认。"}, {"label": "相关标的", "text": "北方华创、中微公司、拓荆科技、盛美上海"}], "source": "private", "stocks": "北方华创、中微公司、拓荆科技、盛美上海"}, {"title": "制造端业绩确定方向：设备/零部件景气筛选", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. PCB设备 板块整体情况：2026年PCB厂资本开支已从厂房建设逐步转向设备采购环节，2027年将进入更集中的设备交付阶段；AF100服务器、高速交换机、1.6T光模块和3D板HDI对PCB层数、厚径比、加工精度要求提升，驱动PCB设备需求及工艺升级确定性较强，检测、高端成像设备、激光加工等应用规模有望进一步提升；当前板块核心公司订单和业绩兑现超预期。"}, {"label": "投资逻辑", "text": "建议关注标的：大族数控、大族激光、东威科技、芯碁微装。 2. PCB耗材（钻针） 赛道属性：钻针是PCB生产过程中的持续消耗品，需求同时受下游扩产和实际产量驱动。"}, {"label": "私域纪要", "text": "1. Rubin产业链最新进展与变化 此前市场传闻的PCB龙头测试问题已查明原因，问题并非出在PCB板厂本身，而是后道SMT环节的回流焊工序，相关担忧已逐步消解。 OAM背板相关推进情况好于此前悲观预期，目前仍在持续推进测试，整体预期向积极方向转变。 行业层面显示，2027年服务器机柜整体出货量预期较此前有所上升，且Rubin相关产品的占比进一步提升，产业链上游厂商将核心受益。 海外研报对明后年PCB市场规模的测算较此前预期有大幅上升，成为行业预期回暖的重要支撑。"}, {"label": "相关标的", "text": "汇川技术、埃斯顿、新强联"}], "source": "private", "stocks": "汇川技术、埃斯顿、新强联"}, {"title": "Rubin平台Q3量产：PCB/CCL价值量三倍跃升", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "在过去24小时内，英伟达下一代Rubin AI服务器平台已确认在第三季度正式进入批量出货阶段，首批机柜开始向OpenAI、谷歌等头部云厂商部署，这标志着一个通过引入Midplane中板等新架构、将单机柜PCB价值量提升近三倍的全新产品周期已启动。这一变化将投资焦点从对需求的预期转向对供给侧的验证，市场将优先关注那些已锁定订单、并具备稳定扩产和交付高端复杂PCB能力的厂商，其下半年的业绩兑现确定性极高。"}, {"label": "私域纪要", "text": "1. Rubin产业链最新进展与变化 此前市场传闻的PCB龙头测试问题已查明原因，问题并非出在PCB板厂本身，而是后道SMT环节的回流焊工序，相关担忧已逐步消解。OAM背板相关推进情况好于此前悲观预期，目前仍在持续推进测试，整体预期向积极方向转变。行业层面显示，2027年服务器机柜整体出货量预期较此前有所上升，且Rubin相关产品的占比进一步提升，产业链上游厂商将核心受益。海外研报对明后年PCB市场规模的测算较此前预期有大幅上升，成为行业预期回暖的重要支撑。钻针环节升级速度超预期，2026年6月起龙头钻针企业的Rubin专用钻针开始出货，当前双龙头钻针均价已达2元以上；2026年年初鼎泰钻针均价仅为1.47元，半年内的价格提升主要在近2个月内完成，Rubin对钻针环节的拉动显著超出此前市场预期。相关受益标的：钻针环节重点推荐鼎泰、中钨高新，以及具备技术和产能优势的二线厂商明阳、欧科亿、新锐等。2. mSAP产业链最新进展与变化 下游需求端：当前mSAP需求非常旺盛，整体处于供给紧缺状态，下游PCB板厂的扩产规划比市场原有预期更为乐观。设备端表现： 扩产带动下mSAP相关设备需求远超市场预期，当前各环节核心设备交付期普遍拉长，但下游客户仍普遍希望压缩交付时间，需求景气度高。"}, {"label": "私域纪要", "text": "进口设备交付瓶颈凸显，日本三菱等厂商的二氧化碳激光钻孔设备交付期已拉长至1年以上，国产超快激光设备迎来放量机遇。设备价值量显著升级： 超快激光钻孔设备单台价值量较传统二氧化碳激光设备提升幅度达大几十百分比。载板级激光直写设备线距可达微米级，均价较常规PCB级直写设备提升1-2倍。一站式VCP电镀设备需求旺盛，龙头厂商订单饱和、产能紧张，价值量较普通VCP、厚板脉冲式VCP提升至少2倍以上。mSAP扩产对设备企业的双重意义：一方面直接提升当期业绩预期，另一方面拉长了设备企业的增长周期，为业绩延续性提供了更长期的支撑，其大规模扩产从2026年才正式启动，下游需求主要由光模块领域驱动。相关受益标的：激光直写设备领域芯碁微装，电镀设备领域东威科技，激光钻孔领域大族激光、英诺激光、帝尔激光等。3. 行业投资相关判断 潜在被低估的行业变化： mSAP的扩产幅度当前仍被市场低估，从产业链跟踪情况看，设备交付情况、下游板厂扩产规划均超出此前预期。设备和耗材企业的盈利弹性被低估，核心驱动来自出货量增长、产品升级加速、盈利能力提升三重因素，不依赖直接提价；当前相关龙头公司中报业绩超预期，后续2026年三、四季度业绩仍存在持续上修可能。估值层面：相关标的股价较前期高点已出现大幅回撤，业绩预期上修叠加市场情绪回暖，当前估值性价比显著提升，无需回到前期高位估值即可修复至前期市值水平。"}, {"label": "相关标的", "text": "胜宏科技、景旺电子、威尔高、东材科技、沪电股份、鹏鼎控股"}, {"label": "私域补充", "text": "另收藏纪要：鸿仕达中报业绩交流会；行业需求上调，新技术和高景气周期；金刚石与人造钻石专题；能源半小时系列第7期等等"}], "source": "hot", "stocks": "胜宏科技、景旺电子、威尔高、东材科技、沪电股份、鹏鼎控股"}, {"title": "英伟达30亿押注Lancium：AI缺电矛盾显性化", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "今日（8月9日）英伟达拟斥资30亿美元投资电力开发商Lancium，标志着AI竞争已从算力内卷升级至对上游能源的直接锁定，以解决数据中心扩张面临的电力瓶颈。此举确认了AI基础设施的竞争核心正从算力转向电力，资本开支将沿着电力输送链，加速向高压直流（HVDC）、服务器电源、变压器及功率半导体等领域传导。"}, {"label": "相关标的", "text": "中恒电气、科华数据、麦格米特、欧陆通、新雷能、金盘科技、民德电子、中富电路、铂科新材、顺络电子"}], "source": "hot", "stocks": "中恒电气、科华数据、麦格米特、欧陆通、新雷能、金盘科技、民德电子、中富电路、铂科新材、顺络电子"}, {"title": "寒武纪Q2预付&存货大增：国产算力订单可见度抬升", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "根据8月7日晚间披露的寒武纪2026年Q2财报，市场关注点已从略低于预期的季度收入环比增速，迅速转向了创历史新高的存货（环比增375亿）与预付款（环比增102亿）。这些资产负债表上的前瞻性指标，被视为下游旺盛需求和上游产能锁定的明确信号，表明Q2的交付节奏仅是短期瓶颈，为下半年业绩的确定性高增长奠定了坚实基础。"}, {"label": "相关标的", "text": "寒武纪、海光信息、沐曦股份、摩尔线程"}], "source": "hot", "stocks": "寒武纪、海光信息、沐曦股份、摩尔线程"}, {"title": "薄膜铌酸锂：高速光模块关键材料路径验证", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "在过去24小时内，市场对薄膜铌酸锂（TFLN）的关注度显著回升，其背景是业界开始为2.4T/3.2T等下一代光模块寻找单波200G以上的技术方案，而近期产业链公司的融资事件成为催化剂。投资逻辑的核心在于，TFLN在沉寂后被重新视为可插拔光模块技术升级的确定性方向，不仅解决了下一代速率瓶颈，且单模块价值量可观，其商业化落地预期已从远期展望提前至明年，同时国内从材料到芯片的产业链卡位优势明显，具备主导全球供应的潜力。"}, {"label": "相关标的", "text": "天孚通信、源杰科技、光库科技"}], "source": "hot", "stocks": "天孚通信、源杰科技、光库科技"}, {"title": "DrMOS短缺：8英寸BCD产能转移下的电源瓶颈", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "截至8月9日，DrMOS的供需失衡已从周期性收紧演变为结构性危机，其根本原因在于全球头部晶圆厂正将8英寸BCD产能进行不可逆地转向利润更高的先进封装领域。这一结构性供给收缩，叠加1.6/3.2T光模块等新需求的出现，确立了DrMOS正成为继HBM后GPU放量的下一关键瓶颈的投资逻辑，为已锁定产能的国产供应商打开了份额替代和价格传导的窗口期。"}, {"label": "相关标的", "text": "杰华特、晶丰明源、中芯国际、华虹宏力"}], "source": "hot", "stocks": "杰华特、晶丰明源、中芯国际、华虹宏力"}, {"title": "玻璃基板：AI先进封装材料新方向加速落地", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "近24小时内，玻璃基板主题已从概念论证转向产业化加速落地，标志性事件是海外核心设备商（如LPKF）大幅上修市场空间预期，并将试产节点提前至2027下半年。这一产业基本面的加速确认，与近期板块股价的调整形成预期差，投资逻辑已从主题炒作转向对供应链验证和产能锁定的竞速，其中设备和材料环节将最先兑现订单能见度。"}, {"label": "相关标的", "text": "沃格光电、三环集团、兴森科技"}], "source": "hot", "stocks": "沃格光电、三环集团、兴森科技"}, {"title": "FDE重构AI落地：ARR可持续翻倍的产业路径", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. FDE核心定义与产业认知 市场对FDE存在普遍误解，常将其等同于人头外包，忽略了其在企业AI落地闭环中的定位。FDE在技术概念上有独立价值，但在业务闭环和商业价值层面无法脱离基座平台、可执行本体独立存在，三者为乘法关系，任意一项不足都会严重影响最终业务结果，只有三者形成闭环，企业AI才能同时实现业务深度与规模化落地。"}, {"label": "投资逻辑", "text": "1. FDE核心定义与产业认知 市场对FDE存在普遍误解，常将其等同于人头外包，忽略了其在企业AI落地闭环中的定位。FDE在技术概念上有独立价值，但在业务闭环和商业价值层面无法脱离基座平台、可执行本体独立存在，三者为乘法关系，任意一项不足都会严重影响最终业务结果，只有三者形成闭环，企业AI才能同时实现业务深度与规模化落地。FDE的核心本质是从业务结果而非客户显性需求出发，包含五个完整环节： 与客户共同发现高价值问题，定义可量化的业务结果（例如将平均投诉处理时长从6分钟缩短至3.5分钟）； 提炼业务模型，将分散在一线的隐性知识转化为可执行的本体； 组合基座平台能力，将模型、数据、知识与本体连接，设计智能体与工作流； 将智能体部署到真实生产环境运行，持续观察、评测、迭代； 将落地过程中积累的行业本体、数据反哺公司产品，推动本体与基座平台迭代，避免变成变相外包。FDE与传统软件交付工程师的核心差异：传统软件工程师从客户明确的显性需求出发，完成交付即结束；FDE从业务结果出发，交付后需要将落地数据反哺公司产品迭代，本身兼具部分产品经理属性。"}, {"label": "相关标的", "text": "恒生电子、中科创达、金山办公、拓尔思"}], "source": "private", "stocks": "恒生电子、中科创达、金山办公、拓尔思"}, {"title": "安迪-比尔定律重启：计算机软硬件螺旋新周期", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 计算机板块核心逻辑框架 安迪-比尔定律的产业适用性：IT行业遵循硬件与软件交替螺旋上升的规律，硬件性能迭代会被软件升级消耗，二者互为支撑；当前AI时代对应衍生为“Jensen-奥特曼定律”，即GPU（硬件）与大模型（软件）相互促进、螺旋发展，AI基建投入后，基建与应用也将延续该螺旋上升规律。 AI产业的五层架构逻辑：AI产业分为能源、芯片、基建、模型、应用五层，应用作为最上层环节，是产业形成闭环的核心必要条件。"}, {"label": "投资逻辑", "text": "大模型与软件企业的关系：大模型仅能替代单点轻型工具软件，无法替代与业务深度耦合、具备数据/合规壁垒、拥有行业know-how的垂直场景软件，此类场景仍需要同时懂模型、技术和业务的主体做定制化部署；软件企业具备的垂直领域know-how、客户资源是大模型厂商难以直接积累的，大模型本质是增厚软件行业的市场蛋糕而非替代。 企业AI主权需求快速上升：企业希望自身掌握AI应用部署能力，将内部流程、业务规则结构化沉淀为软件能力，而非完全依赖外部基础大模型厂商。"}, {"label": "相关标的", "text": "浪潮信息、中科曙光、用友网络、金山办公"}], "source": "private", "stocks": "浪潮信息、中科曙光、用友网络、金山办公"}]}, {"name": "大制造", "emoji": "制", "overview": "宇树科技IPO定价超预期重估机器人产业链；磷酸铁锂供给紧、光伏反内卷、动车高级修招标翻倍，制造端结构性α突出。", "topics": [{"title": "锂电主材盈利底部+负极未涨价：反内卷后弹性观察", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 锂电板块 板块估值与布局时机：推荐标的2026年估值约20倍，2027年估值普遍在15倍以下，具备较好投资弹性；板块此轮调整较为充分，Q2机构持仓有所下降，后续若出现仓位再平衡将带来增量资金；8月起排产进入旺季，环比增幅超7%，8-11月行业需求确定性较强，可提前布局，往年2024、2025年金九银十均存在估值切换的向上弹性，当前8月底需重视该窗口。 细分环节盈利与投资逻辑： 电池环节：2026年盈利受材料价格上涨压制，2027年随着上游产能释放，成本端存在改善逻辑；电池环节是历年估值切换最早的板块，推荐宁德时代、亿纬锂能、中航锂电。"}, {"label": "投资逻辑", "text": "负极材料：是锂电主材中2026年以来唯一未涨价的环节，Q1盈利能力较2025年Q4更差，当前处于盈利底部，盈利可持续性较强；行业整体现金流与资产负债表压力较大，不排除后续提价可能，提价将进一步降低板块估值，推荐尚太科技、璞泰来。 隔膜环节：恩捷股份2026年单平隔膜已实现0.2元盈利，2027年将进入盈利释放期，2027年行业供需仍将维持紧张格局。"}, {"label": "相关标的", "text": "宁德时代、天赐材料、尚太科技、璞泰来"}], "source": "private", "stocks": "宁德时代、天赐材料、尚太科技、璞泰来"}, {"title": "原油黑海扰动+石化旺季：油煤化链条再定价", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 原油板块投资要点 近期油价走势：7月第二周起油价因美伊谈判破裂、霍尔木兹海峡封闭大幅上涨，布伦特油价从70美金出头最高涨至102美金；7月底至8月初因美伊恢复谈判油价回落，后因谈判进展低于预期、多地冲突加剧，上周五布伦特油价回升至80-82美金。 供给端扰动因素： 霍尔木兹海峡：目前持续封闭，后续供给变化需重点关注美伊谈判进展。"}, {"label": "投资逻辑", "text": "黑海CPC管道：正常月出口量约150万桶/天，7月出口降至120-130万桶/天，8月至今为100-110万桶/天；7月哈萨克斯坦原油产量较6月降低15%，8月仍在下滑，后续或持续减量。 曼德海峡：今年3-6月沙特经该海峡运输量从100万桶/天提升至超400万桶/天；7月20日起胡塞武装已袭击8-9艘沙特油轮、劝返近30艘，海峡日通行油轮从正常30-40艘降至20艘左右，周末已降至个位数，最悲观情况或影响400万桶/天的原油出口；若沙特绕行好望角运输至亚洲，运费将上涨且船期从20天延迟至40天，加剧亚洲原油供应紧张。"}, {"label": "相关标的", "text": "中国海油、卫星化学、荣盛石化"}], "source": "private", "stocks": "中国海油、卫星化学、荣盛石化"}, {"title": "宁德时代深度复盘：份额、价格与全球化再平衡", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 宁德时代上市以来股价及业绩复盘核心阶段 第一阶段：19年底-21年四季度，电动化加速下的戴维斯双击 市值从1500亿上涨10倍至1.6万亿，此阶段市场对估值容忍度较高，股价高点对应2025年预期利润20倍估值。 核心驱动因素：全球电动化率快速提升，20-22年动力电池产量增速维持在100%以上；公司出货量21年增长近2倍、22年接近翻倍，同时市场对其2025年盈利预期从最初200亿上修至800-1000亿。"}, {"label": "投资逻辑", "text": "第二阶段：22年一季度-23年四季度，估值消化与震荡调整 市值从1.6万亿下跌至最低8000亿，后续反弹至1.2万亿后长期在6000亿-9000亿区间震荡。 核心影响因素：动力需求增速回落，23-24年动力电池产量增速降至20%-30%；碳酸锂价格超预期上涨至50万元/吨，叠加市场对公司盈利稳定性、海外业务拓展的担忧，估值大幅下杀。"}, {"label": "相关标的", "text": "宁德时代、亿纬锂能、欣旺达"}], "source": "private", "stocks": "宁德时代、亿纬锂能、欣旺达"}, {"title": "宇树科技IPO定价超预期：机器人产业链重估", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "于8月6日晚间，人形机器人龙头宇树科技公布IPO定价为150.80元/股，对应市值约610亿元，较市场预期大幅超募，并引入了AI大模型公司深度求索（DeepSeek）等战略投资者。资本用真金白银的投票，不仅在资本层面首次验证了“大脑+身体”的产业闭环逻辑，更关键的是为国产机器人本体厂商提供了全新的高估值锚，预计将带动整个产业链的价值重估。"}, {"label": "私域纪要", "text": "1. 宇树科技上市相关核心信息 发行基本情况：IPO发行价格确定为每股150.8元，预计募集资金总额61亿元，扣除发行费用后募集资金净额59亿元；发行新股占发行后总股本的10%，对应发行市值约610亿元。 历史及预计业绩表现： 2025年实现收入约17亿元，扣非归母净利润5.9亿元，对应发行市值下2025年PS为36倍、PE为103倍。 2026年预计收入区间为20-30亿元，若按25亿收入测算，对应2026年PS约为25倍。 2026年1-6月预计实现营业收入10.5-11.3亿元，同比增长约40%；扣非归母净利润预计2.4-2.8亿元，同比有一定下滑，但二季度降幅较一季度明显收窄。"}, {"label": "相关标的", "text": "上纬新材、优必选、越疆、模塑科技、晋拓股份、奥比中光、雷赛智能、汇川技术、三花智控、鸣志电器"}, {"label": "私域补充", "text": "另收藏纪要：申万宏源AI研究二十讲｜算电协同；每周汇_第220期；阳光电源：光储全球标杆，发力AI迎新机；氧化锆行业专家电话会等"}], "source": "hot", "stocks": "上纬新材、优必选、越疆、模塑科技、晋拓股份、奥比中光、雷赛智能、汇川技术、三花智控、鸣志电器"}, {"title": "磷酸铁锂7月产量环比+6.6%：供给偏紧延续", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "最新数据显示7月磷酸铁锂产量环比增长6.6%，且8月电池厂超额下单已成常态，这表明新产能调试不顺正加剧有效供给的紧张。因此，投资逻辑已从关注行业β转向挖掘α，即寻找那些拥有高压实等先进技术、深度绑定大客户、能实现满产满销的头部企业，其盈利能力和确定性将显著优于行业平均水平。"}, {"label": "相关标的", "text": "湖南裕能、德方纳米、富临精工"}], "source": "hot", "stocks": "湖南裕能、德方纳米、富临精工"}]}, {"name": "港股互联", "emoji": "港", "overview": "苹果官网短现千问文档指向国产大模型系统级入口；FDE/Agent与Palantir财报共振，应用与算力软件同步活跃。", "topics": [{"title": "港股/互联网周度线索：AI应用与流量再评估", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. AI产业趋势与资本开支相关判断 产业端目前仍未消除中期担忧，核心争议点为后续AI领域资本开支是否能达到1.5万亿元，以及AI应用场景能否落地，该担忧同时存在于A股投资者和海外硅谷投资者中，当前市场主流策略是将行情定义为急跌后的反弹，反弹时间维度预期为两周左右。 模型参数量增长趋势明确，短期能见度较高： 海外模型：当前最大模型F5参数量为9.9万亿，GPT5.6参数量为5万多亿；2026年年底海外发布的模型参数量普遍在10万亿到10万多亿区间；2027年上半年海外模型参数量将达20万亿左右量级，2027年下半年将达30多万亿量级。"}, {"label": "投资逻辑", "text": "在研训练的模型参数量会比发布的版本更高。 国内模型：当前最大的Kimi模型参数量为3万亿；2026年年底国内模型参数量预计在3-5万亿区间，部分厂商有推出10万亿参数模型的规划，但落地可能性存疑；2027年下半年国内模型参数量预计接近10万亿，远期有望达十几到二十万亿，2027年下半年国内外参数量进度受技术变化影响暂时无法明确。"}, {"label": "相关标的", "text": "腾讯控股、美团、阿里巴巴、小米集团"}], "source": "private", "stocks": "腾讯控股、美团、阿里巴巴、小米集团"}, {"title": "苹果官网闪现千问文档：国产大模型系统级入口猜想", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "周末（8月9日）苹果官网短暂上线后又删除了关于Apple智能集成阿里千问的技术支持文档，此举被视为双方技术集成已完成的明确信号，意味着中国大模型商业化获得了顶级消费电子终端的系统级入口，从概念走向大规模落地的确定性显著增强。"}, {"label": "相关标的", "text": "苹果、阿里巴巴、科大讯飞、商汤"}, {"label": "私域补充", "text": "另收藏纪要：算租最新情况更新；Token经济周观察等"}], "source": "hot", "stocks": "苹果、阿里巴巴、科大讯飞、商汤"}]}, {"name": "医药", "emoji": "药", "overview": "美法院批准药明康德1260H禁令缓释CXO地缘风险；AI提速药物发现放大上游实验需求，礼来减肥药三期完成。", "topics": [{"title": "RAS靶向从不可成药到兑现：中国项目全球占比近四成", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 行业整体发展现状与拐点 RAS靶点曾被称为“不可成药靶点”长达四十余年，2021年首个KRAS G12C抑制剂获批实现成药性突破；2026年ASCO大会上Revolution Medicines的pan-RAS分子胶RMC-6236公布晚期胰腺癌头对头三期临床阳性数据，成为RAS领域四十多年来首个头对头三期临床重大胜利，标志着RAS赛道从“可成药”阶段进入“能够显著改善患者生存”的临床拐点。"}, {"label": "投资逻辑", "text": "中国已成为全球RAS创新第二密集来源，2026年AACR、ASCO的RAS相关摘要中，来自中国的项目约占40%；KRAS G12D细分赛道全球首个进入单药三期的是中国公司；全球临床阶段pan-RAS分子胶共6款，其中4款来自中国，中国创新药研发实力已快速向全球一线对齐。 2. 市场空间与流行病学特征 全球每年新发KRAS突变患者约164万人，中国每年新发约50万人；其中胰腺癌全球年新发约16万人，中国年新发约11万人，相关治疗市场仍处于空白状态。"}, {"label": "相关标的", "text": "百济神州、信达生物、加科思、诺诚健华"}], "source": "private", "stocks": "百济神州、信达生物、加科思、诺诚健华"}, {"title": "医药周观点：风格资金占主导，创新药结构性机会", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 医药板块整体行情观点 2026年医药板块行情驱动因素中，宏观资金、市场风格等因素占比达60%-70%，产业逻辑占比仅30%左右，上半年产业景气度提升但板块表现平淡，7月后科技板块调整带动板块势能切换，产业层面无明显变动但板块涨幅明显。 当前重点关注以创新药和创新药供应链构成的新医药板块，该细分领域产业逻辑最顺畅，是板块贝塔行情的核心载体。"}, {"label": "投资逻辑", "text": "新医药板块7月以来经历三个阶段：第一阶段为与科技板块的跷跷板行情，作为“最强备胎”承接科技板块流出资金；第二阶段为随科技板块调整共振消化获利盘；当前处于第三阶段，尝试与科技板块形成单点联动突破。 中期维度（1-3年）新医药板块超额收益逻辑确定性强，短期随着AIDD供应链行情催化，板块短期信心得到强化，后续行情将沿“创新上游供应链→创新药”顺序演绎，先关注A股创新药，后续延伸至港股创新药。"}, {"label": "相关标的", "text": "恒瑞医药、药明康德、百济神州"}], "source": "private", "stocks": "恒瑞医药、药明康德、百济神州"}, {"title": "AI4S赋能药物研发：上游实验与数据链条重估", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 医药板块周度行情复盘 本周医药板块整体涨幅达6.1%，其中周五单日涨幅4.7%，强势收官；细分板块中医疗服务单周大涨15.7%，创近期单周最大涨幅，CXO、上游产业链均有较大幅度上涨。 行情上涨核心驱动因素： 药明康德2026年中报业绩大超预期：收入同比增长40%，利润同比增长80%，在手订单同比增长25%，新签订单同比增长40%，且大幅上调全年收入指引，强劲业绩带动整个板块情绪。"}, {"label": "投资逻辑", "text": "礼来、诺和诺德2026年中报业绩强劲：礼来替尔泊肽上半年销售额达270多亿美金，全年销售额预期上修至600亿美金，炸裂业绩带动整个减重产业链，包括下游CDMO在内的相关企业均受益。 AI for Science领域持续火热，海外大厂持续重点布局，相关产业订单已开始兑现，催生板块新投资逻辑。"}, {"label": "相关标的", "text": "晶泰控股、华大智造、药明康德"}], "source": "private", "stocks": "晶泰控股、华大智造、药明康德"}, {"title": "AI提速药物发现：上游实验服务需求被放大", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "在过去24小时内，市场共识已从“AI赋能”的概念阶段迅速转向对订单和业绩的量化验证，核心边际变化在于，AI在药物发现前端（干实验）的效率跃升，正导致研发瓶颈向下游的湿实验环节转移。这一转变明确了AI对于上游并非替代关系，而是指数级的需求放大器，因此投资逻辑正从追逐AI平台本身，转向重估那些能提供高通量、自动化、标准化实验验证服务的上游“卖水人”的价值。"}, {"label": "相关标的", "text": "金斯瑞生物科技、义翘神州、百普赛斯、奥浦迈、百奥赛图、药康生物、药明康德、康龙化成"}, {"label": "私域补充", "text": "另收藏纪要：CXO产业及AI4S更新推荐等"}], "source": "hot", "stocks": "金斯瑞生物科技、义翘神州、百普赛斯、奥浦迈、百奥赛图、药康生物、药明康德、康龙化成"}, {"title": "美法院批准药明1260H禁令：CXO地缘风险缓释", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "美国哥伦比亚特区联邦地区法院于8月7日批准了药明康德的初步禁令申请，在诉讼期间禁止美国国防部执行1260H清单的效力，法院认为国防部将其列为“中国军事公司”的证据基础薄弱，并拒绝了国防部在上诉期间暂停禁令的请求。这一裁决被视为一个关键的去风险催化剂，显著降低了公司因1260H清单而被列入《生物安全法案》“受关注生物技术公司”名单的尾部风险，从而有望修复此前受地缘政治压制的整个CXO板块的风险偏好与估值中枢。"}, {"label": "相关标的", "text": "药明康德、药明生物、药明合联、康龙化成、凯莱英、晶泰控股、英矽智能"}], "source": "hot", "stocks": "药明康德、药明生物、药明合联、康龙化成、凯莱英、晶泰控股、英矽智能"}]}, {"name": "消费", "emoji": "费", "overview": "茅台自营店四款再提价强化定价权；轻工出口/造纸/新消费框架密集，纺服化工链旺季涨价预期升温。", "topics": [{"title": "消费筹码近十年低位：白酒/可选修复线索", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 消费板块整体基本面与筹码结构 基本面走势：2026年二季度以来消费整体基本面增速边际减弱，4-5月表现偏弱，5月出现负增长，6月底部企稳，同比增长1%；预计7月数据大概率不弱于6月，整体呈现底部企稳、缓慢好转趋势，其中必选消费基本面大概率已见底，可选消费尤其是耐用品消费仍存在明显压力，整体消费仍处于偏弱状态。 机构持仓情况：消费板块（不含汽车，共8个一级行业）当前机构持仓比例不到4个百分点，处于极低水平；其中家电、白酒持仓相对偏高，其余行业持仓基本仅0.几个百分点，筹码已明显出清。"}, {"label": "投资逻辑", "text": "白酒板块估值与持仓：白酒机构持仓仅0.97%，接近2014年0.57%的历史最低水平，考虑到当前公募基金体量远大于2014年，实际持仓强度更弱；食品饮料板块当前估值处于历史分位数13%附近，接近历史低点。 行情节奏判断：三季度大概率为震荡拉锯走势，8月受中报（含二季报）偏弱的冲击消费仍有压力，8月后消费机会逐步显现，四季度将形成边际上行趋势；当前机构持仓出清较为充分，基本面略有改善时股价将有明显表现，微观结构处于较好状态。"}, {"label": "相关标的", "text": "贵州茅台、五粮液、泸州老窖、太原酒"}], "source": "private", "stocks": "贵州茅台、五粮液、泸州老窖、太原酒"}, {"title": "消费底部掘金：黄金珠宝+跨境双主线", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 消费板块整体观点与宏观催化 整体判断：当前消费正逐步从底部走出，消费复苏趋势明确，仅因外部因素扰动节奏延后，虽然近期科技板块反弹使得消费板块关注度环比下降，但依然看好后续消费行情，核心推荐出海、黄金珠宝、交运三大方向。 地产端边际催化： 近期一线城市地产政策放松，北京放松限购，上海作为本轮修复先锋，年初政策放开后刚需盘率先改善，截至2026年8月二手房交易量仍保持坚挺，同比涨幅接近20%，房价小幅上升，需求已从刚需盘传导至五六百万级别的置换盘及新房市场，热门板块新房摇号中签比例低至4:1-5:1。"}, {"label": "投资逻辑", "text": "一线城市地产修复将带动居民尤其是中产阶级资产负债表修复，有望提升居民消费边际倾向，叠加7月政治局会议对房价筑底的明确表态，后续预计仍有更多稳地产政策落地，进一步支撑地产链及消费复苏。 美国非农数据低于预期，金价短期快速上涨，一周内涨幅达到10%，纽约金突破4400元/盎司平台，当前金价上涨向下游黄金饰品传导顺畅，预计三季度终端销售将体现出增长，原本6-8月为黄金珠宝销售淡季，当前已出现淡季不淡的特征。"}, {"label": "相关标的", "text": "潮宏基、周大生、老凤祥、赛维时代"}], "source": "private", "stocks": "潮宏基、周大生、老凤祥、赛维时代"}, {"title": "无糖茶扩容：需求韧性与格局强化", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 无糖茶行业当前运行与需求韧性 2026年上半年软饮料整体承压，无糖茶实现逆势增长：受厄尔尼诺影响，华东、华南等软饮核心消费区域4-6月多雨低温，居民出行减少，上半年饮料行业线下市场销售额同比下滑8%，而无糖茶品类同比增长20%，头部品牌东方树叶的市占率从2025年的70%+进一步提升至80%以上。 需求韧性源于品类场景特性：无糖茶是唯一室内场景占比明显超过户外场景的软饮料品类，需求呈现佐餐、办公、居家等多场景覆盖的平台型分布，单一场景波动对总量扰动小，天气敏感度是所有软饮料品类中最低的。"}, {"label": "投资逻辑", "text": "消费习惯加固对冲短期波动：无糖茶仍处于成长期向成熟期过渡阶段，增长核心驱动力为渗透率提升与消费习惯固化；调研显示高线城市超50%消费者、低线城市超30%消费者购买无糖茶的频率持续提升，该动能足以对冲短期天气等外部波动。 渠道分布进一步平滑波动：无糖茶渠道分布更均衡，高线城市有便利店、即时零售承接，天气不佳时外卖订单反而增长；低线城市以食杂店、家庭囤货场景为核心，单一渠道波动风险更低。"}, {"label": "相关标的", "text": "东鹏饮料、农夫山泉、统一企业"}], "source": "private", "stocks": "东鹏饮料、农夫山泉、统一企业"}, {"title": "茅台自营店四款再提价：定价权与渠道节奏", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月8日，茅台全国42家自营店继7月下旬后再度提价，飞天茅台等四款核心产品零售价上调约2%，此举标志着其分渠道、阶梯式的动态定价体系进入实质化运作阶段。这一系列紧随市场供需的调价动作，被视为公司将渠道利润收归报表、强化价格体系掌控力的关键一步，为即将到来的中秋旺季放量和业绩增长夯实了基础。"}, {"label": "相关标的", "text": "贵州茅台、五粮液、泸州老窖"}, {"label": "私域补充", "text": "另收藏纪要：高温合金在两机供需缺口；AI、云与电商观点汇报；生猪：涨价，情绪还是现实等"}], "source": "hot", "stocks": "贵州茅台、五粮液、泸州老窖"}, {"title": "比音勒芬业绩拐点：费用投放后增长提速", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 业绩拐点及增长趋势 业绩拐点表现： 收入端自2025年下半年开始逐季优化，2025年1-3季度整体收入增速为6.7%，四季度提速至10%，2026年一季度继续提速至高双位数，二季度至今增长持续领跑男装、户外板块，实现超越行业的增长。 业绩端自2025年Q4至2026年Q1呈现更高速的改善趋势，毛利额趋势与收入增长匹配，毛利率、品牌定价能力、盈利能力较此前低点已快速改善，预计2026年全年业绩增速将快于收入增速。"}, {"label": "投资逻辑", "text": "业绩提速原因： 2025年公司业绩受新品牌收购后的营销投入、库存计提拖累，未体现明显拐点；2026年公司将营销资源、费用更多聚焦于国内户外新品牌及主标业务，减少海外高端品牌前期投入，费用端呈现正向杠杆效应，带动利润增速高于收入，该趋势预计2026、2027年将持续。 2. 场景端品类扩张 户外品类（核心增长引擎）： 布局多品牌户外矩阵：自有比音motion户外系列、主打路亚钓鱼概念的威尼斯品牌，独家代理Snow Peak（已被定位为集团未来第二条增长曲线，2026年正加快线下渠道建设、线上营销及开店速度）。"}, {"label": "相关标的", "text": "比音勒芬、报喜鸟、海澜之家"}], "source": "private", "stocks": "比音勒芬、报喜鸟、海澜之家"}]}, {"name": "周期", "emoji": "周", "overview": "铜价受刚果禁运+AI需求破年内新高；山西安检致煤价反季跳涨，钨价内外价差扩大加速刀具替代。", "topics": [{"title": "周期一季展望：电力紧张+补贴回款+资源品弹性", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 电力行业投资线索 供需与政策催化方向： 当前处于迎峰度夏关键时期，电力系统负荷平衡处于紧张状态，未来1个季度左右有望看到电力供需平衡表出现拐点；2026年电力供需系数按统一水电蓄水口径测算约为0.89，接近2022年、2024年水平，这两年均为国内电力供应压力较大的年份。 未来1个季度不排除出现厄尔尼诺带来的高温天气边际催化，叠加对降雨、来风等自然资源的影响，将催生夏季电力供需平衡相关的产业链投资机会，东南沿海火电为首选方向，核心标的为华能国际、国电电力（二者为行业龙头，资产聚焦江浙地区）。"}, {"label": "投资逻辑", "text": "可再生能源补贴催化： 未来1个季度可再生能源补贴回款将持续加速，上市公司太阳能2026年1-7月累计回收可再生能源补贴约16亿元，同比增长150%，为行业补贴清偿进程提速的信号。 截至2025年底，新能源运营商应收补贴占资产比重持续下降：龙源电力下降0.8个百分点，华电新能下降7.8个百分点，太阳能下降4.2个百分点，金开新能下降14个百分点；补贴清偿加速将缓解新能源运营商资产负债表压力、直接改善现金流，利好企业再投资或回馈股东，构成行业底部反转机会。"}, {"label": "相关标的", "text": "长江电力、太阳能、紫金矿业、中国神华"}], "source": "private", "stocks": "长江电力、太阳能、紫金矿业、中国神华"}, {"title": "油煤炼化周度：供需僵持下的价差与库存", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 原油行业基本面与趋势 原油当前供需僵持，整体库存处于低位： 7月起原油市场恢复至缺乏流动性的状态，海峡持续封锁、红海供应扰动、红海装船量处于低位，但中国买盘自2026年4月起持续低迷，仅6月通航缓和窗口期有少量采买，形成供给、需求双缺失的僵持格局。 全球除中国外的原油库存均处于相当低的位置；Kpler口径下中国原油库存较高点仅下降约5000万桶，日均去库幅度不足50万桶，与采购、加工量推导的理论去库速度存在差异，实际去库速度或更高。"}, {"label": "投资逻辑", "text": "沙特原油官方售价（OSP）持续下调，反映供应链断裂问题： 7月初定2026年8月沙轻亚洲OSP为较迪拜阿曼均价折价1.5美元/桶，为2021年以来首次转负；8月初定9月价格进一步下调至折价2美元/桶，全球原油供不应求背景下的价格折扣印证供应链断裂问题。 当前原油定价体系分裂，中东等产油区原油无法顺畅运出，亚太等有炼厂的区域缺原油，中国有库存和冗余炼能但出于能源安全考量出口量少，俄罗斯炼厂受袭击、CPC码头受影响，部分地区无炼油能力，原油FOB价、亚洲原油价、成品油价格分裂程度大，价格部分失去意义。"}, {"label": "相关标的", "text": "中国神华、中国海油、荣盛石化、恒力石化"}], "source": "private", "stocks": "中国神华、中国海油、荣盛石化、恒力石化"}, {"title": "有色趋势行情酝酿：铜铝金银多驱动共振", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 电解铝供需格局向好调整 市场此前对全球电解铝增量过快增长的预期过度乐观，印尼作为电解铝核心边际增量区域，2027-2029年的边际产量增量均会低于市场预期，核心约束来自电力配套： 印尼本土企业电力配套周期为2-3年，配套完成后新建电解槽还需额外1年左右，且当地整体电力短缺，电力企业对外岛重化工业园区新建电站、爪哇岛拉电网均持谨慎态度，本土绝大多数边际新增产能要到2029年甚至2030年才会释放。 中资企业在印尼配套电站周期也需要1年半到2年，叠加全球对火电建设持谨慎态度，中资项目投产周期和节奏会被拉长拖慢。"}, {"label": "投资逻辑", "text": "供需平衡预期更新： 2026年电解铝短缺近大几十万吨，2027年由此前预期的平衡调整为仍然短缺，2028年原本预期微幅过剩，但若出现两个变量可能转为平衡或微幅短缺：一是海湾地区物流恢复、再工业化战略储备等带来0.5个百分点的额外边际增速；二是部分中资产能因电力问题从原计划2027-2028年投产推迟到2029年，对应小几十万吨的供给不确定性。 2028年即使微幅过剩，也有强成本支撑，底部基本在21000元。"}, {"label": "相关标的", "text": "紫金矿业、洛阳钼业、山东黄金、云铝股份"}], "source": "private", "stocks": "紫金矿业、洛阳钼业、山东黄金、云铝股份"}, {"title": "山西安检升级：煤价反季跳涨", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "截至8月9日，山西焦煤旗下西曲矿于8月5日发生新的安全事故并停产，叠加国家矿山安监局发布高级别安全整治通知，导致产地供给收缩超预期，并引发了夏季用煤尾声的反季节性煤价跳涨。这一系列事件将市场对供给冲击的认知从区域性、临时性事件，转变为对全国范围供给弹性将持续受损至年底的判断，在港口与电厂库存快速去化的背景下，任何边际上的需求回暖都可能触发价格的剧烈上行。"}, {"label": "私域纪要", "text": "1. 焦煤供给情况 国产焦煤供给 5·22山西事故后安监持续高压，复产节奏远慢于市场预期：事故后山西合计停产约2.5亿吨煤矿产能，截至7月底仍有接近9200万吨产能处于停产状态；本周原煤日均产量150万吨，维持低位，远低于事故前（5月20日之前）的近210万吨水平。 供给约束持续时间长：山西安全检查的影响将持续到2027年3月份，2026年下半年供给改善预期较弱，且叠加煤矿反腐因素，产量修复难度大。"}, {"label": "相关标的", "text": "反季节性煤价跳涨、潞安环能、淮北矿业、山西焦煤、平煤股份、兖矿能源、昊华能源、晋控煤业、山煤国际、广汇能源"}], "source": "hot", "stocks": "反季节性煤价跳涨、潞安环能、淮北矿业、山西焦煤、平煤股份、兖矿能源、昊华能源、晋控煤业、山煤国际、广汇能源"}, {"title": "刚果供给+AI需求：铜价突破年内新高", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "在过去24小时内，LME铜价受刚果（金）确认禁止铜精矿出口及美国疲软非农就业数据强化降息预期的双重催化，突破14240美元/吨创下年内新高。这一变化验证了结构性供给刚性与AI驱动的长期需求增长这一核心逻辑，同时叠加了美元走弱的宏观顺风，表明铜价的定价逻辑正从传统周期品向战略资源迁移，价格中枢已获得根本性抬升。"}, {"label": "相关标的", "text": "紫金矿业、洛阳钼业、西部矿业、江西铜业、中国中铁、中国中冶、诺德股份、嘉元科技、铜冠铜箔、有研新材"}, {"label": "私域补充", "text": "另收藏纪要：迎接煤炭新周期 - 信心恢复+低位抢筹；第15期：非农吹响了黄金的反攻号角吗；再看筹码结构对AI板块的影响等"}], "source": "hot", "stocks": "紫金矿业、洛阳钼业、西部矿业、江西铜业、中国中铁、中国中冶、诺德股份、嘉元科技、铜冠铜箔、有研新材"}]}, {"name": "金融地产", "emoji": "金", "overview": "北京下调非京籍购房门槛+提升公积金额度，金九银十前需求端催化，地产链量价企稳预期升温。", "topics": [{"title": "物业高分红+地产链修复：金融地产周观点", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 物业板块投资观点 核心标的推荐逻辑：物业头部标的属于现金流价值高于净利润的品类，盈利可保持增长且分红率稳健，可对标类红利股进行配置。 绿城服务基本面与业绩情况 2025年营收191.6亿元，同比增长7.1%，股东应占净利润8.8亿元，同比增长12%；毛利率同比提升0.5个百分点，销售费用率、管理费用率分别同比下降0.3个、0.6个百分点，费用率处于下行趋势。"}, {"label": "投资逻辑", "text": "业务结构方面，物业服务收入同比增长10%，园区收入、咨询服务保持正增长，增速相对较慢；物业板块毛利率较上年同期提升0.6个百分点，处于提质增效阶段，未来两年盈利能力有望年化提升0.5-1个百分点，净利润增速将持续高于营收增速。 2025年末在管面积达5.66亿平方米，较2024年增长11%，储备面积3.3亿平方米；公司在中高端住宅领域品牌优势显著，未来中高端物业、非住宅对公业务将依托品牌优势持续增长。"}, {"label": "私域纪要", "text": "1. 新政出台背景 政策出台时间为2026年8月7日，与2025年北京新政出台时间（8月8日）接近，属于自上而下推进的政策节点，出台背景为： 7月底政治局会议明确“稳定房地产市场”的定调，为政策出台提供自上而下的方向指引。 2026年以来北京地产市场边际走弱： 新房：2026年上半年网签同比增长0.1%，基本持平；7月同比增长2%，环比下降29%，增速边际放缓。 二手房：2026年上半年同比增长46%；7月同比增长11%，环比下降11%；7月二手房价格环比下降0.7%，降幅较6月有所走扩。"}, {"label": "私域纪要", "text": "1. 电子布行业及相关标的投资逻辑 行业供需与价格趋势： 2026年下半年即便有普通布、电子布投产，供给仍无法满足行业整体需求，核心原因包括织布机供给不足，以及特种布需求下半年释放挤压普通布供给，特种布和普通布有望延续上半年价格上涨行情。 2026年8月7.8布价格上涨约1.5元/米，涨幅超过2025年同期，薄布及极薄布价格持续上行；9月基于当前行业库存情况，涨价为大概率事件，且9月后无太多新增供给，行业景气度极大概率维持至2026年底。"}, {"label": "相关标的", "text": "保利物业、中海物业、华润万象生活"}], "source": "private", "stocks": "保利物业、中海物业、华润万象生活"}, {"title": "新加坡组屋镜鉴：超大特大城市保障房制度启示", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 经济结构指标 2023年中国社会消费品零售总额占GDP比重为37.4%，低于新加坡同期的41.5%；选取的19个中国超大特大城市中仅6个城市该占比高于新加坡，且多为经济活跃度低、投资占比低的城市，大部分城市消费占比偏低，借鉴新加坡保障房制度的经济基础存在一定欠缺，经济结构仍需转型。 2023年中国房地产增加值占GDP比重为5.85%，高于新加坡同期的3.43%，且19个超大特大城市该占比全部高于新加坡，说明中国超大特大城市普遍对房地产产业链依赖度较高，推动保障房建设、降低经济对房地产的依赖难度较大。"}, {"label": "投资逻辑", "text": "2. 人口与住房需求指标 19个中国超大特大城市中，有14个城市的常住人口增速高于新加坡，仅沈阳、天津等经济活跃度较低的城市增速低于新加坡，说明大部分超大特大城市人口流入压力大，保障性住房需求旺盛。 3. 财政相关指标 中国整体国有土地使用权出让金占政府总收入比重为19.7%，高于新加坡的12.99%；19个超大特大城市中有15个城市该占比高于新加坡，其中西安、成都、合肥等中西部城市依赖度远高于新加坡，上海、北京等东部沿海城市相对偏低但仍处于较高水平。"}, {"label": "相关标的", "text": "保利发展、华润置地、招商蛇口"}], "source": "private", "stocks": "保利发展、华润置地、招商蛇口"}, {"title": "险资资产配置国际比较：久期与估值映射", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 保险板块估值与基本面现状 核心估值矛盾：近年来保险公司内涵价值（EV）持续稳健增长，但A股、H股上市保险公司的PEV水平未同步显著提升，25年行情中PEV提升更快的是此前估值最低的标的，而非EV增长最快的标的，反映资本市场对保险公司远期投资收益率的预期并未持续向好。 EV假设与市场悲观预期： 保险公司分别在2023年、2024年两次下调EV投资收益率假设，当前已调整至4.0%，此前为5.0%。"}, {"label": "投资逻辑", "text": "当前市值倒算的隐含投资收益率，扣除险资真实投资收益较国债利率的超额水平后，反推的十年期国债收益率远低于真实水平，说明市场隐含了极度悲观的未来投资收益率假设，核心原因是市场对保险公司未来可分配现金流增长属性的不确定性担忧大幅提升。 利润波动特征： 2023年IFRS9新会计准则实施后，金融资产重分类使得大部分股票、基金的当期公允价值变动计入净利润，叠加保险公司近两年增配权益资产，净利润波动率显著提升。"}, {"label": "相关标的", "text": "中国平安、中国太保、新华保险"}], "source": "private", "stocks": "中国平安、中国太保、新华保险"}, {"title": "北京松绑非京籍购房+提公积金：金九银十催化", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "北京于8月7日晚间宣布下调非京籍购房社保门槛至1年并大幅提升公积金贷款额度，以应对上半年房价疲软的局面。此举被视为在“金九银十”旺季前释放的关键催化剂，核心投资逻辑在于，政策带来的需求端刺激与市场自发的供给侧出清（挂牌量下降）形成共振，有望复制上海新政后楼市量价企稳回升的路径。"}, {"label": "相关标的", "text": "需求端刺激、供给侧出清、贝壳、我爱我家、建发国际集团、滨江集团、华润置地、中国金茂、招商蛇口、保利发展"}, {"label": "私域补充", "text": "另收藏纪要：周期中报行情的主线等"}], "source": "hot", "stocks": "需求端刺激、供给侧出清、贝壳、我爱我家、建发国际集团、滨江集团、华润置地、中国金茂、招商蛇口、保利发展"}]}, {"name": "稳定类", "emoji": "稳", "overview": "AI电力瓶颈沿HVDC/服务器电源/变压器传导，电网与AIDC电力景气确定性延续。", "topics": [{"title": "快递反内卷深化：立案调查与十五五统计口径变局", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 快递行业十五五规划相关判断 行业统计口径调整预期：即时配送将大概率被纳入快递行业统计范围。当前十五五规划提出快递业务量年复合增速约6.3%、收入年复合增速约6%，若不调整统计口径，仅依靠传统电商快递，2030年快递业务量最多达2500亿件，无法达到2710亿件的规划目标；当前廊坊、保定等地已率先将美团、饿了么等即时配送量纳入统计，若全国纳入，可支撑目标实现；预计未来10年即时零售配送量将占快递行业总量的40%左右。"}, {"label": "投资逻辑", "text": "邮政业务发展方向：邮政普遍服务业务量2024年增速1.4%、2025年增速-5.7%、2026年上半年增速-4%，处于持续负增长状态，无法实现十五五期间增长25亿件的目标；邮政将重点发力国际邮件和快件业务，其郑州全球航空物流枢纽已列入发改委十五五重点工程，投资规模不低于鄂州机场，远大于圆通嘉兴机场，将与南京枢纽形成双枢纽布局，支撑国际业务拓展。 行业业务结构趋势：规划的量、收入增速基本匹配，体现“电商件逐步降价、时效件增收提利”的趋势，通达系企业均在推动时效件业务布局，时效件价格、成本约为通达系电商件的5倍，利润空间更高。"}, {"label": "相关标的", "text": "中通快递、圆通速递、韵达股份、顺丰控股"}], "source": "private", "stocks": "中通快递、圆通速递、韵达股份、顺丰控股"}, {"title": "十五五碳达峰决胜：环保政策深化下的投资主线", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "“十五五”降碳采用“1+N”政策框架：顶层设计为2030年前碳达峰行动方案，N为能源、工业、建筑、交通等重点领域实施方案，并由地方配套规划保障自上而下传导。考核思路由能耗双控转向碳排放双控，能耗指标转为辅助、清洁能源使用不占约束性指标，更鼓励清洁能源消纳。核心目标为单位GDP二氧化碳排放较2025年降低17%、非化石能源消费占比达到25%，后续纳入碳市场的行业单位产品碳排放需下降约3%。政策力度未因十四五完成度不及预期而放松，以市场化体系推动低碳转型、避免运动式一刀切。"}, {"label": "投资逻辑", "text": "碳市场化管控由配额、CCER、绿证三大工具协同构成，未来建立勾稽关系共同决定碳价；企业超配额排放可通过三类渠道清缴，CCER抵扣上限为实际排放量的5%。全国碳市场已覆盖电力、钢铁、水泥、铝冶炼四大行业、约60%碳排放纳入强监管，并按“成熟一个纳入一个”原则于2027年完成全部重点排放源纳入。当前碳价回落至80元左右，“十五五”碳价中枢指引约15美元、对应人民币100–110元，碳金融、碳监测检测等衍生需求随行业推进逐步兑现。"}, {"label": "相关标的", "text": "高能环境、格林美、伟明环保、龙净环保"}], "source": "private", "stocks": "高能环境、格林美、伟明环保、龙净环保"}, {"title": "交运中报季配置：航空/公路/快递均衡思路", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 交运板块7月整体行情 7月交运板块上涨7.7%，跑赢中证800指数12.18个百分点，在申万31个一级行业中排名第七，上涨核心驱动为市场风格由成长切换至低估值、红利板块。 各细分板块7月涨跌幅表现： 港口板块涨幅居首，核心驱动为出口向好+红利防御属性。"}, {"label": "投资逻辑", "text": "铁路上涨10.9%、公路上涨7.4%、机场上涨8.8%，机场同时受益于暑运客流回暖+配置需求。 物流快递板块上涨9.1%，其中跨境物流、快递涨幅均在12%-13%区间，原材料供应链上涨9%左右；跨境物流上涨核心驱动为煤炭运输需求拉动嘉友国际股价上涨，快递上涨核心驱动为竞争格局改善。"}, {"label": "相关标的", "text": "春秋航空、白云机场、大秦铁路、中远海控"}], "source": "private", "stocks": "春秋航空、白云机场、大秦铁路、中远海控"}]}, {"name": "总量", "emoji": "总", "overview": "美7月非农意外转负强化9月停加息预期，美股道指标普创新高；伯克希尔转净买家建仓Alphabet。", "topics": [{"title": "全球非AI巨头领涨：美债利率回落下的结构机会", "tags": ["收藏", "个股"], "bullets": [{"label": "核心观点", "text": "1. 宏观市场整体判断 当前指数处于3900点位置，仍有向上动力，核心支撑来自美债收益率下调：美国原油、汽油价格向下突破3美元关键位置，远期通胀预期下降，叠加非农数据表现，美债收益率有进一步向下空间，2026年不加息的中性预期将逐步消化加息预期。 2026年8月是政策利好窗口期，市场修复行情确定性较强： 七月底政治局会议定调利好，后续政策将持续落地，北京地产政策已经开始兑现。"}, {"label": "投资逻辑", "text": "美联储加息预期计入过多将逐步回摆，7月美国非农就业数据显著低于预期，且仅政府侧就业下滑，同时非政府侧就业未承压，既给了不加息的理由，也印证美国经济未走弱，成为加息预期回摆的核心支撑。 观望资金已经开始入场：美股、韩股率先回升为A股做多提供支撑，A股成交额触底回升、融资余额触底小幅回升且趋势性较强，资金动能正在修复。"}, {"label": "相关标的", "text": "伯克希尔、Alphabet、微软、台积电"}], "source": "private", "stocks": "伯克希尔、Alphabet、微软、台积电"}, {"title": "美7月非农意外转负：9月停加息预期强化", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "美国7月非农就业数据于8月7日公布，意外录得-2.3万人并大幅下修前值，确认了就业市场趋势性降温。这一变化的核心在于，它为美联储9月暂停加息提供了强力数据支撑，市场随即将加息概率下调至50%以下，为黄金和美债等流动性敏感资产打开了短期上涨窗口，但就业数据所揭示的需求破坏也预示着未来企业盈利将面临更大侵蚀。"}, {"label": "私域纪要", "text": "1. 美国7月非农就业数据情况 就业人数：7月新增非农就业人数减少2.3万人，远低于市场预期的8万人；5月、6月新增非农就业人数合并下修10.3万人；私营部门非农就业人数增加3万人，不及市场预期的8.2万人。 失业率与劳动参与率：7月失业率降至4.1%，低于前值及市场预期的4.2%；但7月劳动参与率降至61.4%，低于前值的61.5%及市场预期的61.6%，失业率下降主要源于用工需求下降、更多人退出劳动力市场，而非就业参与人数增加。 薪资增速：7月时薪同比增速3.2%，低于预期的3.5%；环比增速0.1%，低于预期的0.3%，薪资增长中枢稳步下移，短期难以形成薪资通胀螺旋。"}, {"label": "相关标的", "text": "黄金、美债"}], "source": "hot", "stocks": "黄金、美债"}]}]}, "2026-08-11": {"meta": {"date": "2026-08-11", "weekday": "周二", "run_at": "2026-08-11T07:05:00+08:00", "is_trading_day": true, "window_private": {"start": "2026-08-10T00:00:00+08:00", "end": "2026-08-11T07:05:00+08:00"}, "window_public": {"start": "2026-08-10T00:00:00+08:00", "end": "2026-08-11T07:05:00+08:00"}, "private_counts": {"favorite": 97, "appointment": 0}, "topic_count": 42, "notes": ["私域窗口T-1(08-10 00:00)至今", "蓝宝书国内08-10批次3", "国际蓝宝书08-10", "纪要热度榜08-11", "私域入种子未逐条铺卡", "分类按正文", "正文整句收尾", "无说明板块"]}, "industries": [{"name": "AI链", "emoji": "AI", "overview": "英伟达30亿投资Lancium锁定AI电力，资本开支沿\"算力→电力\"扩散；海外大行大幅上调AI-PCB/CCL规模预测，Rubin平台全液冷Q3量产，三环高容MLCC拟再涨价30%，味之素缩减ABF供给三成催化国产替代，玻璃基板/半导体测试机零部件国产化线索密集。", "topics": [{"title": "【电子】研究框架", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "天风证券 | 【电子】研究框架", "text": "电子行业2026年投资主线：2026年电子行业核心投资主线为AI技术创新与国产自主可控，两大主线存在交叉，自主可控方向机会主要由AI相关产业发展带动。｜AI产业迭代阶段及核心要求：AI产业正从训练时代向推理时代，再向Agent智能体时代迭代，不同阶段对硬件需求存在差异： 训练时代核心逻辑为算力至上。推理时代对存、算、电、联四大维度提出均衡且更苛刻的要求。｜存领域投资机会：推理工作负载下，存储是最大增量，Decode阶段的内存带宽瓶颈使HBM成为决定推理性能的关键组件，当前HBM在AI芯片组件总支出中的占比已超过一半。全球存储龙头海力士、三星、美光均在围绕HBM迭代升级，相关配置率快速上行，国内相关产业链也存在投资机会。A股相关受益标的：长鑫、长存产业链、兆易创新等。"}, {"label": "私域纪要", "title": "天风证券｜【电子】研究框架", "text": "电子行业核心投资主线：2026年电子行业核心投资主线为AI技术创新、国产自主可控，二者存在交叉，自主可控机会将围绕AI相关产业发展被带动。AI产业发展阶段从训练时代向推理时代、agent时代迭代，不同阶段对硬件需求存在结构性差异，将带动电子板块多硬件方向的投资机会。｜存储：推理时代对存、算、电、联四大维度提出均衡且更苛刻的要求，其中存储带宽容量是推理性能的首要瓶颈，HBM是决定推理性能的关键组件。HBM在人工智能芯片组件总支出中的占比已超过一半，海外海力士、三星、美光为主要供应商，国内产业链相关厂商存在投资机会。｜算力：推理时代算力架构正从单一GPU向GPU+ASIC混合计算演进，ASIC针对特定模型架构优化，在能效比和单位推理成本上具备显著优势，全球谷歌TPU、亚马逊T系列、Meta ASIC等均在推动推理侧ASIC芯片配置，相关市场规模高速增长，算力芯片呈现结构性放量。"}], "source": "private", "stocks": ""}, {"title": "电容行业深度：芯片侧供电升级，MLCC量价弹性先行", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "东吴电新｜电容行业深度：芯片侧供电升级，MLCC量价弹性先行", "text": "电容行业整体需求与市场空间：数据中心供电架构对应6类电容，不同电容应用场景和性能差异明确： 柜外超级电容：微秒级响应，断电补能、瞬时功率补偿，为服务器功率提升带来的新增需求品类。柜内电源侧：薄膜电容在PSU外起稳压滤波作用，800V架构下单柜仅需1颗，SST架构下用量大幅提升；牛角电容（铝电解电容）在PSU内过滤低频波。｜MLCC行业基本面与投资相关信息：产品定位与需求逻辑：MLCC贴装于GPU、CPU附近，承担高频去耦、瞬时补能、局部稳压功能，服务器功率升级带动量价双升，同时拉动高端MLCC需求。行业供需与格局： 传统市场：成熟赛道，年产能约6万亿颗，年需求4-5万亿颗，下游集中在消费电子、汽车电子、通信、工业能源等领域。｜钽电容行业基本面与投资相关信息：产品特性：容量大、体积小，通常与MLCC搭配使用；AI服务器采用聚合物钽电容路线，其电阻低、高纹波高频性能更适配场景，当前聚合物钽电容占总钽电容需求的25%-30%，主要应用于消费电子与AI服务器；固态钽电容占比60%-70%，多用于军工、工业领域；湿钽电容占比5%-10%，价格高，多用于航天航空。"}], "source": "private", "stocks": ""}, {"title": "算力时代“芯”设计！更纯粹更锋利？", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "算力时代“芯”设计！更纯粹更锋利？", "text": "全球半导体行业周期与景气度：本轮半导体行业是AI驱动的高景气上行周期，2023年随英伟达AI芯片需求爆发启动，2025年下半年至2026年景气度进一步提升，除稼动率恢复外还出现涨价、供不应求的情况，存储芯片涨价、传统逻辑晶圆厂稼动率处于高位，是景气度达到极高点的标志。｜芯片设计行业特征与赛道格局：芯片设计处于半导体产业链下游，核心特点是距离下游客户最近，业绩表现与下游需求绑定程度高： 逻辑芯片（CPU、GPU等）中，AI相关芯片处于高度景气状态，消费类逻辑芯片存在波动； 存储芯片是周期性最显著的赛道，涨价是驱动其定价和业绩变化的核心因素； 成熟制程芯片（电源类、功率类等）中，开展AI化转型的公司成长曲线更清晰，未转型公司业绩波动更大、成长确定性较弱。｜国产芯片设计行业发展现状：国产芯片替代分为两个阶段：2018-2021年以中低端芯片突破为主，核心是解决自主可控基本需求，覆盖MCU、模拟芯片、消费电子小逻辑芯片等品类；2023年至今进入高端突破阶段，核心是在技术封锁背景下发展国产AI产业，技术难度和远期市场天花板远高于上一轮替代周期。"}], "source": "private", "stocks": ""}, {"title": "英伟达Rubin平台将全面采用液冷散热", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "随着英伟达Rubin平台于近期进入量产并开始向OpenAI等头部客户部署，其100%全液冷架构已从规划蓝图转为三季度即将出货的既定事实。投资视角正从此前的主题叙事转向对产业链订单和业绩兑现的强现实预期，液冷从可选方案升级为AI算力基础设施的必选项，其高壁垒的供应链认证体系将加速订单向头部核心供应商集中。"}, {"label": "私域纪要", "title": "国金证券 | VERA RUBIN，最佳进攻路线——掘金AI算力电话会议第49期", "text": "AI：PCB行业趋势与投资要点 行业景气度与业绩趋势：AI PCB行业高景气确定性强，上半年拉货节奏放缓不改变行业本质，下半年业绩环比增速加速趋势明显。产品价值量提升： 英伟达Vera Rubin单GPU的PCB价值量增幅超过100%，谷歌V8系列相对V7价值量增长400%以上，乘数效应进一步显现。｜英伟达Vera：Rubin产业链投资要点 产品核心优势：Vera Rubin机柜相比上一代Grace Blackwell性能提升10倍，token吞吐效率为GB的10倍，单token成本降低至之前的1/10，投资回报周期大幅缩短：模型厂商采购服务器回本周期最快仅10个月；1G瓦数据中心建设成本约500亿美金，头部模型厂商可通过token销售实现1年回本，xAI建设的1G瓦算力也可实现年入300亿美金。｜mSAP：PCB设备行业投资要点 行业边际变化：1.6T光模块PCB线宽间距要求达到15微米以下，原有工艺无法满足，mSAP工艺因电镀均匀性、刻蚀精准度达标成为确定性方案，将受益于1.6T放量带来的需求增长。"}, {"label": "私域纪要", "title": "西部郑宏达 | 英伟达更新会议纪要", "text": "英伟达Rubin架构产品基本情况：量产与需求情况：Rubin架构产品2026年7月已开始对外量产和部署，传统CSP、新型云厂商均已开始接收Rubin系列机柜交付；同期GB200、GB300出货量无明显下滑，体现下游需求十分旺盛。｜存储产业链相关趋势：HBM价格趋势：产业链跟踪显示，2027年DRAM整体ASP预计上涨20%-30%，HBM价格较原有预测可能再翻倍，达到当前价格的2.5倍，具体涨幅仍需持续观察。｜PCB环节：ABF载板增量：Rubin系列单颗芯片对应的ABF基板面积相比Blackwell提升约40%，从接近5000平方毫米上升至6000-6700平方毫米，同时层数快速增加，单颗芯片对应ABF载板价值量约为Blackwell的2倍；随着HBM在BOM中占比下降、整体出货量上升，PCB市场空间将被进一步打开。"}, {"label": "相关标的", "text": "必选项、英维克、同飞股份、金富科技、五洋自控、飞龙股份、大元泵业、裕同科技"}], "source": "hot", "stocks": "必选项、英维克、同飞股份、金富科技、五洋自控、飞龙股份、大元泵业、裕同科技"}, {"title": "传三环集团高容MLCC拟再涨价30%", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "截至8月10日，产业渠道信息显示，三环集团已于上周五通知执行新一轮涨价，其高容MLCC产品目标涨幅或达30%，这印证了国内龙头在海外大厂保守扩产背景下的强定价权。此举领先于市场原先预期的三星、太诱等海外厂商的调价节奏，表明由AI驱动的MLCC景气周期正加速兑现，国内厂商的盈利弹性释放将因此显著提前和放大。"}, {"label": "相关标的", "text": "风华高科、火炬电子、洁美科技、国瓷材料"}, {"label": "私域补充", "text": "另收藏纪要：半导体零部件景气度高企，坚定看好华亚智能；半导体设备推荐：为什么我们看好测试机环节…；鸿路钢构深度汇报：量价齐升，格局优化；力源信息2026年中报业绩说明会；NPO——光的新增量；东威科技中报电话会；星对话-北交所精新汇系列 - 晶赛科技-…；AI 算力框架-海外与国产共振等"}], "source": "hot", "stocks": "风华高科、火炬电子、洁美科技、国瓷材料"}, {"title": "AI芯片用PCB及上游材料需求旺盛", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "近期（8月7日）海外大行大幅上调AI服务器PCB/CCL市场规模预测，将2027年PCB市场预期上调38%并给出2028年翻倍以上的增长指引，这不仅量化了从GB300到Rubin平台升级带来的PCB层数、材料、面积全方位价值量通胀，更确认了整个产业链正进入由ASIC和GPU共同驱动、上游材料供给紧张支撑的量价齐升的景气高点。"}, {"label": "相关标的", "text": "胜宏科技、景旺电子、沪电股份、四会富仕、生益科技、东材科技、平安电工、联瑞新材、铜冠铜箔、大族数控"}], "source": "hot", "stocks": "胜宏科技、景旺电子、沪电股份、四会富仕、生益科技、东材科技、平安电工、联瑞新材、铜冠铜箔、大族数控"}, {"title": "传味之素缩减大陆ABF膜供给三成", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月10日产业链传出全球龙头味之素缩减大陆ABF膜供给三成，将AI芯片需求驱动的供需失衡预期，直接升级为现实的供应链断点风险。这一变化的核心是为ABF膜的国产替代进程提供了最强催化剂，市场逻辑从远期的“替代可能”迅速切换至对“谁能率先量产”的争夺，具备客户验证和产能基础的公司估值逻辑发生质变。"}, {"label": "相关标的", "text": "谁能率先量产、华正新材、激智科技、天和防务、莲花控股、宏昌电子"}], "source": "hot", "stocks": "谁能率先量产、华正新材、激智科技、天和防务、莲花控股、宏昌电子"}, {"title": "半导体设备国产化关注测试机与零部件", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "过去24小时内，市场在经历前期调整后，投资逻辑重新聚焦于半导体设备国产化的核心瓶颈环节，AI驱动的算力、存储及先进封装扩产趋势并未改变，产业链的关注点正从普涨转向结构性机会，尤其是测试设备和核心零部件这两个国产化率低且需求通胀最确定的方向。投资视角下，这一变化意味着资本将更集中于具备“需求高增+国产化率提升”双击效应的标的，测试环节因其在AI和先进封装中价值量通胀的属性被视为弹性最大的方向，而核心零部件则因其“卡脖子”属性和供应链安全价值，被看作是产业链自主可控的基石。"}, {"label": "相关标的", "text": "长川科技、华峰测控、联讯仪器、芯碁微装、思泰克、富创精密、新莱应材、超纯应材、高凯技术"}], "source": "hot", "stocks": "长川科技、华峰测控、联讯仪器、芯碁微装、思泰克、富创精密、新莱应材、超纯应材、高凯技术"}]}, {"name": "大制造", "emoji": "制", "overview": "2026H1全球人形机器人出货1.9万台同比+272%、中国厂商占超97%，产业从主题转向核心零部件价值重估；大炼化受油价回落+旺季修复盈利，染料淡季逆势普涨、纸厂再提价50元，制造端结构性α延续。", "topics": [{"title": "AI系列深度04期：什么是表征？", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "东吴汽车 | AI系列深度04期：什么是表征？", "text": "表征核心定义与分层：表征是AI完成识别、生成、推理和控制的基础，指AI将现实世界编码为机器可计算的内部表征的过程，本质是机器对世界的认知视角，不同AI应用领域处理的信息形式不同，表征逻辑存在差异。｜表征技术演进阶段：符号AI时代（1950年代-1990年代）：通过纯人工规则构建可解释性强的表征，知识以符号和规则形式存在，局限性在于所有知识需要人工编码，难以覆盖现实世界的模糊性、例外场景，扩展性极弱。｜表征领域产业现状与投资分析建议：目前表征领域仍存在较多待解决痛点，包括机器是否能通过表征真正理解世界、表征坍塌等问题，产业界和学术界对物理AI场景下“如何统一表征、什么是好的表征”仍存在较大分歧，该分歧对自动驾驶、机器人领域的模型长期效果会产生显著影响。"}, {"label": "私域纪要", "title": "东吴汽车 | AI系列深度01期：从数字AI通用底座到物理AI真实世界闭环", "text": "AI技术演进框架与通用底座发展：AI发展阶段划分：AI 1.0时代核心成果为图像识别、语音识别、目标检测等单点任务精度显著提升，但不同任务对应独立模型与工程链条；Transformer开启的AI 2.0时代拓展了任务广度、复杂度与任务链长度，实现单模型可学习知识、迁移任务、理解复杂指令。｜Transformer作为通用底座的核心机制与演进 Transformer的核心优势：Transformer内置归纳偏置弱，更多关系通过数据、算力、训练目标学习得到，支持并行训练，可更充分利用大规模数据与算力；当数据和算力规模足够时，减少人工先验可让模型在更广泛任务中自行学习规律，打开能力上限。｜Transformer在不同场景的落地路径 语言场景：最先跑通通用底座：语言任务是Transformer原生应用场景，演进分为三个阶段：架构确立阶段（自注意力取代RNN递归架构，建立可并行序列建模架构）、范式统一与规模化阶段（预训练+微调成主流，理解与生成任务统一为文本到文本，自回归模型通过规模扩展获得更强通用能力）、对齐与推理阶段（指令微调、人类偏好对齐提升可用性，复杂推理、工具调用、推理时计算拓展能力边界）。"}, {"label": "私域纪要", "title": "东吴汽车 | AI系列深度02期：AGI是什么？", "text": "AGI等级划分与产业路径分歧：AGI等级划分逻辑：DeepMind对AI性能从深度上划分为6个等级，L0为无AI，L1能力略优于普通技能一般的人，L2可胜任成年人50%的任务，L3达到专家系统水平，L4达到大师级能力，L5实现超越人类；同时DeepMind还将通用性（AI可覆盖任务的广度）作为核心评价指标。｜AGI落地预期与时间表：目前准确预测AGI落地时间的实际意义有限，不过无论是乐观派还是保守派，人类通往AGI的预期时间表都在持续提前：乐观派认为2027-2028年（会议时间的未来2年）就可能出现AGI，审慎派则认为还需要10年左右的周期。｜AGI的社会经济价值测算：当前针对AI/AGI的社会经济价值主要有3类测算方式： 比例增加法：自下而上拆分生成式AI在各细分场景的提效、增收、降本贡献，汇总得到年度经济价值。该方法下有观点认为生成式AI每年可带来2.6-4.4万亿美元的增加值，价值贡献主要集中在客户运营、营销、软件工程、研发四大职能领域。"}], "source": "private", "stocks": ""}, {"title": "制冷剂行业深度报告之三：全球配额重塑制冷剂价值，AI材料开启氟化工新时代", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国海化工｜制冷剂行业深度报告之三：全球配额重塑制冷剂价值，AI材料开启氟化工新时代", "text": "三代制冷剂行业供需与趋势：核心供需缺口预测：R32制冷剂内用缺口持续扩大，2026年缺口为2.31万吨，2027年达3.13万吨，2028年将增至4.05万吨，供需紧张趋势逐年强化，为价格中枢上行提供基础 其他主流品种供需情况： R125从供给紧张转为小幅宽松，但仍存在缺口 R134A当前缺口不足1万吨，2026年供给约过剩5000吨，2028年将转为缺口0.25万吨，外贸缺口同步扩大，全球供需持续偏紧 政策与配额情况： 全球已有163个国家加入基加利修正案，制冷剂配额成为全球性稀缺资产 我国2024年起实施三代制冷剂配额生产，2027年配额征求意见稿已发布，总量与2026年基本一致，总配额18.53亿吨二氧化碳当量，其中内用生产配额约8.95亿吨，进口配额0.1亿吨，出口不受管控 2026年已下发配额14.64亿吨二氧化碳当量，剩余3.89亿吨由生态环境部持有，主要用于满足半导体等新兴行业增长需求，大概率不会下发至普通制冷领域 配额调整规则：同品种三代制冷剂配额可在企业间等量调整，单品种累计调整增量不得超过企业该品种配额的30% 2026年三代制冷剂生产配额共下发近80万吨，R32、R134A、R125三个主流品种合计占比达88.36%；其中R125单位GWP值为3500，配额占GWP总配比约40% 供给端现状：经过2024-2026年3年配额管控，工厂库存处于历史低位，企业主动控制开工率，供给紧张格局进一步强化 需求端结构： R32约56%用于家用空调前装市场 R134A近80%应用于汽车领域，其中维修占53%、新车配套占25% R125以混配方式应用于多场景，家用空调为占比最高的领域 下游需求数据（2026年上半年）： 家用空调产量同比下滑4.68%，出口同比下滑4.6% 国内汽车产量约1510万辆，同比下滑3%；出口达531万辆，同比增长50% 冰箱产量约4290万台，同比增长7.82%；冷柜产量约2076.9万台，同比增长18.29% 出口预期：受海外政策调整影响，英美2026年5月宣布推迟三代制冷剂削减政策，应用限制平均放宽2-3年，叠加国际物流预期恢复，2026年下半年制冷剂出口将好于上半年 生命周期与景气预期： 海外政策延长三代制冷剂全球生命周期，未来十年仍将是主流制冷剂产品，景气周期拉长，价格中枢上行持续性增强 2024年配额制实施以来三代主流制冷剂价格持续上行，2026年涨幅有所缓和但仍保持上行趋势，预计未来几个月将出现明显大幅上涨｜制冷剂替代产品现状：二代制冷剂：2025年已削减67.5%，新装领域已无应用，需求仅来自存量维修市场且持续萎缩，2026年配额过剩2.88万吨，2028年将增至4.7万吨，价格未来趋势下行；竞争格局集中，东岳、巨化、梅兰新材料三家占比达76.81% 四代制冷剂： 环保层面存在缺陷，特定条件下会产生永久性化学品三氟乙酸（TFA），可能在生物体内累积 性能层面容积制冷量仅为三代制冷剂的约50%，相同制冷需求下用量是三代的2倍，需通过与三代制冷剂混配改善性能，主流产品R454B中R32占比近70% 专利目前由海外霍尼韦尔、科慕等企业主导，国内处于起步阶段，自主研发已取得突破，预计到2028年底国内规划产能约14万吨 天然工质制冷剂：存在易燃易爆、工作压力高的缺陷，家用密闭空间应用推广受限 替代综合结论：二代、四代、天然工质制冷剂均存在明显缺陷，三代制冷剂暂无理想替代品，长期仍将是市场主流｜氟化工新材料行业发展：氟化工产业链下游四大方向：无机氟化物（氟化盐）、氟碳化学品（制冷剂）、含氟精细化学品（应用于农药、制药、半导体液冷等）、含氟聚合物（应用于半导体、锂电、光伏等，为当前景气扩散方向） 核心含氟新材料产品情况： 聚四氟乙烯（PTFE）：具备极低介电常数和介电损耗，未来有望应用于先进封装体系；当前国内产能以中低端产品为主，2025年表观消费量约11万吨，头部企业集中度高，巨化、昊华等占据主要市场份额 可溶性聚四氟乙烯（PFA）：耐几乎所有化学品，使用温度范围-10℃至260℃，电绝缘性不受温度影响，80%产量应用于半导体领域，当前海外科慕、大金占据70%以上市场份额；国内加速布局，2026年巨化股份万吨级高纯PFA装置投产并通过半导体客户验证 电子级氢氟酸：半导体制造核心湿电子化学品，2026-2030年国内消费量复合增速达13%以上；按纯度分为5个等级，最高级为G5级，目前国产替代加速，国内头部5家企业收入占比接近97.6%，竞争格局集中 聚偏氟乙烯（PVDF）：受益于新能源发展，2024年底锂电池领域应用占比已超35%，成为第一大应用领域，未来需求增长稳定 全氟乙丙烯（FEP）：2025年底至2026年价格涨幅超40%，行业景气度上行 行业趋势：氟化工景气度向全产业链扩散，含氟新材料成为行业第二成长曲线，在AI算力、半导体国产化趋势驱动下长期成长空间广阔"}], "source": "private", "stocks": ""}, {"title": "花语新声第38期：储锂价值依旧，光伏反内卷升级", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江电新 | 花语新声第38期：储锂价值依旧，光伏反内卷升级", "text": "电新行业整体投资观点：当前板块估值与性价比：7月中旬以来重点推荐的电新板块底部价值标的近期有小幅反弹，当前对应2026年估值约16-17倍，对应2027年估值约12-13倍；结合行业20%-30%的整体综合增速，部分细分赛道增速更高的背景，板块当前性价比非常突出，继续重点推荐锂电、储能领域的价值标的，同时提示光伏反内卷、AI+机器人相关赛道的边际机会。｜短期基本面情况：排产与价格走势： 短期排产平稳推进，9月排产预计有进一步小幅提升；产业链价格整体稳中有升，其中电芯、隔膜、负极价格相对平稳，电解液成品、六氟磷酸锂、VC等产品价格出现上涨，个别环节价格小幅回落不影响整体向上趋势，对短期基本面形成支撑。｜投资方向与标的：主链价值标的：当前估值已具备较高性价比，龙头宁德时代、璞泰来、尚太科技等标的，在2027年量增、价稳、盈利平稳的假设下，对应2027年估值仅12倍左右。细分新方向： 铜箔：标的经过前期调整后估值已具备支撑，重点推荐铜冠铜箔、嘉元科技。"}], "source": "private", "stocks": ""}, {"title": "特斯拉FSD迎无人化与规模化拐点", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "截至8月10日，特斯拉FSD已迎来无人化与规模化的关键拐点，其在德州多城部署的数十辆主驾无人、全程无监管Robotaxi，已验证了基于量产车硬件的端到端模型的可行性。这一进展将投资逻辑的焦点从技术路线之争彻底转向规模化落地和数据飞轮的执行效率，不仅直接利好特斯拉自身，更重要的是系统性重估了整个自动驾驶赛道的估值锚，因为国内技术同源的头部玩家将从“追随者”叙事转变为“同台竞技”。"}, {"label": "私域纪要", "title": "东吴电新｜阳光电源：光储全球标杆，发力AI迎新机", "text": "公司核心基本面与竞争优势：核心技术平台优势：公司深耕电力电子领域多年，围绕电力电子技术打造 HK） 2026中报业绩解读会", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国金计算机 | 希迪智驾（3881.HK） 2026中报业绩解读会", "text": "2026年上半年核心财务表现：2026年上半年公司实现营业收入8.04亿元，同比增长97%；毛利2.12亿元，同比增长超2倍；毛利率由2025年同期的17.1%提升至26.4%。经调整净亏损由2025年同期的1.11亿元大幅收窄至2026年上半年的1968万元，接近盈亏平衡。｜无人矿卡业务：订单与交付：2026年2月与广纳集团签订500辆无人矿卡采购订单；截至2026年6月底，无人矿卡累计出货量超1900台，覆盖全球近40座矿山。在手订单：不含海外的整体在手订单为20亿元，其中80%为自动驾驶业务（含无人矿卡、无人重卡）。｜无人重卡业务：落地进展：已从矿区封闭场景延伸至园区、港口、通关口岸、干线物流等场景，中越浦寨口岸的无人驾驶集卡车队已常态化运行，成都国际铁路港无人驾驶集卡运输方案处于常态化运行测试阶段。"}, {"label": "私域纪要", "title": "爱芯元智（0600.HK）2026年中报业绩交流会", "text": "2026年上半年整体经营业绩：营收：2026年上半年实现营业收入4.02亿元，同比增长182%，三大核心业务均实现大幅增长。盈利：2026年上半年实现毛利1.17亿元，同比增长308%；毛利率从2025年同期的20%提升至29%；经调整Non-IFRS亏损5.4亿元，亏损率同比显著收窄。｜边缘AI业务：业绩表现：2026年上半年实现收入2769万元，同比增长252%，增长核心驱动力为出货量大幅提升。应用落地场景： 存量设备升级：推出AX8850标准化算力卡，采用M.2、PCIE等通用接口，客户无需重新设计硬件即可即插即用，已在智慧教育、智慧工业、AI NAS、AI PC等场景批量落地。｜智能汽车业务：业绩表现：2026年上半年实现收入2909万元，同比增长52.1%；智能汽车SOC芯片出货量达42万颗，2026年上半年新增量产车型定点24个，截至2026年6月底已合作24个主机厂品牌，其中含7个国际/中外合资品牌，已跻身国内智能驾驶芯片第一梯队。"}], "source": "private", "stocks": ""}, {"title": "周周观点更新", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "东北计算机｜周周观点更新", "text": "市场主线与投资方向总览：当前A股科技板块经过长期回调后，技术升级线正逐步成为科技板块主线 涨价链第二阶段可分为两条演绎路径： 通胀驱动的涨价链 技术升级带来的涨价链，持续性将强于第一阶段单纯通胀驱动的涨价，相关方向包括存储、PCB、mSAP、MLCC等，第二阶段将逐步向新高方向发展 0到1的新技术渗透方向：AI应用FDE模式推广、机架式散热、SST等，叠加2026年下半年Rubin、Vera Rubin、2027年Rubin Ultra架构更新，以及谷歌v9技术迭代，新技术渗透速度或快于市场预期｜AI模型与FDE领域进展：开源模型商业化进展： DeepSeek计划大幅上调API价格，千问、Kimi正积极探索大型商业用户收入分成，开源模型已从低价获客阶段转向生态变现阶段，前期靠低成本私有化、快速二次开发扩大开发者生态，形成规模后通过API云服务、收入分成兑现价值 随着开源模型能力接近闭源，国内大模型价格内卷有望趋缓，具备强商业模型能力、商业化兑现能力，且拥有一定算力效率的厂商将更受益 市场分层趋势：开源与闭源预计形成分层市场，开源模型将承接低成本、可定制、私有部署等标准化任务，闭源模型将承接复杂高价值任务，企业可动态选择适配方案 FDE领域发展： 企业AI竞争已从外部模型比拼进入工作流改造阶段，OpenAI、Auto正持续招聘、培训FDE参与客户模型部署 基础模型能力差距逐步缩小后，模型厂商的软件know-how与企业交付能力重要性持续提升，两类厂商将受益：一是拥有存量客户资源的传统软件转型公司，可通过FDE深挖企业客户价值；二是FDE基础平台供应商，可为全行业FDE驻场交付提供底层支撑｜光通信领域进展：上周光通信板块反弹的三大核心驱动因素： AI回报率提升速度远超预期，云与AI收入实现大幅增长 Scale up场景下光互联价值占比大幅提升 FCC针对中国光通信的限制仍处于远期规划阶段，美国对中国光通信产品依赖度仍较高 NPO进展与增量机会：我国NPO正处于快速放量阶段，下一轮光通信爆发增量将来自NPO带动的光源、无源光器件需求上行，NPO与CPO将大幅拉动FAU类无源器件需求，建议关注下游客户为Coherent、Lumentum等海外厂商的公司，重点推荐光库、杰普特"}], "source": "private", "stocks": ""}, {"title": "长江计算机&医药创新链：AI4S，下一个大场景", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江计算机&医药创新链：AI4S，下一个大场景", "text": "AI：for Science行业发展趋势与行业逻辑 行业发展背景：2026年是北美大模型厂商重点开拓coding之外新增量垂类的关键时间节点，AI for Science（尤其是AI制药）是其核心发力方向之一，该赛道具备“客户付费意愿强、行业数字化积淀深厚”的特性，同时能够通过技术创新创造增量市场价值，而非仅替代人力。｜AI制药行业发展与拐点判断：行业拐点特征：当前AI制药正处于突破拐点的阶段，核心标志并非已经产出验证有效的新药，而是行业开始朝向构建数据闭环链路发展，AI对分子设计环节的效率提升已经率先创造了爆发式的上游需求。｜药物发现阶段（当前核心受益环节）：大分子领域： 核心受益赛道为基因合成、蛋白表达、蛋白质表征测定，全球龙头为金斯瑞生物科技和Twist，其中金斯瑞的市场占有率高于Twist，具备工艺、良率、交付速度、成本的多重壁垒：其定制化仪器和成熟工艺可实现大规模批次交付，良率更高、成本更低，交付周期最快仅4天，是大模型厂商迭代的核心合作方。"}], "source": "private", "stocks": ""}]}, {"name": "医药", "emoji": "药", "overview": "美法院批准药明康德1260H禁令暂缓，CXO地缘风险阶段性缓释、订单加速兑现；甘李GLP-1欧洲达成58亿授权打开出海曲线，康诺亚CM512二期成功，AI4S商业化提速放大上游实验需求。", "topics": [{"title": "医疗器械  - 关注板块超跌反弹机会，重视“出海+科技”双主线", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国信医药 | 医疗器械  - 关注板块超跌反弹机会，重视“出海+科技”双主线", "text": "医疗器械板块整体基本面与资金面情况：基本面现状：2025年以来医疗器械板块缺乏板块性贝塔机会，各细分赛道国内业务均承压： 耗材受医保控费、集采、反腐影响较大； 设备受制于财政资金紧张、行业渠道库存调整； 体外诊断受DRG集采、收费调整冲击； 消费属性器械面临消费疲软、竞争加剧压力； 板块整体基本面目前处于筑底阶段，仅少数领域景气度较好：电生理行业受益于治疗渗透率提升、进口占比高、技术迭代快保持较快增长；骨科板块因集采全覆盖、影响出清，景气度有所恢复。｜手术机器人板块：行业基本情况：手术机器人是外科领域第三次技术革命，核心价值为拓展医生能力边界，降低复杂手术操作门槛、缩短医生学习曲线；2024年美国机器人手术占比已超过40%，而国内目前仅为个位数，成长空间广阔；腔镜机器人为“剃须刀+刀片”商业模式，设备装机后会伴随手术量提升带来稳定的耗材、维保流水收入；未来行业将向远程诊疗应用、AI技术融合、机器人自主化手术方向发展，国内政策红利将催化渗透率提升。｜隐形正畸板块（时代天使）：业务属性：隐形正畸为高度复杂的系统工程，覆盖治疗方案设计、定制化生产、生物力学与材料研发、软件算法、临床支持、物流交付等全流程，需要通过真实病例和临床反馈迭代产品，医生品牌认可度建立周期长。"}], "source": "private", "stocks": ""}, {"title": "胰岛素行业专题", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国金医药 | 胰岛素行业专题", "text": "胰岛素行业整体趋势与集采影响：国内胰岛素市场规模变化： 集采前2021年达峰值接近300亿人民币，2022-2023年随集采落地缓步下行，2023年市场见底，2023年底起恢复缓慢增长，2025年已突破200亿人民币。首轮集采执行后第二个年度，胰岛素整体用量提升将近40%，以价换量效果显著。｜诺和诺德中国市场产品结构参考：集采后存量品种表现：2020-2025年，诺和诺德中国区集采品种规模缩减近60%，但胰岛素部门整体收入仍维持在100亿人民币左右。豁免集采品种贡献： 德谷门冬双胰岛素2025年中国市场收入超过30亿人民币，德谷利拉鲁肽收入接近20亿人民币，两款品种因首轮集采时为独家品种未被纳入集采，享有自主定价权。｜胰岛素出海机遇：全球市场格局：2024年全球胰岛素市场规模约1000亿人民币出头，美国占400多亿、中国约200亿、欧洲规模与中国接近，中美欧合计占全球80%以上市场份额；拉美、东南亚、中东、北非等新兴市场糖尿病发病率高，但胰岛素市场规模小，存在大量未满足临床需求。"}], "source": "private", "stocks": ""}, {"title": "医药早8点：制药及产业链最新观点", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "中信建投 | 医药早8点：制药及产业链最新观点会议纪要", "text": "创新药板块核心观点：行业发展逻辑：创新药国际化进入2.0阶段 中国创新药从单纯BD授权出海转向深化阶段，一是全球三期临床结果陆续读出，部分产品进入BLA（上市申请）阶段，预计2027年将有创新药在美国产生正式商业化收入；二是从简单BD转向与跨国药企的紧密战略联盟，代表案例为恒瑞医药与BMS的合作、信达生物与辉瑞的合作，头部创新药企业全球化水平将进入新高度。｜CXO板块核心观点：行业整体判断：处于内外需共振修复通道，估值处于历史低位，具备显著配置价值 行业beta与个股alpha同步显现，业绩、订单持续验证高景气。｜AI制药（AIDD）板块核心观点：行业拐点：从概念验证走向商业化兑现 临床验证突破：薛定谔与武田合作的AI研发分子已在2026年实现三期临床成功，且与同靶点现有药物头对头达到优效；中国英矽智能全球首款AI驱动发现的特发性肺纤维化候选药物S3001055正式启动三期临床，实现从靶点发现到二期临床读出的AI全链条驱动，行业“AI能否做出好药”的质疑被打破。"}], "source": "private", "stocks": ""}, {"title": "甘李药业GLP-1在欧洲达成58亿元授权", "tags": ["收藏", "热点", "个股"], "bullets": [{"label": "核心事件", "text": "8月10日的最新市场讨论聚焦于甘李药业的三款胰岛素类似物在2026年上半年全部获得欧盟批准后，其出海战略的正式落地。这一进展被视为公司估值重估的关键拐点，因为它标志着公司增长逻辑从依赖国内集采转向开启高价值的欧美市场作为第二增长曲线，通过承接国际巨头收缩的产能来获取全球份额。"}, {"label": "相关标的", "text": "甘李药业、通化东宝、东阳光、联邦制药、恒瑞医药"}, {"label": "私域补充", "text": "另收藏纪要：报业绩催化板块上行，把握CXO和AI制药…；沛嘉医疗业务更新电话会；【医药】研究框架；AI制药主题投资策略：从模型跃迁到实验闭…；系列一：AI+制药：从降本增效到分子创新…；药明康德深度：新分子业务快速放量，一体化…"}], "source": "hot", "stocks": "甘李药业、通化东宝、东阳光、联邦制药、恒瑞医药"}, {"title": "药明康德获美法院初步禁令暂缓1260H认定", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "美国时间8月7日，美国哥伦比亚特区联邦地区法院批准了药明康德的初步禁令申请，以国防部证据可能存在严重事实错误为由，在诉讼期间暂缓执行1260H清单认定。此项裁决是关键的阶段性胜利，暂时消除了市场最主要的政策风险之一，市场焦点有望从地缘政治噪音回归到公司强劲的订单增长和持续提升的盈利能力上。"}, {"label": "相关标的", "text": "药明生物、药明合联、康龙化成、凯莱英、晶泰控股、百普赛斯、皓元医药"}], "source": "hot", "stocks": "药明生物、药明合联、康龙化成、凯莱英、晶泰控股、百普赛斯、皓元医药"}, {"title": "AI赋能科学发现AI4S商业化加速", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "在过去24小时，AI赋能科学发现（AI4S）已从概念转向商业化加速，标志性事件是平台型公司开始从项目制转向可规模化的订阅服务模式，同时美国上游“卖铲人”公司Twist因AI驱动的订单激增而业绩超预期。核心投资逻辑在于，AI大幅提速了药物、材料等领域的“设计”环节，从而引爆了对后续“构建-测试”物理实验环节的需求，因此，提供自动化湿实验（wet-lab）基础设施和高通量合成验证服务的公司，作为研发闭环中不可或缺的物理世界接口，成为最直接和最先兑现收入的受益方。"}, {"label": "相关标的", "text": "晶泰控股、金斯瑞生物科技、药明康德、华大智造、中科曙光、华兰股份"}], "source": "hot", "stocks": "晶泰控股、金斯瑞生物科技、药明康德、华大智造、中科曙光、华兰股份"}, {"title": "康诺亚长效双抗CM512二期临床成功", "tags": ["热点", "个股"], "bullets": [{"label": "核心事件", "text": "康诺亚于8月10日公布其长效双抗CM512二期临床数据，成功验证了半年给药一次的颠覆性方案，并明确将以此方案推进三期临床。这一结果不仅在慢性鼻窦炎领域展现了对标重磅药物的巨大依从性优势，更关键的是验证了其长效双靶平台的技术价值，为后续哮喘、特应性皮炎等多个大适应症的拓展及海外重磅BD授权奠定了坚实基础。"}, {"label": "相关标的", "text": "海外重磅BD授权、康诺亚、康方生物、信达生物、百济神州"}], "source": "hot", "stocks": "海外重磅BD授权、康诺亚、康方生物、信达生物、百济神州"}]}, {"name": "消费", "emoji": "费", "overview": "能繁母猪延续去化强化2027反转预期；两轮车九号Q2超预期确认行业拐点，SHEIN招股书催化跨境电商分化，轻工出口/家电国补/黄金珠宝框架密集。", "topics": [{"title": "纺服行业估值研究框架", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江纺服丨纺服行业估值研究框架", "text": "纺服行业估值核心框架：纺服行业覆盖上游原料加工、中游代工商、下游品牌零售运营全产业链环节，整体估值呈现越往产业链下游走，估值抬升越明显的特征。估值框架核心选取PE指标，其核心估值因子包含三类： G：企业长期增长率。｜上游环节基本特征：上游加工环节整体制造壁垒较低、客户集中度分散，属于原材料/资本密集型产业，原材料占核心加工企业成本的60%以上，企业间产品效率、经营模式差异较小，盈利方差显著低于中游和品牌端。｜上游两类企业的盈利逻辑差异：天然原材料加工类企业： 核心竞争优势为充裕的优质原材料备料，通常保有4-9个月的库存周期。利润主要来自原材料涨价周期中低价库存的重估红利，体现为原材料与终端售价的价差扩张、利润率提升，典型企业如百隆、华孚等棉纺企业，利润弹性最大的阶段均为原材料上行周期。"}, {"label": "私域纪要", "title": "长江纺服丨纺织服装行业研究框架", "text": "纺织服装行业产业链概况：产业链为链条式生产模式，从原材料→纱线→面料→成衣制造→品牌商→渠道→消费者，交期快速反应已成为行业核心竞争点，国际品牌普遍通过垂直掌控上游产业链（SPA模式）提升运营效率。｜制造端投资分析框架：制造端细分环节差异： 上游纱线、面料环节：属于资本密集型，偏成熟周期/价值行业，受棉价周期影响显著，棉价上涨阶段下游品牌和代工厂会集中锁价补库，带动纱线龙头业绩和股价上升，代表企业包括新野股份、百隆东方。下游成品代工环节：属于劳动密集型，仍具备一定成长性。｜品牌端投资分析框架：中国服装零售市场概况：为全球第二大市场，2019年零售额增速较快曾超过美国成为全球第一，疫情后零售增速放缓。城市层级差异：高线城市已进入成熟消费阶段，仅满足基础功能性需求的品类增速放缓；低线城市品牌消费升级进度慢于高线城市5-10年，服装零售增速高于高线城市。"}], "source": "private", "stocks": ""}, {"title": "跨境电商景气向上，头部卖家或迎经营反转", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "中金公司 | 跨境电商景气向上，头部卖家或迎经营反转", "text": "跨境电商行业发展阶段与格局变化：行业已从高速扩张进入理性成长阶段： 2020-2022年疫情推动线上消费，亚马逊、沃尔玛等平台新增卖家中国占比快速提升；2022年后受中美贸易摩擦、欧美小包直邮政策调整、平台规则趋严、电商扶持退坡、2025年下半年以来税收申报及物流监管收紧等因素影响，中小卖家经营压力提升 2022年起亚马逊新注册卖家数量、活跃卖家占比趋势下降，中国卖家占比从2025年开始进入拐点向下阶段 头部上市卖家经营韧性凸显：国内头部跨境电商卖家（赛维时代、致欧科技、乐歌、华凯易佰、傲基、跨境通、卡罗特等）过去五年收入复合增速维持13%，保持稳健增长 库存压制逐步缓解：2024年行业库存达到历史高位，2025年行业普遍处于低价去库存阶段，制约盈利水平；2026年一季度头部公司库存已回落至正常水位，2026年二季度及以后库存对行业盈利能力的压制将进一步缓解，支撑经营反转 盈利已进入底部反转区间：行业利润率在2025年达到历史低点，2026年一季度开始头部公司盈利能力开启底部反转；后续需关注汇兑、原材料等宏观因素影响，但中长期尾部出清将对头部企业收入提速、利润改善形成明显支撑｜行业增长底层动力与市场空间：行业已成为我国出口核心构成：2025年跨境电商出口额占我国贸易出口总值的8.4%，2020-2025年复合增速达16% 四大核心动力支撑行业持续扩容： 需求端：全球核心经济体呈现K型分化，海外消费者对性价比产品需求持续旺盛，支撑全球电商渗透率提升及中国消费品需求 供给端：2024年中国制造业增加值占全球30%，2025年国内制造业平均产能利用率为75%，产能充足可承接海外性价比需求；长三角、珠三角轻工业发达为行业发展提供支撑 平台端：2022年以来Temu、TikTok等中国跨境电商带动商业模式出海，半托管、全托管模式创新推动中国卖家跟随出海，带动市场扩容与份额提升 政策端：国家明确将跨境电商培育为外贸新动能，贸易、合规、报关报税等维度政策利好持续释放 区域市场增长分化： 成熟市场：2025年我国跨境电商出口目的地中，北美、东盟、欧盟占比分别为18%、23%、24%；2026年美国电商渗透率约17%，预计2030年达21%，2026-2030年市场规模CAGR为7.6%，2025年美国电商平台CR5为67%，亚马逊、沃尔玛等传统电商领先，Temu、TikTok等新兴平台份额快速提升；欧洲2025年起恢复增长，2026-2030年市场规模CAGR约7.8%，东欧增速快于西欧，2025年西欧电商平台CR5为36%，亚马逊以23%份额居首，Temu、阿里进入前十 新兴市场：2025年东南亚电商渗透率仅11%，未来4-5年市场规模CAGR可达12%以上，目前Shopee、Lazada、TikTok三足鼎立，Temu依托全托管模式抢占份额；拉美未来4年行业CAGR约13%，本土电商美客多以26%市占率居首，亚马逊占11%，Temu占4%，2026年82%的巴西消费者购买过中国产品，中国企业拓展具备需求基础 核心出口品类集中：服饰鞋包、数码设备及配件、家用办公电器及配件、家居家纺及厨卫用品为核心品类，2025年货值占比分别为22%、17%、14%｜行业商业模式与核心壁垒：产业链特点：跨境电商产业链长且复杂，信息流、物流、资金流分离，各环节蝴蝶效应明显，供应链交付、库存管理、航运直接影响终端动销与资金周转，海运费、汇率对利润波动影响大，全链路统筹运营壁垒高 卖家价值链拆分：头部跨境卖家利润率普遍处于5%-10%区间，核心成本包括四项： 采购成本：家居、消费电子采购成本占比43%-48%，服饰约为22% 物流成本：分头程（受货物体积、重量、运输方式影响，大体积重货成本更高）和尾程（受品类、重量影响，消费电子、服饰占比偏高） 平台抽佣：受平台规则、品类、品牌份额影响，服饰抽佣最高，赛维时代平台抽佣率达12%以上，品牌供应占比高可获得抽佣折扣 推广费用：与品牌发展阶段、品类特性相关，服饰品类推广费用相对更高 三类核心卖家特点与壁垒： 品牌型卖家（精品卖家）：业务聚焦单一品类、拥有自主品牌、依托AI实现智能运营、普遍采用海外仓履约；核心壁垒为差异化的产品能力与数字化经营能力，需打通上下游全流程提升定价能力与利润率；目前普遍尝试横纵向延伸打造第二成长曲线，需关注新老品类底层能力复用性与组织架构灵活性，代表企业有致欧科技、赛维时代、乐歌股份、绿联科技等 供应链型卖家：SKU数量通常上万个，采购依赖上游小B厂商与1688等平台，核心壁垒为数字化选品能力与供应链效率，需精准识别潜在爆品、高效响应需求；目前正加速向品牌型卖家转型，考验品类筛选、全产业链转型能力，代表企业有华凯易佰、三态股份、吉宏股份、跨境通等 平台型企业：卖家需顺应平台规则实现增长： 亚马逊：定位品质型消费，重视用户评价、产品力，适合培育品牌与大单品；2025年四季度到2026年一季度6个月内，全球封号数量同比增长37%，其中中国卖家占比42%，合规化趋严背景下利好合规头部卖家；平台规则向精细化（梯度化佣金）、高效率（仓储效率低的卖家加收附加费，资源向高周转企业倾斜）、合规化方向调整 Temu：全托管模式下经营门槛较低，适合成本优势突出的工厂型卖家；半托管模式目前占GMV比重约30%，后续对品牌型卖家入驻存在新机会 TikTok：定位内容电商，印尼、美国、泰国、越南、菲律宾等市场发展较好，美妆个护、女装、手机及电子产品增速快，用户以年轻人为主；流量分发依赖内容，投放成本较成熟海外媒体有优势 行业格局集中趋势：2025年亚马逊活跃卖家中中国卖家占比达50%，但呈现“腰部多、头部少”特征——亚马逊品牌销售榜前100名中中国卖家占比仅6.6%，第5000-10000名中占比达45%；头部卖家份额提升空间大，当前致欧、赛维、安克等头部企业在亚马逊单品类份额仅为2%-10%区间 头部卖家逆势增长：年销售额超100万美元的卖家数量从2021年的6万家增长至2025年的10万家，年销售额超1亿美元的卖家数量从2021年的500家增长至2025年的2350家，头部份额集中趋势明确 核心竞争力总结：跨境卖家的核心竞争力体现在全链路的效率，覆盖产品端、供应链、数字化运营、品牌建设等各环节"}], "source": "private", "stocks": ""}, {"title": "新酒水：威士忌国产化正当时", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "国泰海通食饮｜新酒水：威士忌国产化正当时", "text": "食品饮料行业发展趋势：整体消费总量扩容存在压力，但食品饮料产业存在巨大的结构升级转型机会，正从1.0阶段向2.0阶段过渡： 1.0阶段特征为便利、便宜、好入口，典型代表是泡面、冰红茶类品类。｜威士忌行业全球及区域发展现状：品类基本格局：威士忌是全球六大烈酒之首，销售额、销售量均显著领先其他烈酒品类，全球化推广程度高。区域发展特征：亚太地区是威士忌最重要且成长性最好的销售区域，销售量占全球威士忌总销量的61%，过去五年销售量复合增速达4.1%，增速领先全球大盘，具备良好的发展基础。｜威士忌行业发展经验复盘：日本行业发展经验： 发展分为四个阶段：19世纪50年代黑船事件后为导入期，威士忌作为舶来品是身份地位象征；1923年三得利创立山崎蒸馏厂、1929年推出首款本土威士忌白札后进入成长期，1963年-1983年出货量从不足5万千升/年快速扩容至32万千升/年；1984年-2007年进入衰退期，核心原因是酒税改革使威士忌单位税负上升24%，烧酒凭借更低税率、更低价格和清爽口感替代需求，叠加威士忌被年轻群体认为是“老人的酒”、经济泡沫破灭后消费者追求性价比，出货量持续下滑；2008年至今进入复苏期，龙头三得利坚持工艺研发，高端产品在国际赛事多次获奖打开知名度，同时复兴“highball（威士忌加苏打水、冰块、柠檬片）”平价饮用方式，契合低度饮酒文化，2009年起出货量恢复双位数增长。"}], "source": "private", "stocks": ""}]}, {"name": "周期", "emoji": "周", "overview": "油价从95美元回落至80美元附近修复大炼化盈利剪刀差；染料核心中间体供给收紧龙头掌握定价权，稀土\"战略金属+AI金属\"景气，国防金属脱钩预期升温。", "topics": [{"title": "再生小金属：铋行业供需格局趋紧，半导体应用需求高增 -【环保碳中和】第141场", "tags": ["收藏", "个股"], "bullets": [{"label": "私域纪要", "title": "长江环保｜再生小金属：铋行业供需格局趋紧，半导体应用需求高增 -【环保碳中和】第141场", "text": "铋金属基础属性与核心应用：铋是元素周期表第15族氮族中原子序数最大的稳定元素，核心物理化学特性包括：自然界中抗磁性最强的金属、熔点约271℃、是金属中热导率最低的元素之一、属于具备半导体特性的半金属、凝固时体积膨胀约3.3%、无毒无害对人体友好，相关特性使其在精密铸造、密封件、新兴电子领域具备独特应用价值 需求结构（2025年全球精铋消费结构，来源：安泰克2025年铋市场发展报告）： 传统领域：医药化工占比42%，铋合金及焊料占比37%，冶金添加剂占比11% 新兴领域：光伏焊带占比7%，其他领域占比3%；电子级高纯铋（纯度5N及以上）主要应用于半导体存储领域 光模块领域核心应用： 是光模块核心组件热电制冷器（TEC）的核心原材料，铋碲基合金通过帕尔帖效应将激光器芯片稳定在25℃左右，保障波长稳定性和使用寿命，是高速光模块温度控制的关键材料 可制成含铋低温焊料，在不损伤热敏光学芯片的前提下完成光电器件封装互联｜铋行业供给格局：供给刚性特征：自然界几乎无具备商业开采价值的独立铋矿，铋几乎全部作为铅锌矿、铜矿、钨矿、锡矿等其他金属冶炼的副产品被提取，再生铋是供给的核心来源 全球储量与产量格局： 储量：根据2017年美国地质局统计数据，全球铋总储量约37万吨，中国储量约24万吨，占比约2/3，为全球最高 产量：2025年全球精铋总产量约1.6万吨，其中中
